<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Compile AR Target</title>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; background: #0b0d14; color: #e8e8f0; max-width: 640px; margin: 40px auto; padding: 0 16px; }
  button, input { font: inherit; }
  button { padding: 10px 18px; border-radius: 8px; border: 0; background: #f2c6d4; color: #1a1020; cursor: pointer; }
  button:disabled { opacity: .5; }
  #log { white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 13px; color: #aab; }
  img { max-width: 100%; margin-top: 12px; border-radius: 8px; }
</style>
</head>
<body>
  <h1>Compile image target</h1>
  <p>Builds the <code>.mind</code> tracking file MindAR needs. Pick the card image, wait for compilation, then save the
     file as <code>assets/card-target.mind</code> (or the path set in <code>js/config.js</code>).</p>
  <p>The same page is used by <code>npm run compile-target</code> to do this headlessly.</p>
  <input id="file" type="file" accept="image/*">
  <button id="go" disabled>Compile</button>
  <p id="log"></p>
  <img id="preview" alt="">

  <script type="module">
    import { Compiler } from "../vendor/mind-ar/mindar-image.prod.js";

    const log = (m) => { document.getElementById("log").textContent += m + "\n"; };

    function loadImage(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error("Could not load image " + src));
        img.src = src;
      });
    }

    // Compile one or more image URLs; returns { buffer, stats }.
    async function compile(urls) {
      const images = await Promise.all(urls.map(loadImage));
      const compiler = new Compiler();
      let last = -1;
      await compiler.compileImageTargets(images, (p) => {
        const pct = Math.floor(p);
        if (pct % 10 === 0 && pct !== last) { last = pct; log(`progress ${pct}%`); }
      });
      const buffer = await compiler.exportData();
      const stats = compiler.data.map((d, i) => ({
        target: i,
        width: d.targetImage.width,
        height: d.targetImage.height,
        trackingPoints: d.trackingData.map((t) => t.points.length),
        matchingPoints: d.matchingData.map((m) => m.maximaPoints.length + m.minimaPoints.length),
      }));
      return { buffer, stats };
    }

    // Hook for tools/compile-target.mjs (headless build).
    window.compileTargets = async (urls) => {
      const { buffer, stats } = await compile(urls);
      let bin = "";
      const bytes = new Uint8Array(buffer);
      for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
      return { base64: btoa(bin), stats };
    };

    const fileInput = document.getElementById("file");
    const go = document.getElementById("go");
    fileInput.onchange = () => {
      go.disabled = !fileInput.files.length;
      if (fileInput.files.length) document.getElementById("preview").src = URL.createObjectURL(fileInput.files[0]);
    };
    go.onclick = async () => {
      go.disabled = true;
      try {
        const { buffer, stats } = await compile([URL.createObjectURL(fileInput.files[0])]);
        log(JSON.stringify(stats));
        const a = document.createElement("a");
        a.href = URL.createObjectURL(new Blob([buffer]));
        a.download = "card-target.mind";
        a.click();
        log("Done — card-target.mind downloaded.");
      } catch (e) {
        log("Error: " + e.message);
      } finally {
        go.disabled = false;
      }
    };
    window.compilerReady = true;
  </script>
</body>
</html>
