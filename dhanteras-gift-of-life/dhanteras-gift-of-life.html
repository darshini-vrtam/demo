<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dhanteras: The Ocean That Gave Us the Gift of Life</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="An interactive, narrated Madhubani-inspired story of Samudra Manthan and Lord Dhanvantari for children aged 6 to 10.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Yatra+One&display=swap">
<style>
/* Layout: one painted 16:9 (or 9:16 on phones) folk-art panel fills the screen; captions, prompts and controls float over its ocean and sky margins. */
:root{
  --indigo:#24345C; --ocean:#367F9C; --turq:#64B9B0; --ivory:#FFF1D0; --gold:#D9A441;
  --verm:#C74735; --terra:#B96845; --leaf:#568653; --pink:#E889A3; --ink:#252020;
  --bg:#F3DFB4; --fg:#252020; --panel:#FFF1D0; --panel-fg:#252020; --line:#252020; --focus:#C74735;
  --font-display:"Yatra One","Kohinoor Devanagari","Palatino Linotype",Georgia,serif;
  --font-body:"Baloo 2","Trebuchet MS","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#1A2440; --fg:#FFF1D0; --focus:#D9A441; color-scheme:dark } }
:root[data-theme="dark"]{ --bg:#1A2440; --fg:#FFF1D0; --focus:#D9A441; color-scheme:dark }
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px}
#app{position:relative;width:100%;height:100%;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#stage{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:manipulation;overflow:hidden}
#stage [data-hit]{cursor:pointer}
#stage [data-hit]:focus{outline:none}
#stage [data-hit]:focus-visible .focusring{stroke:var(--focus);stroke-width:6;stroke-dasharray:10 8;opacity:1}
.focusring{fill:none;opacity:0}
[hidden]{display:none!important}
button{font-family:var(--font-body)}
button:focus-visible{outline:3px solid var(--focus);outline-offset:3px}

/* HUD: progress lotuses on the left, sound and skip controls on the right */
#hud{position:absolute;top:8px;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;z-index:6;pointer-events:none}
#hud > *{pointer-events:auto}
#prog{display:flex;align-items:center;gap:8px;background:var(--panel);color:var(--panel-fg);border:3px double var(--line);border-radius:999px;padding:5px 12px 5px 8px;min-width:0}
#prog ol{display:flex;gap:3px;margin:0;padding:0;list-style:none}
#prog li{width:16px;height:16px}
#prog li svg{width:16px;height:16px;display:block}
#prog li .p{fill:var(--ivory);stroke:var(--ink);stroke-width:1.6}
#prog li.done .p{fill:var(--gold)}
#prog li.now .p{fill:var(--verm)}
#progName{font:600 13px/1.1 var(--font-body);letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ctl{display:flex;gap:6px;flex-shrink:0}
.hb{min-width:46px;height:46px;border-radius:23px;border:3px double var(--ink);background:var(--ivory);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:4px;
  cursor:pointer;padding:0 10px;font:700 13px/1 var(--font-body);letter-spacing:.03em}
.hb svg{width:22px;height:22px;flex-shrink:0}
.hb[aria-pressed="true"]{background:var(--gold)}
.hb:hover{background:#FBE3AE}
.hb[aria-pressed="true"]:hover{background:#E5B65A}

/* Instruction scroll: the activity prompt, framed like a painted cartouche */
#instr{position:absolute;top:64px;left:0;right:0;margin-inline:auto;width:fit-content;z-index:5;max-width:min(640px,calc(100% - 24px));
  background:var(--ivory);color:var(--ink);border:3px solid var(--ink);border-radius:18px;padding:8px 14px;
  box-shadow:0 0 0 5px var(--gold),0 0 0 8px var(--ink);display:flex;align-items:center;gap:10px;margin-top:6px}
#instr svg{width:34px;height:34px;flex-shrink:0}
#instr .tx{min-width:0}
#instrText{font:400 clamp(17px,2.3vw,24px)/1.2 var(--font-display);margin:0;text-wrap:balance}
#instrHint{font:600 14px/1.2 var(--font-body);color:var(--verm);margin:2px 0 0}
#bGo{margin-left:4px;flex-shrink:0;height:42px;border-radius:21px;border:3px double var(--ink);background:var(--gold);color:var(--ink);font:700 15px/1 var(--font-body);padding:0 14px;cursor:pointer}
#instr.pop{animation:pop .5s ease}
@keyframes pop{0%{transform:scale(.85);opacity:0}100%{transform:scale(1);opacity:1}}

/* Caption: verbatim narration, current sentence underlined in gold */
#cap{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);z-index:5;width:min(920px,100%);
  background:rgba(255,241,208,.96);color:var(--ink);border:3px double var(--ink);border-radius:14px;padding:8px 16px 10px}
#capText{margin:0;font:500 clamp(16px,1.9vw,21px)/1.38 var(--font-body);text-wrap:pretty}
#capText .cur{background:linear-gradient(transparent 70%,rgba(217,164,65,.55) 70%)}
#capText .spent{opacity:.62}
#cap.cue #capText{font-family:var(--font-display);font-weight:400;color:var(--verm)}

/* Veil: soft ivory lotus fade between scenes */
#veil{position:absolute;inset:0;z-index:4;background:var(--ivory);opacity:0;pointer-events:none;display:grid;place-items:center;transition:opacity .45s ease}
#veil.on{opacity:1}
#veil svg{width:120px;height:120px;animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Start and end cards */
.card{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:7;width:min(560px,calc(100% - 44px));max-height:calc(100% - 44px);overflow:auto;text-align:center;
  background:var(--ivory);color:var(--ink);border:4px solid var(--ink);border-radius:22px;padding:22px 20px 20px;
  box-shadow:0 0 0 7px var(--verm),0 0 0 11px var(--ink),0 0 0 17px var(--gold),0 0 0 20px var(--ink)}
.card h1{font:400 clamp(30px,6vw,54px)/1 var(--font-display);margin:0;color:var(--verm);text-wrap:balance}
.card h2{font:400 clamp(17px,2.8vw,24px)/1.2 var(--font-display);margin:6px 0 12px;color:var(--indigo);text-wrap:balance}
.card p{margin:0 auto 14px;max-width:44ch;font:500 16px/1.4 var(--font-body)}
.card .row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.big{min-height:54px;border-radius:27px;border:3px double var(--ink);background:var(--gold);color:var(--ink);font:700 19px/1 var(--font-body);padding:0 24px;cursor:pointer}
.big.alt{background:var(--ivory)}
.big:hover{filter:brightness(1.05)}
.card small{display:block;margin-top:12px;font:500 13px/1.35 var(--font-body);opacity:.8}
#endBar{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);z-index:6;display:flex;gap:10px;flex-wrap:wrap;justify-content:center;width:min(560px,100%)}

@media (max-width:620px){
  .hb .lbl{display:none}
  .hb{min-width:44px;height:44px;padding:0 8px}
  #progName{display:none}
  #instr{top:58px}
  #capText{font-size:16px;line-height:1.33}
}
@media (max-height:460px){
  #instr{top:56px;padding:5px 10px}
  #instrText{font-size:17px}
  #capText{font-size:15px;line-height:1.3}
  #cap{padding:5px 12px 6px}
  .card{transform:translate(-50%,-50%) scale(.82)}
}
@media (prefers-reduced-motion: reduce){ #veil svg{animation:none} #instr.pop{animation:none} #veil{transition:none} }
</style>

</head>
<body>
<div id="app">
  <svg id="stage" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Illustrated story scene"></svg>

  <div id="hud">
    <div id="prog" aria-label="Story progress">
      <ol id="progDots"></ol><span id="progName">Ocean of Wonders</span>
    </div>
    <div id="ctl">
      <button class="hb" id="bMute" aria-pressed="false" aria-label="Mute sound" title="Mute sound">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path id="mWave" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11"/><path id="mX" d="M16 9l5 6M21 9l-5 6" style="display:none"/></svg>
      </button>
      <button class="hb" id="bMusic" aria-pressed="true" aria-label="Music and sound effects on" title="Music and sound effects">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l11-2v13"/><circle cx="6.5" cy="18" r="2.6" fill="currentColor"/><circle cx="17.5" cy="16" r="2.6" fill="currentColor"/></svg>
      </button>
      <button class="hb" id="bSkip" aria-label="Skip this narration line" title="Skip this line">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 5l9 7-9 7z"/><rect x="16" y="5" width="3" height="14" rx="1"/></svg><span class="lbl">Skip</span>
      </button>
      <button class="hb" id="bNext" aria-label="Go to the next scene" title="Next scene">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 5l8 7-8 7zM12 5l8 7-8 7z"/></svg><span class="lbl">Next</span>
      </button>
    </div>
  </div>

  <div id="instr" hidden role="status" aria-live="polite">
    <svg viewBox="-20 -20 40 40" aria-hidden="true"><g stroke="#252020" stroke-width="1.6"><path d="M0 8C-6 2-6-8 0-15C6-8 6 2 0 8Z" fill="#E889A3"/><path d="M0 8C-10 6-15-2-15-8C-8-7-3-3 0 8Z" fill="#E889A3"/><path d="M0 8C10 6 15-2 15-8C8-7 3-3 0 8Z" fill="#E889A3"/><path d="M-14 10H14" stroke-width="2.4"/></g></svg>
    <div class="tx"><p id="instrText"></p><p id="instrHint" hidden></p></div>
    <button id="bGo" hidden>Continue</button>
  </div>

  <div id="cap" hidden aria-live="polite"><p id="capText"></p></div>

  <div id="veil" aria-hidden="true"><svg viewBox="-60 -60 120 120"><g id="veilArt"></g></svg></div>

  <div class="card" id="startCard">
    <h1>Dhanteras</h1>
    <h2>The Ocean That Gave Us the Gift of Life</h2>
    <p>Become an Ocean Explorer! Listen to the story and help it along by tapping the glowing things.</p>
    <div class="row"><button class="big" id="bBegin">Begin the Story</button></div>
    <button class="big alt" id="bResume" hidden style="margin-top:10px">Continue from Scene 2</button>
    <small>Turn the sound on to hear the narrator. Every word is also shown on screen.</small>
  </div>

  <div id="endBar" hidden>
    <button class="big" id="bReplay">Replay Story</button>
    <button class="big alt" id="bExplore">Explore Again</button>
  </div>
</div>

<script>
'use strict';
/* ===== Palette: the only hues in the painting (mixes below are a colour layered at partial opacity over another) ===== */
const PAL={indigo:'#24345C',ocean:'#367F9C',turq:'#64B9B0',ivory:'#FFF1D0',gold:'#D9A441',verm:'#C74735',terra:'#B96845',leaf:'#568653',pink:'#E889A3',ink:'#252020'};
function mix(a,b,t){const A=parseInt(a.slice(1),16),B=parseInt(b.slice(1),16);
  const r=Math.round((A>>16)+((B>>16)-(A>>16))*t),g=Math.round(((A>>8)&255)+(((B>>8)&255)-((A>>8)&255))*t),bl=Math.round((A&255)+((B&255)-(A&255))*t);
  return '#'+((1<<24)|(r<<16)|(g<<8)|bl).toString(16).slice(1)}
const SK={light:mix(PAL.ivory,PAL.terra,.4),warm:mix(PAL.ivory,PAL.terra,.62),deva:mix(PAL.ivory,PAL.gold,.45),asura:PAL.terra,
  vishnu:mix(PAL.ocean,PAL.indigo,.2),neel:mix(PAL.ocean,PAL.turq,.35)};
const TINT={milk:mix(PAL.ivory,PAL.turq,.22),milk2:mix(PAL.ivory,PAL.turq,.4),deep:mix(PAL.turq,PAL.ocean,.5),
  violet:mix(PAL.indigo,PAL.pink,.42),plum:mix(PAL.indigo,PAL.pink,.25),lilac:mix(PAL.indigo,PAL.pink,.62),
  sky:mix(PAL.ivory,PAL.gold,.12),paleGold:mix(PAL.ivory,PAL.gold,.45),blush:mix(PAL.ivory,PAL.pink,.35),shell:mix(PAL.leaf,PAL.turq,.25)};
const TAU=Math.PI*2,clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,ss=t=>{t=clamp(t,0,1);return t*t*(3-2*t)};
const Ease={lin:t=>t,io:t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2,out:t=>1-Math.pow(1-t,3),in:t=>t*t*t,back:t=>{const c=1.6;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)}};
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const RM=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
const $=id=>document.getElementById(id);

/* ===== SVG builder ===== */
const NS='http://www.w3.org/2000/svg';
function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);if(attrs)for(const k in attrs){const v=attrs[k];if(v!=null&&v!==false)e.setAttribute(k,v)}if(parent)parent.appendChild(e);return e}
function grp(parent,attrs){return el('g',attrs,parent)}
const f1=n=>Math.round(n*10)/10;
function tf(e,x,y,s,r,sx){/* translate, uniform scale, rotate (deg), optional x-flip */
  let t=`translate(${f1(x)} ${f1(y)})`;if(r)t+=` rotate(${f1(r)})`;if(s!=null&&s!==1)t+=` scale(${f1(s*(sx||1)*1000)/1000} ${Math.round(s*1000)/1000})`;else if(sx&&sx!==1)t+=` scale(${sx} 1)`;
  if(e._t!==t){e.setAttribute('transform',t);e._t=t}}
function setA(e,k,v){if(!e)return;const key='_'+k;if(e[key]!==v){e.setAttribute(k,v);e[key]=v}}
function op(e,v){setA(e,'opacity',f1(clamp(v,0,1)*100)/100)}

/* Catmull-Rom through points -> smooth cubic path (hand-drawn shapes are authored as point lists) */
function cr(pts,closed,k){k=k==null?1:k;const n=pts.length;if(n<2)return'';const P=i=>closed?pts[(i+n)%n]:pts[clamp(i,0,n-1)];
  let d=`M${f1(pts[0][0])} ${f1(pts[0][1])}`;const last=closed?n:n-1;
  for(let i=0;i<last;i++){const p0=P(i-1),p1=P(i),p2=P(i+1),p3=P(i+2);
    d+=`C${f1(p1[0]+(p2[0]-p0[0])/6*k)} ${f1(p1[1]+(p2[1]-p0[1])/6*k)} ${f1(p2[0]-(p3[0]-p1[0])/6*k)} ${f1(p2[1]-(p3[1]-p1[1])/6*k)} ${f1(p2[0])} ${f1(p2[1])}`}
  return closed?d+'Z':d}
/* slightly irregular ellipse, for hand-drawn rounds */
function blob(cx,cy,rx,ry,seed,j,n){n=n||12;j=j==null?.04:j;const r=rng(seed||7);const pts=[];
  for(let i=0;i<n;i++){const a=i/n*TAU,w=1+(r()-.5)*2*j;pts.push([cx+Math.cos(a)*rx*w,cy+Math.sin(a)*ry*w])}return cr(pts,true)}
function mirror(pts){/* right-half outline from the top axis point to the bottom axis point -> full symmetric outline */
  return pts.concat(pts.slice(1,-1).reverse().map(p=>[-p[0],p[1]]))}

/* ===== Clock, tweens and timers (all driven by one rAF clock so Skip and scene changes can cancel cleanly) ===== */
const Clock={now:0,last:0};
const Tw={list:[],
  to(obj,props,ms,ease){ease=ease||Ease.io;const from={};for(const k in props)from[k]=obj[k];
    return new Promise(res=>{if(!ms||ms<=0){Object.assign(obj,props);res();return}this.list.push({obj,props,from,t0:Clock.now,ms,ease,res})})},
  update(){const keep=[];for(const t of this.list){const k=clamp((Clock.now-t.t0)/t.ms,0,1),e=t.ease(k);
      for(const p in t.props)t.obj[p]=t.from[p]+(t.props[p]-t.from[p])*e;if(k>=1)t.res();else keep.push(t)}this.list=keep},
  finishAll(){for(const t of this.list){Object.assign(t.obj,t.props);t.res()}this.list=[]},
  clear(){this.list=[]}};
const Timers={list:[],add(ms,fn){const t={at:Clock.now+ms,fn};this.list.push(t);return t},cancel(t){this.list=this.list.filter(x=>x!==t)},
  update(){if(!this.list.length)return;const due=this.list.filter(t=>t.at<=Clock.now);if(!due.length)return;this.list=this.list.filter(t=>t.at>Clock.now);due.forEach(t=>t.fn())},
  clear(){this.list=[]}};

/* ===== Storage: only the child's chosen treasures and the furthest scene reached ===== */
const Store={k:"dhanteras.giftoflife.v1",data:{treasures:[],reached:0},
  load(){try{const s=localStorage.getItem(this.k);if(s){const d=JSON.parse(s);if(d&&typeof d==='object'){
      if(Array.isArray(d.treasures))this.data.treasures=d.treasures.filter(x=>typeof x==='string').slice(0,5);
      if(Number.isInteger(d.reached))this.data.reached=clamp(d.reached,0,6)}}}catch(e){}},
  save(){try{localStorage.setItem(this.k,JSON.stringify(this.data))}catch(e){}},
  setTreasures(a){this.data.treasures=a.slice();this.save()},
  reach(i){this.data.reached=i;this.save()}};

/* ===== Folk-art pattern fills (shared <pattern> defs, created once and reused) ===== */
const Pat={defs:null,cache:{},n:0,
  get(kind,fg,bg,s,key){s=s||12;key=key||[kind,fg,bg,s].join('|');const c=this.cache[key];if(c)return c.url;
    const id='pt'+(this.n++);const p=el('pattern',{id,patternUnits:'userSpaceOnUse',width:s,height:s},this.defs);
    if(bg)el('rect',{width:s,height:s,fill:bg},p);this.draw(p,kind,fg,s);this.cache[key]={url:`url(#${id})`,el:p};return `url(#${id})`},
  el(key){const c=this.cache[key];return c&&c.el},
  draw(p,k,fg,s){const L=(d,w)=>el('path',{d,fill:'none',stroke:fg,'stroke-width':w||s*.12,'stroke-linecap':'round'},p),F=d=>el('path',{d,fill:fg},p),O=(x,y,r)=>el('circle',{cx:x,cy:y,r,fill:fg},p);
    switch(k){
      case'dots':O(s/2,s/2,s*.16);break;
      case'dots2':O(s/4,s/4,s*.12);O(s*.75,s*.75,s*.12);break;
      case'stripe':L(`M0 ${s}L${s} 0M${-s/2} ${s/2}L${s/2} ${-s/2}M${s/2} ${s*1.5}L${s*1.5} ${s/2}`,s*.16);break;
      case'hstripe':L(`M0 ${s/2}H${s}`,s*.2);break;
      case'vstripe':L(`M${s/2} 0V${s}`,s*.2);break;
      case'hatch':L(`M0 ${s}L${s} 0M0 0L${s} ${s}`,s*.08);break;
      case'scale':L(`M0 ${s}A${s/2} ${s/2} 0 0 1 ${s} ${s}M${-s/2} ${s/2}A${s/2} ${s/2} 0 0 1 ${s/2} ${s/2}M${s/2} ${s/2}A${s/2} ${s/2} 0 0 1 ${s*1.5} ${s/2}`,s*.09);O(s/2,s*.78,s*.07);O(0,s*.28,s*.07);O(s,s*.28,s*.07);break;
      case'chev':L(`M0 ${s*.7}L${s/2} ${s*.3}L${s} ${s*.7}`,s*.13);break;
      case'flower':for(let i=0;i<4;i++){const a=i*TAU/4;O(s/2+Math.cos(a)*s*.17,s/2+Math.sin(a)*s*.17,s*.11)}O(0,0,s*.06);O(s,0,s*.06);O(0,s,s*.06);O(s,s,s*.06);break;
      case'tiger':L(`M${s*.1} 0Q${s*.38} ${s*.45} ${s*.16} ${s}M${s*.62} ${s*.08}Q${s*.86} ${s*.4} ${s*.58} ${s*.72}`,s*.1);break;
      case'tri':F(`M0 ${s}L${s/2} ${s*.2}L${s} ${s}Z`);break;
      case'wave':L(`M0 ${s*.62}Q${s*.25} ${s*.25} ${s*.5} ${s*.62}T${s} ${s*.62}`,s*.09);break;
      case'check':F(`M${s/2} ${s*.18}L${s*.82} ${s/2}L${s/2} ${s*.82}L${s*.18} ${s/2}Z`);break;
      case'leafy':F(`M${s*.2} ${s*.8}Q${s*.2} ${s*.2} ${s*.8} ${s*.2}Q${s*.8} ${s*.8} ${s*.2} ${s*.8}Z`);break;
      case'curl':L(`M${s*.2} ${s*.5}A${s*.22} ${s*.22} 0 1 1 ${s*.5} ${s*.72}A${s*.12} ${s*.12} 0 1 1 ${s*.48} ${s*.48}`,s*.08);O(s*.9,s*.12,s*.05);break;
      case'grain':O(s*.3,s*.3,s*.05);O(s*.75,s*.6,s*.04);O(s*.4,s*.85,s*.035);break;
    }}};

/* Outlined shape: flat fill, optional pattern, bold ink contour with a thin ivory gap that reads as a double line */
function shape(p,d,fill,o){o=o||{};const g=grp(p,o.attrs);const w=o.w==null?5:o.w;
  const base=el('path',{d,fill},g);g.fillEl=base;
  if(o.pat)g.patEl=el('path',{d,fill:o.pat,opacity:o.patOp},g);
  if(w>0){el('path',{d,fill:'none',stroke:PAL.ink,'stroke-width':w,'stroke-linejoin':'round','stroke-linecap':'round'},g);
    if(o.dbl!==false&&w>=3.5)el('path',{d,fill:'none',stroke:o.inner||PAL.ivory,'stroke-width':w*.34,'stroke-linejoin':'round',opacity:.9},g)}
  return g}
function line(p,d,o){o=o||{};return el('path',{d,fill:'none',stroke:o.c||PAL.ink,'stroke-width':o.w||3,'stroke-linecap':'round','stroke-linejoin':'round',opacity:o.op,'stroke-dasharray':o.dash},p)}
function dot(p,x,y,r,fill,o){o=o||{};return el('circle',{cx:f1(x),cy:f1(y),r,fill,stroke:o.stroke,'stroke-width':o.w},p)}
function txt(p,x,y,s,o){o=o||{};const t=el('text',{x,y,'text-anchor':o.anchor||'middle','font-family':o.font||'"Baloo 2","Trebuchet MS",system-ui,sans-serif','font-weight':o.weight||700,'font-size':o.size||28,fill:o.fill||PAL.ink,
  stroke:o.stroke,'stroke-width':o.sw,'paint-order':'stroke','letter-spacing':o.ls},p);t.textContent=s;return t}

/* ===== Petal geometry shared by lotuses, mandalas and frames ===== */
const petalD=(r,w)=>{w=w==null?.42:w;return `M0 0C${f1(r*w)} ${f1(-r*.25)} ${f1(r*w*.75)} ${f1(-r*.8)} 0 ${f1(-r)}C${f1(-r*w*.75)} ${f1(-r*.8)} ${f1(-r*w)} ${f1(-r*.25)} 0 0Z`};
const heartD=(s)=>`M0 ${f1(s*.9)}C${f1(-s*.2)} ${f1(s*.62)} ${f1(-s)} ${f1(s*.2)} ${f1(-s)} ${f1(-s*.25)}C${f1(-s)} ${f1(-s*.75)} ${f1(-s*.35)} ${f1(-s*.95)} 0 ${f1(-s*.45)}C${f1(s*.35)} ${f1(-s*.95)} ${f1(s)} ${f1(-s*.75)} ${f1(s)} ${f1(-s*.25)}C${f1(s)} ${f1(s*.2)} ${f1(s*.2)} ${f1(s*.62)} 0 ${f1(s*.9)}Z`;

/* Lotus: layered petals that open from a closed bud (set(t) 0..1) */
function lotus(p,r,o){o=o||{};const g=grp(p);const c1=o.c1||PAL.pink,c2=o.c2||TINT.blush,vein=o.vein||PAL.verm;
  if(o.pad!==false){shape(g,blob(0,r*.12,r*1.25,r*.28,o.seed||3,.05),PAL.leaf,{w:4,pat:Pat.get('hstripe',mix(PAL.leaf,PAL.ink,.25),null,9)})}
  const layers=o.wide?[{open:[-90,-68,-46,46,68,90],closed:[-12,-7,-3,3,7,12],s:1,c:c1},{open:[-78,-56,56,78],closed:[-6,-2,2,6],s:.82,c:c2},{open:[-66,66],closed:[-2,2],s:.64,c:c1}]
    :[{open:[-78,-42,0,42,78],closed:[-10,-5,0,5,10],s:1,c:c1},{open:[-55,-20,20,55],closed:[-6,-2,2,6],s:.8,c:c2},{open:[-28,0,28],closed:[-3,0,3],s:.6,c:c1}];
  const petals=[];const pod=grp(g);
  layers.forEach((L,li)=>{const lg=grp(g);L.open.forEach((a,i)=>{const pg=grp(lg);const d=petalD(r*L.s);shape(pg,d,L.c,{w:li?3.5:4.5});
      line(pg,`M0 ${-r*L.s*.18}L0 ${-r*L.s*.78}`,{c:vein,w:2});petals.push({g:pg,open:a,closed:L.closed[i],li})})});
  /* seed pod sits in front once open */
  const pg=grp(g);shape(pg,`M${-r*.28} ${-r*.2}Q0 ${-r*.42} ${r*.28} ${-r*.2}L${r*.2} 0Q0 ${r*.08} ${-r*.2} 0Z`,PAL.gold,{w:3});
  [-.12,0,.12].forEach(x=>dot(pg,x*r,-r*.2,r*.035,PAL.ink));
  const L={g,petals,pod:pg,t:-1,set(t){if(Math.abs(t-this.t)<.002)return;this.t=t;
    for(const P of petals){const k=Ease.out(clamp(t*1.5-P.li*.22,0,1));tf(P.g,0,0,lerp(.82,1,k),lerp(P.closed,P.open,k))}
    op(pg,o.noPod?0:clamp(t*2-1,0,1))}};L.set(o.t||0);return L}

/* Mandala: concentric ornamental rings that expand from the centre (set(t) 0..1, spin(a)) */
function mandala(p,r,o){o=o||{};const g=grp(p);const rings=[];const pal=o.pal||[PAL.gold,PAL.verm,PAL.pink,PAL.turq,PAL.ivory];
  const R=(fn)=>{const rg=grp(g);fn(rg);rings.push(rg);return rg};
  R(rg=>{shape(rg,blob(0,0,r,r,11,.0,24),o.bg||TINT.paleGold,{w:4,pat:Pat.get('dots2',mix(PAL.gold,PAL.ivory,.3),null,16)});
    for(let i=0;i<36;i++){const a=i/36*TAU;el('path',{d:`M${f1(Math.cos(a)*r*.86)} ${f1(Math.sin(a)*r*.86)}L${f1(Math.cos(a+.087)*r)} ${f1(Math.sin(a+.087)*r)}L${f1(Math.cos(a-.087)*r)} ${f1(Math.sin(a-.087)*r)}Z`,fill:i%2?pal[1]:pal[0],stroke:PAL.ink,'stroke-width':2},rg)}});
  R(rg=>{for(let i=0;i<16;i++){const pg=grp(rg,{transform:`rotate(${i*22.5}) translate(0 ${-r*.44})`});shape(pg,petalD(r*.4,.38),i%2?pal[2]:pal[0],{w:3});line(pg,`M0 ${-r*.08}L0 ${-r*.3}`,{w:2,c:i%2?PAL.verm:PAL.ivory})}});
  R(rg=>{el('circle',{r:r*.43,fill:'none',stroke:PAL.ink,'stroke-width':3},rg);for(let i=0;i<24;i++){const a=i/24*TAU;dot(rg,Math.cos(a)*r*.395,Math.sin(a)*r*.395,r*.018,PAL.ink)}});
  R(rg=>{for(let i=0;i<8;i++){const pg=grp(rg,{transform:`rotate(${i*45+22.5})`});shape(pg,petalD(r*.36,.5),i%2?pal[3]:pal[1],{w:3})}
    shape(rg,blob(0,0,r*.16,r*.16,5,0,12),PAL.gold,{w:3,pat:Pat.get('dots',PAL.verm,null,8)})});
  const M={g,rings,t:-1,set(t){if(Math.abs(t-this.t)<.002)return;this.t=t;rings.forEach((rg,i)=>{const k=Ease.back(clamp(t*1.6-(rings.length-1-i)*.16,0,1));tf(rg,0,0,Math.max(.001,k),rg._rot||0);op(rg,clamp(k*3,0,1))})},
    spin(a){rings.forEach((rg,i)=>{rg._rot=(i%2?-a:a)*(1+i*.15)});const t=this.t;this.t=-1;this.set(t)}};M.set(o.t==null?1:o.t);return M}

/* Sun with a friendly face and turning rays, as in many folk paintings */
function sun(p,r){const g=grp(p);const rays=grp(g);
  for(let i=0;i<16;i++){const pg=grp(rays,{transform:`rotate(${i*22.5})`});shape(pg,`M${-r*.16} ${-r*.92}L0 ${-r*1.42}L${r*.16} ${-r*.92}Z`,i%2?PAL.verm:PAL.gold,{w:3,dbl:false})}
  shape(g,blob(0,0,r,r,4,.01,16),PAL.gold,{w:4.5,pat:Pat.get('dots',mix(PAL.gold,PAL.verm,.35),null,10)});
  shape(g,blob(0,0,r*.68,r*.68,8,.01,16),mix(PAL.gold,PAL.ivory,.4),{w:3});
  const e=r*.24;[-1,1].forEach(s=>{el('path',{d:`M${s*e-r*.13} ${-r*.08}Q${s*e} ${-r*.2} ${s*e+r*.13} ${-r*.08}Q${s*e} ${-r*.01} ${s*e-r*.13} ${-r*.08}Z`,fill:PAL.ivory,stroke:PAL.ink,'stroke-width':2.4},g);dot(g,s*e,-r*.09,r*.05,PAL.ink)});
  line(g,`M${-r*.2} ${r*.2}Q0 ${r*.36} ${r*.2} ${r*.2}`,{w:3,c:PAL.verm});
  return{g,rays}}

/* Scalloped cloud with dotted fill */
function cloud(p,w,seed){const g=grp(p);const r=rng(seed||1);const n=Math.max(3,Math.round(w/60));let d=`M${-w/2} 0`;
  for(let i=0;i<n;i++){const x0=-w/2+i*w/n,x1=x0+w/n,h=w/n*(.55+r()*.3);d+=`C${f1(x0)} ${f1(-h)} ${f1(x1)} ${f1(-h)} ${f1(x1)} 0`}d+='Z';
  shape(g,d,PAL.ivory,{w:4,pat:Pat.get('dots2',TINT.milk2,null,14)});
  for(let i=0;i<n;i++){const x=-w/2+(i+.5)*w/n;line(g,`M${f1(x-w/n*.22)} -4Q${f1(x)} ${f1(-w/n*.38)} ${f1(x+w/n*.22)} -4`,{w:2.2,c:PAL.ocean})}
  return g}

/* Painted frame: triangle band between two ink rules */
function border(p,W,H,o){o=o||{};const g=grp(p,{'pointer-events':'none'});const b=o.b||18,m=4;
  el('path',{d:`M${m} ${m}H${W-m}V${H-m}H${m}Z M${m+b} ${m+b}V${H-m-b}H${W-m-b}V${m+b}Z`,fill:Pat.get('tri',PAL.verm,PAL.gold,b),'fill-rule':'evenodd'},g);
  el('rect',{x:m,y:m,width:W-2*m,height:H-2*m,fill:'none',stroke:PAL.ink,'stroke-width':5},g);
  el('rect',{x:m+b,y:m+b,width:W-2*m-2*b,height:H-2*m-2*b,fill:'none',stroke:PAL.ink,'stroke-width':3.5},g);
  [[m+b/2,m+b/2],[W-m-b/2,m+b/2],[m+b/2,H-m-b/2],[W-m-b/2,H-m-b/2]].forEach(([x,y])=>{dot(g,x,y,b*.62,PAL.verm,{stroke:PAL.ink,w:3});dot(g,x,y,b*.22,PAL.ivory)});
  return g}

/* ===== Ocean of Milk: rows of scalloped waves with curls, each row sliding on its own ===== */
function waveRowD(x0,x1,y,wl,amp,depth){let d=`M${x0} ${y+depth}V${y}`;for(let x=x0;x<x1;x+=wl)d+=`Q${f1(x+wl/2)} ${f1(y-amp*2)} ${f1(x+wl)} ${y}`;return d+`V${y+depth}Z`}
function curlsD(x0,x1,y,wl,amp){let d='';const r=amp*.42;for(let x=x0;x<x1;x+=wl){const cx=x+wl/2,cy=y-amp*.35;
    d+=`M${f1(cx+r)} ${f1(cy)}A${f1(r)} ${f1(r)} 0 1 1 ${f1(cx-r*.2)} ${f1(cy+r*.95)}A${f1(r*.55)} ${f1(r*.55)} 0 1 1 ${f1(cx+r*.1)} ${f1(cy+r*.1)}`}return d}
function ocean(p,W,H,y0,o){o=o||{};const g=grp(p);const rows=[];const n=o.rows||8;let y=y0;const r=rng(o.seed||5);
  let wsum=0;for(let i=0;i<n;i++)wsum+=lerp(1,1.9,i/(n-1));const unit=(H-y0+30)/wsum;
  const fills=[PAL.ivory,TINT.milk,PAL.ivory,TINT.milk2,PAL.ivory,TINT.milk,PAL.ivory,TINT.milk2];
  for(let i=0;i<n;i++){const wl=o.wl?o.wl:lerp(70,130,i/(n-1)),amp=lerp(9,18,i/(n-1));const rg=grp(g);const x0=-wl*3,x1=W+wl*3;
    const fill=fills[i%fills.length];el('path',{d:waveRowD(x0,x1,y,wl,amp,H-y+80),fill},rg);
    if(i%2===1)el('path',{d:waveRowD(x0,x1,y,wl,amp,H-y+80),fill:Pat.get('dots2',mix(fill,PAL.ocean,.25),null,18),opacity:.8},rg);
    el('path',{d:waveRowD(x0,x1,y,wl,amp,0).replace(/V[\d.]+Z$/,''),fill:'none',stroke:PAL.ink,'stroke-width':4,'stroke-linejoin':'round'},rg);
    el('path',{d:waveRowD(x0,x1,y,wl,amp,0).replace(/V[\d.]+Z$/,''),fill:'none',stroke:i%2?PAL.ocean:PAL.turq,'stroke-width':1.6,transform:'translate(0 5)'},rg);
    el('path',{d:curlsD(x0,x1,y,wl,amp),fill:'none',stroke:i%3===2?PAL.ocean:PAL.turq,'stroke-width':3,'stroke-linecap':'round'},rg);
    rows.push({g:rg,wl,dir:i%2?-1:1,sp:.6+r()*.5,ph:r()*TAU,y});y+=unit*lerp(1,1.9,i/(n-1))}
  const dark=el('rect',{x:-200,y:y0-40,width:W+400,height:H-y0+120,fill:TINT.violet,opacity:0,'pointer-events':'none'},g);
  const gold=el('rect',{x:-200,y:y0-40,width:W+400,height:H-y0+120,fill:Pat.get('dots2',PAL.gold,null,22),opacity:0,'pointer-events':'none'},g);
  const O={g,rows,dark,gold,off:0,
    update(t,dt,speed,bob){this.off+=dt*speed*.045;for(const R of rows){const x=((this.off*R.sp*R.dir*R.wl)%R.wl+R.wl)%R.wl-R.wl;tf(R.g,x,Math.sin(t*.0012*R.sp+R.ph)*(bob==null?3:bob))}}};
  return O}

/* Madhubani fish: almond body with scale fill, forked tail, big eye */
function fish(p,len,c1,c2,seed){const g=grp(p);const L=len,h=len*.3;
  shape(g,`M${-L*.42} 0L${-L*.62} ${-h*.9}Q${-L*.5} 0 ${-L*.62} ${h*.9}Z`,c2,{w:3.5,dbl:false});
  shape(g,`M${L*.5} 0C${L*.3} ${-h*1.25} ${-L*.25} ${-h*1.1} ${-L*.45} 0C${-L*.25} ${h*1.1} ${L*.3} ${h*1.25} ${L*.5} 0Z`,c1,{w:4,pat:Pat.get('scale',PAL.ink,null,Math.max(8,L*.12))});
  shape(g,`M${L*.5} 0C${L*.4} ${-h*.8} ${L*.18} ${-h*.85} ${L*.12} 0C${L*.18} ${h*.85} ${L*.4} ${h*.8} ${L*.5} 0Z`,c2,{w:3,dbl:false});
  shape(g,`M${-L*.05} ${-h*.85}Q${-L*.1} ${-h*1.5} ${-L*.25} ${-h*1.25}Q${-L*.2} ${-h*.9} ${-L*.1} ${-h*.75}Z`,c2,{w:2.6,dbl:false});
  el('ellipse',{cx:L*.32,cy:-h*.12,rx:L*.07,ry:L*.055,fill:PAL.ivory,stroke:PAL.ink,'stroke-width':2.2},g);dot(g,L*.335,-h*.12,L*.035,PAL.ink);
  return g}

/* Bubble: plain outlined circle */
function bubble(p,r){const g=grp(p);el('circle',{r,fill:PAL.ivory,stroke:PAL.ink,'stroke-width':2.4},g);dot(g,-r*.35,-r*.35,r*.2,PAL.turq);return g}

/* Stylised tree for Mount Mandara and the closing border */
function tree(p,s,c){const g=grp(p);shape(g,`M-5 0L-4 ${-s*.5}L4 ${-s*.5}L5 0Z`,PAL.terra,{w:2.5,dbl:false});
  shape(g,blob(0,-s*.75,s*.38,s*.34,s|0,.08,10),c||PAL.leaf,{w:3,pat:Pat.get('leafy',mix(PAL.leaf,PAL.ink,.3),null,10)});return g}

/* Amrit Kalash: golden pot, illuminable dot band, a window for the child's treasure motifs, nectar dome */
function kalash(p,s){const g=grp(p);s=s||1;const K={g,dots:[]};
  const S=v=>f1(v*s);
  shape(g,`M${S(-34)} ${S(56)}L${S(34)} ${S(56)}L${S(42)} ${S(80)}L${S(-42)} ${S(80)}Z`,PAL.gold,{w:4,pat:Pat.get('tri',PAL.verm,null,10)});
  K.body=shape(g,cr([[0,S(-48)],[S(46),S(-38)],[S(66),S(-6)],[S(62),S(30)],[S(36),S(58)],[0,S(64)],[S(-36),S(58)],[S(-62),S(30)],[S(-66),S(-6)],[S(-46),S(-38)]],true),PAL.gold,{w:5,pat:Pat.get('dots2',mix(PAL.gold,PAL.terra,.4),null,14)});
  el('path',{d:`M${S(-63)} ${S(-12)}Q0 ${S(2)} ${S(63)} ${S(-12)}L${S(64)} ${S(2)}Q0 ${S(16)} ${S(-64)} ${S(2)}Z`,fill:PAL.verm,stroke:PAL.ink,'stroke-width':2.6},g);
  for(let i=0;i<9;i++){const x=lerp(-52,52,i/8),y=-5+(1-Math.pow(x/64,2))*7;K.dots.push(el('circle',{cx:S(x),cy:S(y),r:S(3.6),fill:PAL.ivory,stroke:PAL.ink,'stroke-width':1.4},g))}
  K.window=shape(g,blob(0,S(32),S(46),S(24),9,.02,14),mix(PAL.gold,PAL.ivory,.55),{w:3});
  K.motifs=grp(g,{transform:`translate(0 ${S(32)}) scale(${s})`});
  shape(g,`M${S(-24)} ${S(-62)}L${S(24)} ${S(-62)}L${S(20)} ${S(-44)}L${S(-20)} ${S(-44)}Z`,PAL.gold,{w:4,pat:Pat.get('vstripe',PAL.verm,null,7)});
  K.nectar=grp(g);shape(K.nectar,`M${S(-30)} ${S(-66)}Q0 ${S(-104)} ${S(30)} ${S(-66)}Z`,PAL.ivory,{w:3.5,pat:Pat.get('dots',TINT.milk2,null,8)});
  K.sparks=grp(K.nectar);[[-16,-96],[0,-112],[18,-98]].forEach(([x,y],i)=>{const st=grp(K.sparks,{transform:`translate(${S(x)} ${S(y)})`});el('path',{d:`M0 ${S(-8)}L${S(2.5)} ${S(-2.5)}L${S(8)} 0L${S(2.5)} ${S(2.5)}L0 ${S(8)}L${S(-2.5)} ${S(2.5)}L${S(-8)} 0L${S(-2.5)} ${S(-2.5)}Z`,fill:PAL.gold,stroke:PAL.ink,'stroke-width':1.6},st)});
  shape(g,blob(0,S(-64),S(38),S(9),2,.0,12),PAL.gold,{w:4,pat:Pat.get('dots',PAL.verm,null,7)});
  K.light=k=>{K.dots.forEach((d,i)=>{const on=k*K.dots.length>i+.5;setA(d,'fill',on?PAL.verm:PAL.ivory);setA(d,'r',on?S(4.6):S(3.6))})};
  return K}

/* Diya: clay lamp with a flat three-colour flame and a small mandala halo */

  D.halo=mandala(g,70,{t:0,pal:[PAL.gold,PAL.verm,PAL.pink,PAL.gold,PAL.ivory],bg:TINT.paleGold});tf(D.halo.g,0,-34,1);
  shape(g,`M-50 -14Q-42 22 0 24Q42 22 50 -14L66 -24Q56 -6 50 -14Q30 -4 0 -4Q-30 -4 -50 -14Z`,PAL.terra,{w:5,pat:Pat.get('tri',PAL.gold,null,12)});
  el('path',{d:'M-46 -12Q0 6 46 -12',fill:'none',stroke:PAL.ink,'stroke-width':3},g);

  D.set=(k,t)=>{op(D.flame,k);tf(D.flame,58,-30,lerp(.3,1,Ease.back(k))*(1+Math.sin(t*.008)*.04*k));D.halo.set(k*.95);D.halo.g.setAttribute('opacity',f1(k*.9*100)/100)};

/* Lotus-shaped tap frame used for the treasure choices */
function lotusFrame(p,r,c){const g=grp(p);for(let i=0;i<12;i++){const pg=grp(g,{transform:`rotate(${i*30})`});shape(pg,petalD(r*1.18,.36),i%2?c:PAL.pink,{w:3})}
  shape(g,blob(0,0,r*.86,r*.86,3,0,20),PAL.ivory,{w:4.5,pat:Pat.get('dots2',TINT.paleGold,null,16)});return g}

/* ===== The five "true wealth" symbols (drawn about 0,0 at roughly 120 units) and their small Kalash motifs ===== */
const SYMBOLS={

      shape(g,blob(4,-52,9,9,2,0,10),PAL.pink,{w:3});return g},

  setMood(m){this.mood=m},
  tone(f,t,dur,type,gain,dest,att){const c=this.ctx,o=c.createOscillator(),g=c.createGain();o.type=type||'sine';o.frequency.value=f;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(gain,t+(att||.01));g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(dest||this.music);o.start(t);o.stop(t+dur+.05);return o},
  pluck(f,t,gain){const c=this.ctx,o=c.createOscillator(),lp=c.createBiquadFilter(),g=c.createGain();o.type='sawtooth';o.frequency.value=f;lp.type='lowpass';
    lp.frequency.setValueAtTime(f*7,t);lp.frequency.exponentialRampToValueAtTime(f*1.6,t+1.6);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(gain,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+2.6);
    o.connect(lp);lp.connect(g);g.connect(this.music);o.start(t);o.stop(t+2.7)},
  noiseHit(t,dur,f,q,gain,dest,type){const c=this.ctx,s=c.createBufferSource(),bp=c.createBiquadFilter(),g=c.createGain();s.buffer=this.noise;bp.type=type||'bandpass';bp.frequency.value=f;bp.Q.value=q||1;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(gain,t+dur*.3);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(bp);bp.connect(g);g.connect(dest||this.fx);s.start(t);s.stop(t+dur+.05)},
  bell(f,t,gain,dest){[1,2.76,5.4].forEach((m,i)=>this.tone(f*m,t,1.8/(i+1),'sine',gain/(i*1.6+1),dest||this.music))},
  drum(t,hi,gain){const c=this.ctx,o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.setValueAtTime(hi?220:110,t);o.frequency.exponentialRampToValueAtTime(hi?160:58,t+.18);
    g.gain.setValueAtTime(gain,t);g.gain.exponentialRampToValueAtTime(.0001,t+.3);o.connect(g);g.connect(this.music);o.start(t);o.stop(t+.35);if(hi)this.noiseHit(t,.08,2400,2,gain*.25,this.music)},
  /* scheduled each frame: tanpura drone pattern, a dholak pulse while churning, bells for wonder */
  tick(){if(!this.ctx||this.ctx.state!=='running')return;const t=this.ctx.currentTime,m=this.mood;const SA=146.83,PA=SA*1.5;
    const tempo={ocean:1.25,churn:.9,poison:1.6,treasure:1.15,divine:1.4,reflect:1.35,festive:1}[m]||1.3;
    if(this.nextPluck<t-1)this.nextPluck=t+.05;
    while(this.nextPluck<t+.2){const seq=m==='poison'?[SA*.75,SA,SA,SA/2]:[PA/2,SA,SA,SA/2];const f=seq[this.beat%4];this.pluck(f,this.nextPluck,m==='poison'?.05:.07);this.beat++;this.nextPluck+=tempo}
    if(m==='churn'||m==='festive'){if(this.nextBeat<t-1)this.nextBeat=t+.05;const bt=m==='churn'?.42:.36;
      while(this.nextBeat<t+.2){const k=Math.round(this.nextBeat/bt)%4;this.drum(this.nextBeat,k%2===1,k===0?.32:.18);this.nextBeat+=bt}}
    if(m==='treasure'||m==='divine'||m==='festive'||m==='reflect'||m==='ocean'){if(this.nextBell<t-2)this.nextBell=t+1;
      while(this.nextBell<t+.2){const sc=[1,9/8,5/4,3/2,5/3,2];const f=SA*2*sc[(Math.random()*sc.length)|0];this.bell(f,this.nextBell,m==='ocean'?.025:.04);this.nextBell+=m==='ocean'?3.6:(m==='festive'?1.1:2.2)}}},
  sfx(name){if(!this.ctx||this.ctx.state!=='running')return;const t=this.ctx.currentTime;try{switch(name){
    case'wave':this.noiseHit(t,1.8,500,.7,.35,this.fx,'lowpass');break;
    case'bubble':for(let i=0;i<4;i++){const o=this.tone(320+Math.random()*300,t+i*.09,.14,'sine',.12,this.fx);o.frequency.exponentialRampToValueAtTime(900,t+i*.09+.12)}break;
    case'rumble':{const o=this.tone(46,t,2.2,'sawtooth',.22,this.fx,.3);this.noiseHit(t,2,120,.8,.4,this.fx,'lowpass');break}
    case'poison':[0,1].forEach(i=>this.tone(98+i*3.7,t,2.6,'triangle',.12,this.fx,.6));break;
    case'chime':this.bell(880,t,.16,this.fx);this.bell(1320,t+.12,.1,this.fx);break;
    case'pop':this.bell(660,t,.14,this.fx);break;
    case'accent':[293.7,370,440,587.3].forEach((f,i)=>this.tone(f,t+i*.06,3,'triangle',.07,this.fx,.4));this.bell(1174,t+.3,.12,this.fx);break;
    case'diya':this.bell(1046,t,.14,this.fx);this.tone(523,t,1.2,'sine',.08,this.fx);break;
    case'kind':[523,659,784].forEach((f,i)=>this.bell(f,t+i*.12,.1,this.fx));break;
  }}catch(e){}}};

/* ===== Narrator: browser speech synthesis, sentence by sentence; timed captions when speech is off or unavailable ===== */
const Narr={ok:'speechSynthesis' in window,voice:null,rate:.9,skipFn:null,fails:0,seq:0,
  init(){if(!this.ok)return;const pick=()=>{const vs=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));if(!vs.length)return;
      const pref=[/en-IN/i,/Google UK English Female/i,/(Veena|Heera|Neerja|Isha)/i,/(Samantha|Serena|Kate|Martha|Moira|Tessa|Karen)/i,/Female/i,/en-GB/i,/Google US English/i];
      for(const r of pref){const v=vs.find(v=>r.test(v.name)||r.test(v.lang));if(v){this.voice=v;return}}this.voice=vs[0]};
    pick();try{speechSynthesis.addEventListener('voiceschanged',pick)}catch(e){}},
  est(text){const w=text.trim().split(/\s+/).length;return 450+w*330/this.rate},
  stop(){if(this.ok)try{speechSynthesis.cancel()}catch(e){}if(this.skipFn){const f=this.skipFn;this.skipFn=null;f()}},
  /* resolves when the sentence has been read (or skipped); never waits forever. If the voice ends far too early
     (no voices installed, muted mid-sentence, a blocked engine) the caption still stays up for its reading time. */
  speak(text){return new Promise(res=>{let done=false,tm=null;const t0=Clock.now,seq=++this.seq;
      const fin=()=>{if(done)return;done=true;this.skipFn=null;Timers.cancel(tm);AU.duck(false);res()};
      const early=benign=>{if(done)return;const left=est-(Clock.now-t0);if(!benign&&seq===this.seq&&!AU.muted&&left>est*.7&&++this.fails>=2)this.ok=false;if(left<=300){fin();return}Timers.cancel(tm);tm=Timers.add(left,fin)};
      this.skipFn=()=>{if(this.ok)try{speechSynthesis.cancel()}catch(e){}fin()};
      const useVoice=this.ok&&!AU.muted&&Dir.speed<1.5;const est=this.est(text);
      tm=Timers.add(useVoice?est*2.2+2500:est,fin);
      if(!useVoice)return;
      try{const u=new SpeechSynthesisUtterance(text);if(this.voice)u.voice=this.voice;u.lang=this.voice?this.voice.lang:'en-IN';u.rate=this.rate;u.pitch=1.06;u.volume=1;
        u.onend=()=>{if(Clock.now-t0<est*.3)early();else{this.fails=0;fin()}};u.onerror=e=>early(!!(e&&/interrupt|cancel/.test(e.error||'')));AU.duck(true);speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){early()}})}};

/* ===== Stage: one SVG, recomposed (not cropped) for phone portrait ===== */
const Stage={svg:null,world:null,P:false,W:1600,H:900,
  init(){this.svg=$('stage');Pat.defs=el('defs',{},this.svg);this.world=grp(this.svg);this.measure()},
  measure(){const r=$('app').getBoundingClientRect();const P=r.width>0&&r.width/r.height<.9;const changed=P!==this.P;this.P=P;this.W=P?900:1600;this.H=P?1600:900;
    this.svg.setAttribute('viewBox',`0 0 ${this.W} ${this.H}`);return changed}};

/* ===== Captions: verbatim narration, read one sentence at a time ===== */
const Cap={skipLine:false,
  split(t){return t.match(/[^.!?]+[.!?]+["'”’]*\s*|[^.!?]+$/g)||[t]},
  show(parts,cur,cue){const p=$('capText');p.textContent='';parts.forEach((s,i)=>{const sp=document.createElement('span');sp.textContent=s;if(i===cur)sp.className='cur';else if(i<cur)sp.className='spent';p.appendChild(sp)});
    $('cap').classList.toggle('cue',!!cue);$('cap').hidden=false},
  hide(){$('cap').hidden=true},
  async say(text,tok){const parts=this.split(text);this.skipLine=false;
    for(let i=0;i<parts.length;i++){if(tok!==Dir.tok)return;this.show(parts,i);await Narr.speak(parts[i].trim());if(this.skipLine||tok!==Dir.tok)break}
    if(tok===Dir.tok)this.show(parts,parts.length)}};

/* ===== Activities: prompt, glowing targets, gentle hint at 9 s, automatic help at 15 s, never a failure ===== */
const Act={cur:null,nudgeAt:-1e9,
  run(spec,tok){return new Promise(res=>{this.cur={spec,tok,res,hits:new Set(),busy:{},t0:Clock.now,last:Clock.now,hinted:false,closing:false};
      $('instrText').textContent=spec.prompt;$('instrHint').hidden=true;$('bGo').hidden=true;const I=$('instr');I.hidden=false;I.classList.remove('pop');void I.offsetWidth;I.classList.add('pop');
      Cap.hide();AU.sfx('pop');Narr.speak(spec.prompt)})},
  active(key){const c=this.cur;if(!c||c.tok!==Dir.tok||c.closing)return false;if(!c.spec.keys.includes(key))return false;
    return c.spec.multi?!c.busy[key]:!c.hits.size},
  tick(){const c=this.cur;if(!c)return;if(c.tok!==Dir.tok){this.cur=null;return}if(c.closing)return;const idle=Clock.now-c.last;
    if(!c.hits.size){if(idle>9000&&!c.hinted){c.hinted=true;const h=$('instrHint');h.textContent=c.spec.hint||'Tap the glowing circle!';h.hidden=false;this.nudgeAt=Clock.now}
      if(idle>15000)this.hit(c.spec.autoKey||c.spec.keys[0],true)}
    else if(c.spec.multi&&!Object.values(c.busy).some(Boolean)&&idle>(c.spec.after||6000))this.finish()},
  async hit(key,auto){const c=this.cur;if(!c||!this.active(key))return;if(Narr.skipFn&&!auto)Narr.stop();
    c.hits.add(key);c.busy[key]=true;c.last=Clock.now;$('instrHint').hidden=true;
    if(c.spec.multi){$('bGo').hidden=false;$('bGo').textContent=c.spec.goLabel||'Continue'}
    try{await c.spec.onHit(key,!!auto)}catch(e){console.error(e)}
    if(this.cur!==c)return;c.busy[key]=false;c.last=Clock.now;
    if(!c.spec.multi)this.finish();else if(c.spec.max&&c.hits.size>=c.spec.max){c.spec.after=Math.min(c.spec.after||6000,1800)}},
  nudge(){if(this.cur)this.nudgeAt=Clock.now},
  skip(){const c=this.cur;if(!c)return;if(!c.hits.size)this.hit(c.spec.autoKey||c.spec.keys[0],true);else if(c.spec.multi)this.finish()},
  finish(){const c=this.cur;if(!c||c.closing)return;c.closing=true;$('instr').hidden=true;this.cur=null;c.res([...c.hits])},
  close(){this.cur=null;$('instr').hidden=true}};

/* ===== HUD ===== */
const NAMES=['Ocean of Wonders','The Great Churning','The Poison and the Protector','The Ocean’s Treasures','Lord Dhanvantari','What Is True Wealth?','The Gift of Life'];
const HUD={init(){const ol=$('progDots');NAMES.forEach((n,i)=>{const li=document.createElement('li');li.title=`Scene ${i+1}: ${n}`;
      li.innerHTML='<svg viewBox="-10 -12 20 20" aria-hidden="true"><path class="p" d="M0 6C-5 2-5-5 0-10C5-5 5 2 0 6Z"/><path class="p" d="M0 6C-7 5-9-1-9-4C-4-4-2-1 0 6Z"/><path class="p" d="M0 6C7 5 9-1 9-4C4-4 2-1 0 6Z"/></svg>';ol.appendChild(li)})},
  set(i){[...$('progDots').children].forEach((li,j)=>li.className=j<i?'done':j===i?'now':'');$('progName').textContent=`${i+1}. ${NAMES[i]}`;$('prog').setAttribute('aria-label',`Scene ${i+1} of 7: ${NAMES[i]}`)}};

/* ===== Director: runs one scene script at a time; a new token cancels everything from the old one ===== */
const Dir={tok:0,i:-1,sc:null,S:null,R:null,speed:1,started:false,
  base(){return{cz:1,cx:Stage.W/2,cy:Stage.H/2}},
  build(){const w=Stage.world;while(w.firstChild)w.removeChild(w.firstChild);[...Pat.defs.querySelectorAll('clipPath')].forEach(c=>c.remove());
    const cam=grp(w);const R=this.sc.build(cam,this.S,Stage.P,Stage.W,Stage.H)||{};R.cam=cam;R.hits=R.hits||{};border(w,Stage.W,Stage.H);this.R=R;this.apply(0)},
  preview(i){this.i=i;this.sc=SCENES[i];this.S=Object.assign(this.base(),this.sc.state());this.build();HUD.set(i)},
  relayout(){if(Stage.measure()&&this.sc){const cx=this.S.cx/(Stage.P?1600:900)*Stage.W,cy=this.S.cy/(Stage.P?900:1600)*Stage.H;
      this.S.cx=this.S.cz===1?Stage.W/2:cx;this.S.cy=this.S.cz===1?Stage.H/2:cy;this.build()}},
  veil(on){$('veil').classList.toggle('on',on);return new Promise(r=>setTimeout(r,on&&!RM&&this.speed<2?460:30))},
  async go(i){const tok=++this.tok;Tw.clear();Timers.clear();Narr.stop();Act.close();Cap.hide();$('endBar').hidden=true;
    if(i>=SCENES.length)return;if(this.started&&this.sc)await this.veil(true);if(tok!==this.tok)return;
    this.i=i;this.sc=SCENES[i];this.S=Object.assign(this.base(),this.sc.state());this.build();HUD.set(i);AU.setMood(this.sc.mood);if(i>0&&i<6)Store.reach(i);
    this.started=true;await this.veil(false);if(tok!==this.tok)return;
    try{await this.sc.run(this.ctx(tok),this.S);if(tok!==this.tok)return;if(i<SCENES.length-1)this.go(i+1);else this.finish()}
    catch(e){console.error(e);if(tok===this.tok){if(i<SCENES.length-1)this.go(i+1);else this.finish()}}},
  finish(){Cap.hide();$('endBar').hidden=false;$('bSkip').hidden=true;$('bNext').hidden=true;Store.reach(0);setTimeout(()=>$('bReplay').focus({preventScroll:true}),50)},
  ctx(tok){const live=()=>tok===this.tok,never=()=>new Promise(()=>{}),S=()=>this.S;
    return{live,
      say:t=>live()?Cap.say(t,tok).then(()=>live()?new Promise(r=>Timers.add(380,r)):never()):never(),
      wait:ms=>live()?new Promise(r=>Timers.add(ms,()=>live()&&r())):never(),
      tw:(props,ms,e)=>live()?Tw.to(S(),props,RM?Math.min(ms,500):ms,e).then(()=>live()?undefined:never()):never(),
      act:spec=>live()?Act.run(spec,tok):never(),
      sfx:n=>{if(live())AU.sfx(n)},
      R:()=>this.R}},
  /* per-frame: camera, scene drawing, glowing tap targets */
  apply(dt){const S=this.S,R=this.R;if(!R)return;const W=Stage.W,H=Stage.H;
    R.cam.setAttribute('transform',`translate(${f1(W/2)} ${f1(H/2)}) scale(${f1(S.cz*1000)/1000}) translate(${f1(-S.cx)} ${f1(-S.cy)})`);
    this.sc.update(R,S,Clock.now,dt);
    const strong=Clock.now-Act.nudgeAt<1600;
    for(const k in R.hits){const h=R.hits[k];const on=Act.active(k);
      if(!on){op(h.halo,0);continue}const pul=.5+.5*Math.sin(Clock.now*.005);
      op(h.halo,strong?.95:.45+.4*pul);tf(h.halo,h.cx,h.cy,(strong?1.08:1)+.05*pul,Clock.now*.02)}}};

/* ===== Input: delegated taps and keys on [data-hit] targets ===== */
function hitFrom(e){const t=e.target.closest&&e.target.closest('[data-hit]');return t?t.getAttribute('data-hit'):null}
function bindInput(){const st=$('stage');
  st.addEventListener('pointerdown',e=>{AU.resume();const k=hitFrom(e);if(k&&Act.active(k)){e.preventDefault();Act.hit(k)}else if(Act.cur)Act.nudge()});
  st.addEventListener('keydown',e=>{if(e.key!=='Enter'&&e.key!==' ')return;const k=hitFrom(e);if(k){e.preventDefault();if(Act.active(k))Act.hit(k);else Act.nudge()}});
  $('bGo').addEventListener('click',()=>Act.finish());
  $('bSkip').addEventListener('click',()=>{if(Act.cur)Act.skip();else{Cap.skipLine=true;Narr.stop()}});
  $('bNext').addEventListener('click',()=>{if(!Dir.started)return;if(Dir.i<SCENES.length-1)Dir.go(Dir.i+1);else{Dir.tok++;Tw.finishAll();Narr.stop();Act.close();Dir.finish()}});
  $('bMute').addEventListener('click',()=>{const m=!AU.muted;AU.setMute(m);if(m&&Narr.ok)try{speechSynthesis.cancel()}catch(e){}
    $('bMute').setAttribute('aria-pressed',String(m));$('bMute').setAttribute('aria-label',m?'Turn sound on':'Mute sound');$('mWave').style.display=m?'none':'';$('mX').style.display=m?'':'none'});
  $('bMusic').addEventListener('click',()=>{const on=!AU.musicOn;AU.setMusic(on);$('bMusic').setAttribute('aria-pressed',String(on));$('bMusic').setAttribute('aria-label',on?'Music and sound effects on':'Music and sound effects off')});}

/* ===== Scene kit: backdrop, banks, fish, bubbles, ripples, sparks ===== */
function backdrop(p,W,H,o){const B={};const hz=o.hz;
  el('rect',{x:-500,y:-500,width:W+1000,height:hz+520,fill:TINT.sky},p);
  el('rect',{x:-500,y:-500,width:W+1000,height:hz+520,fill:Pat.get('dots2',mix(TINT.sky,PAL.gold,.4),null,30)},p);
  B.skyTint=el('rect',{x:-500,y:-500,width:W+1000,height:hz+520,fill:TINT.violet,opacity:0},p);
  if(o.sun){B.sun=sun(grp(p),o.sun[2]);tf(B.sun.g,o.sun[0],o.sun[1])}
  B.clouds=(o.clouds||[]).map(([x,y,w],i)=>{const g=cloud(p,w,i+3);tf(g,x,y);return{g,x,y,v:.6+i*.25,ph:i*2}});
  B.behind=grp(p);
  B.ocean=ocean(p,W,H,hz,o.ocean);
  B.update=(t,dt,S)=>{if(B.sun)tf(B.sun.rays,0,0,1,RM?0:t*.004);B.clouds.forEach(c=>tf(c.g,c.x+(RM?0:Math.sin(t*.00008*c.v+c.ph)*40),c.y));
    B.ocean.update(t,dt,S.osp==null?1:S.osp,RM?1:3);op(B.ocean.dark,(S.dark||0)*.55);op(B.skyTint,(S.dark||0)*.35);op(B.ocean.gold,(S.gold||0)*.5)};
  return B}
function bank(p,x0,x1,y){const g=grp(p);const m=(x0+x1)/2,w=x1-x0;
  shape(g,`M${x0} ${y+120}L${x0} ${y+10}Q${x0+w*.12} ${y-16} ${m} ${y-18}Q${x1-w*.12} ${y-16} ${x1} ${y+10}L${x1} ${y+120}Z`,PAL.terra,{w:5,pat:Pat.get('dots2',mix(PAL.terra,PAL.ink,.28),null,16)});
  shape(g,`M${x0} ${y+10}Q${x0+w*.12} ${y-16} ${m} ${y-18}Q${x1-w*.12} ${y-16} ${x1} ${y+10}L${x1} ${y+26}Q${x1-w*.12} ${y+2} ${m} ${y}Q${x0+w*.12} ${y+2} ${x0} ${y+26}Z`,PAL.leaf,{w:4,pat:Pat.get('vstripe',mix(PAL.leaf,PAL.ink,.25),null,8)});
  for(let x=x0+30;x<x1-20;x+=56)shape(g,`M${x-8} ${y-12}L${x} ${y-34}L${x+8} ${y-12}Z`,PAL.leaf,{w:2.6,dbl:false});
  return g}
/* fish swimming along gentle curves; turn() makes them all change direction */
function school(p,W,specs){const list=specs.map(([y,len,c1,c2,v,x],i)=>{const g=grp(p);fish(g,len,c1,c2,i);return{g,y,len,v,x,ph:i*1.7}});
  return{list,turn(){list.forEach(f=>f.v=-f.v)},
    update(t,dt,sp,alpha){list.forEach(f=>{f.x+=f.v*dt*.05*sp;if(f.x>W+120)f.x=-120;if(f.x<-120)f.x=W+120;
      tf(f.g,f.x,f.y+Math.sin(t*.0016+f.ph)*10,1,Math.cos(t*.0016+f.ph)*8*Math.sign(f.v),f.v<0?-1:1);op(f.g,alpha)})}}}
function bubbles(p,n,cx,cy,spread,rise,seed){const r=rng(seed||9);const list=[];for(let i=0;i<n;i++){const g=bubble(p,4+r()*8);list.push({g,dx:(r()-.5)*spread,ph:r(),v:.5+r()*.6})}
  return{update(t,k){list.forEach(b=>{const u=(t*.00025*b.v+b.ph)%1;tf(b.g,cx+b.dx+Math.sin(t*.003+b.ph*9)*8,cy-u*rise,1);op(b.g,k*Math.sin(u*Math.PI)*1.2)})}}}
/* concentric decorative ripples (k 0..1 expands, fades) */
function ripples(p,cx,cy,rx,ry,c){const g=grp(p,{transform:`translate(${cx} ${cy})`});const rs=[0,1,2].map(i=>{const e=grp(g);el('ellipse',{rx,ry,fill:'none',stroke:PAL.ink,'stroke-width':5},e);
    el('ellipse',{rx,ry,fill:'none',stroke:c||PAL.turq,'stroke-width':2.5,'stroke-dasharray':'12 10'},e);return e});
  return{g,set(k){rs.forEach((e,i)=>{const u=clamp(k*1.6-i*.3,0,1);tf(e,0,0,Math.max(.001,.2+u*1.6));op(e,u>0&&u<1?Math.sin(u*Math.PI):0)})}}}
/* little gold-and-ivory motifs flying outward (k 0..1) */

    if(!S._init){S._init=1;S.cx=L.d[0];S.cy=L.d[1]-158*L.d[2]}
    R.bd=backdrop(p,W,H,{hz:L.hz,sun:null,clouds:P?[[200,560,160],[700,560,150]]:[[180,300,170],[1420,300,170]]});
    R.mG=grp(p,{transform:`translate(${L.m[0]} ${L.m[1]})`});R.m=mandala(R.mG,L.m[2],{t:0});
    bank(p,-10,L.dev[0]+(P?90:170),L.dev[1]);bank(p,L.asu[0]-(P?90:170),W+10,L.asu[1]);
    R.devG=grp(p,{transform:`translate(${L.dev[0]} ${L.dev[1]})`});R.dev=crowd(R.devG,'deva',3,1,P?40:62,L.dev[2]);
    R.asuG=grp(p,{transform:`translate(${L.asu[0]} ${L.asu[1]})`});R.asu=crowd(R.asuG,'asura',3,-1,P?40:62,L.asu[2]);
    const stand=(pos,fn,lr)=>{const g=grp(p,{transform:`translate(${pos[0]} ${pos[1]}) scale(${pos[2]})`});lotus(g,lr,{t:1});return fn(g)};
    R.sh=stand(L.sh,shiva,70);R.sh.setBlue(1);R.vi=stand(L.vi,vishnu,70);R.dh=stand(L.d,dhanvantari,84);
    R.cor=L.cor.map(([x,y],i)=>lotus(grp(p,{transform:`translate(${x} ${y})`}),P?40:46,{t:0,seed:i+9}));
    R.dy=L.dy.map(([x,y],i)=>{const g=grp(p,{transform:`translate(${x} ${y})`});const D=diya(g,L.ds);hitArea(p,R,'diya'+i,'Diya '+(i+1)+': light it to spread the light',x,y-30*L.ds,P?78:74);return D});
    /* closing message cartouche */
    const[bx,by,bw,bh]=L.box;R.msg=grp(p,{transform:`translate(${bx} ${by})`});
    shape(R.msg,`M${-bw/2+30} ${-bh/2}H${bw/2-30}Q${bw/2} ${-bh/2} ${bw/2} ${-bh/2+30}V${bh/2-30}Q${bw/2} ${bh/2} ${bw/2-30} ${bh/2}H${-bw/2+30}Q${-bw/2} ${bh/2} ${-bw/2} ${bh/2-30}V${-bh/2+30}Q${-bw/2} ${-bh/2} ${-bw/2+30} ${-bh/2}Z`,PAL.ivory,{w:6});
    el('rect',{x:-bw/2+12,y:-bh/2+12,width:bw-24,height:bh-24,rx:20,fill:'none',stroke:PAL.gold,'stroke-width':5,'stroke-dasharray':'2 12','stroke-linecap':'round'},R.msg);
    const lines=P?['May your home shine with light,','your family be blessed with health,','and your heart overflow with kindness.']:['May your home shine with light, your family be blessed with health,','and your heart overflow with kindness.'];
    const fs=P?36:30,gy=P?-bh/2+64:-bh/2+44;lines.forEach((s,i)=>txt(R.msg,0,gy+i*(fs*1.3),s,{size:fs,weight:600}));
    const gl=P?['HAPPY DHANTERAS,','LITTLE OCEAN EXPLORERS!']:['HAPPY DHANTERAS, LITTLE OCEAN EXPLORERS!'];const gs=P?50:42;
    gl.forEach((s,i)=>txt(R.msg,0,gy+lines.length*fs*1.3+gs*.95+i*gs*1.15,s,{size:gs,font:'"Yatra One",Georgia,serif',weight:400,fill:PAL.verm,ls:1}));
    R.msgAria=el('title',{},R.msg);R.msgAria.textContent='May your home shine with light, your family be blessed with health, and your heart overflow with kindness. Happy Dhanteras, little Ocean Explorers!';
    return R},
  update(R,S,t,dt){const L=R.L;R.bd.update(t,dt,S);R.m.set(S.mand);R.m.spin(RM?0:t*.006);R.cor.forEach(c=>c.set(S.corner));
    R.dy.forEach((D,i)=>D.set(Ease.out(clamp(S.dl[i],0,1)),t));
    if(R.dh.kalash){R.dh.kalash.light(1);op(R.dh.kalash.sparks,.5+.5*Math.sin(t*.006))}
    R.vi.set(t,0);const pose=S.cheer>.5?'cheer':'namaste';R.dev.pose(pose,1,t);R.asu.pose(pose,1,t);R.dev.hop(t,S.cheer*7);R.asu.hop(t+400,S.cheer*7);
    const k=Ease.back(clamp(S.msg,0,1));tf(R.msg,L.box[0],L.box[1]+(1-k)*-30,Math.max(.001,lerp(.85,1,k)));op(R.msg,clamp(S.msg*2,0,1))},
  async run(x,S){
    x.tw({cz:1,cx:Stage.W/2,cy:Stage.H/2},2600,Ease.io);x.tw({mand:1},2800,Ease.out);x.tw({corner:1},2600);
    await x.say(TEXT.s7[0]);
    const lightRest=async first=>{for(let i=0;i<3;i++){if(i===first||S.dl[i]>=1)continue;await x.wait(380);x.sfx('diya');Tw.to(S.dl,{[i]:1},900,Ease.out)}};
    await x.act({keys:['diya0','diya1','diya2'],autoKey:'diya1',prompt:'Tap a diya to spread the light!',hint:'Tap one of the little clay lamps!',
      onHit:async k=>{const i=+k.slice(-1);x.sfx('diya');await Tw.to(S.dl,{[i]:1},900,Ease.out);await lightRest(i);await x.wait(700)}});
    x.tw({cheer:1},300);x.tw({gold:.6},1500);
    await x.say(TEXT.s7[1]);
    x.sfx('accent');x.tw({msg:1},1400,Ease.out);x.tw({cheer:0},600);
    await x.say(TEXT.s7[2]);
    await x.wait(900)}};

const SCENES=[SC1,SC2,SC3,SC4,SC5,SC6,SC7];

/* ===== Boot: frame loop, start card, replay ===== */
let lastT=performance.now();
function frame(now){const dt=Math.min(50,now-lastT);lastT=now;const sdt=dt*Dir.speed;Clock.now+=sdt;
  Tw.update();Timers.update();Act.tick();AU.tick();
  if(Dir.sc&&Dir.R){Dir.S.t=Clock.now;try{Dir.apply(sdt)}catch(e){console.error(e)}}
  requestAnimationFrame(frame)}
function veilArt(){const g=$('veilArt');for(let i=0;i<8;i++){const p=el('path',{d:petalD(52,.42),fill:i%2?PAL.pink:PAL.gold,stroke:PAL.ink,'stroke-width':2.5,transform:`rotate(${i*45})`},g)}
  dot(g,0,0,14,PAL.verm,{stroke:PAL.ink,w:2.5});dot(g,0,0,5,PAL.ivory)}
function begin(from,keep){$('startCard').hidden=true;$('endBar').hidden=true;$('bSkip').hidden=false;$('bNext').hidden=false;AU.init();AU.resume();Narr.init();
  if(!keep)Store.setTreasures([]);Dir.go(from||0)}
$('bBegin').addEventListener('click',()=>begin(0,false));
$('bResume').addEventListener('click',()=>begin(Store.data.reached,true));
$('bReplay').addEventListener('click',()=>begin(0,false));
$('bExplore').addEventListener('click',()=>begin(0,true));
Store.load();Stage.init();HUD.init();veilArt();bindInput();Narr.init();
Dir.preview(0);Object.assign(Dir.S,{osp:1,fish:1,dev:1,vish:1,asu:1,worry:0});
if(Store.data.reached>0){const b=$('bResume');b.hidden=false;b.textContent=`Continue from Scene ${Store.data.reached+1}`}
window.addEventListener('resize',()=>Dir.relayout());
if(window.ResizeObserver)new ResizeObserver(()=>Dir.relayout()).observe($('app'));
document.addEventListener('visibilitychange',()=>{if(document.hidden&&Narr.ok)try{speechSynthesis.pause()}catch(e){}else if(Narr.ok)try{speechSynthesis.resume()}catch(e){}});
requestAnimationFrame(frame);
/* Test hook (only with #qa in the address): jump to a scene, speed up the clock, tap targets */
if(/qa/.test(location.hash))window.__qa={go(i,speed){Dir.speed=speed||1;$('startCard').hidden=true;AU.muted=true;Dir.go(i)},
  state:()=>({clock:Math.round(Clock.now),i:Dir.i,act:Act.cur?Act.cur.spec.keys:null,cap:$('cap').hidden?null:$('capText').textContent,end:!$('endBar').hidden,instr:$('instr').hidden?null:$('instrText').textContent}),
  hit:k=>Act.hit(k),speed:s=>{Dir.speed=s}};

</script>
