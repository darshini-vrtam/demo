<title>The Ocean That Gave Us the Gift of Life</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Yatra+One&display=swap">
<style>
/* Layout: one painted 16:9-or-portrait stage fills the screen; title on top, prompts and subtitles docked at the bottom. */
:root{
  --line:#3B1F14; --cream:#FBF1D9; --saffron:#F28A1E; --turmeric:#F2B71F; --verm:#D6341F; --peacock:#0B6E8A; --deep:#14206B; --indigo:#2A2E78;
  --bg:#FBF1D9; --fg:#3B1F14; --panel:#FBF1D9; --panel-fg:#3B1F14; --panel-line:#3B1F14; --btn:#FBF1D9; --btn-fg:#3B1F14; --accent:#D6341F; --focus:#D6341F;
  --font-display:"Yatra One","Kohinoor Devanagari","Palatino Linotype",Georgia,serif;
  --font-body:"Baloo 2","Trebuchet MS","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#14206B; --fg:#FBF1D9; --panel:#2A2E78; --panel-fg:#FBF1D9; --panel-line:#F2B71F; --btn:#2A2E78; --btn-fg:#FBF1D9; --accent:#F2B71F; --focus:#F2B71F; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#14206B; --fg:#FBF1D9; --panel:#2A2E78; --panel-fg:#FBF1D9; --panel-line:#F2B71F; --btn:#2A2E78; --btn-fg:#FBF1D9; --accent:#F2B71F; --focus:#F2B71F; color-scheme:dark }
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px}
#app{position:relative;width:100%;height:100%;overflow:hidden;border-radius:12px;background:var(--bg);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:pointer}
[hidden]{display:none!important}
button{font-family:var(--font-body);color:inherit}
button:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
/* top: scene title plaque with progress, controls, collection strip */
#title{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:5;background:var(--panel);color:var(--panel-fg);border:5px double var(--panel-line);border-radius:12px;
  padding:3px 14px 5px;text-align:center;max-width:min(60%,640px)}
#titleText{font:400 clamp(13px,1vw + .6vh + 4px,21px)/1.15 var(--font-display);margin:0;text-wrap:balance}
#prog{display:flex;gap:4px;justify-content:center;margin-top:3px}
#prog i{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--panel-line);display:block}
#prog i.done{background:var(--saffron)}#prog i.now{background:var(--verm);transform:scale(1.35)}
#prog i.gap{margin-left:6px}
#hud{position:absolute;top:10px;right:10px;display:flex;gap:6px;z-index:6;align-items:center}
.hb{min-width:44px;height:44px;border-radius:12px;border:4px double var(--panel-line);background:var(--btn);color:var(--btn-fg);display:grid;place-items:center;cursor:pointer;padding:0 6px}
.hb svg{width:22px;height:22px}
.hb[aria-pressed="true"]{background:var(--turmeric);color:#3B1F14}
#bCam{display:flex;gap:4px;padding:0 9px;font:700 12px/1 var(--font-body)}#bCam svg{width:18px;height:18px}#bCam.na{opacity:.55}
#strip{position:absolute;top:10px;left:10px;z-index:5;display:flex;gap:3px;background:var(--panel);border:4px double var(--panel-line);border-radius:12px;padding:3px 5px}
#strip canvas{width:30px;height:30px}
/* bottom dock: cards, instruction plaque, subtitles (never over the painted focal area) */
#dock{position:absolute;left:0;right:0;bottom:8px;z-index:6;display:flex;flex-direction:column;align-items:center;gap:6px;padding:0 8px;pointer-events:none}
#dock>*{pointer-events:auto}
#cap{width:min(96%,1120px);background:var(--panel);color:var(--panel-fg);border:5px double var(--panel-line);border-radius:14px;padding:5px 16px 7px}
#capWho{display:flex;flex-wrap:wrap;gap:10px;font:800 12px/1 var(--font-body);letter-spacing:.08em;text-transform:uppercase;margin-bottom:2px}
#capWho span{display:inline-flex;align-items:center;gap:6px}
#capWho i{width:12px;height:12px;border-radius:50%;display:inline-block;border:2px solid #3B1F14}
#capText{margin:0;font-size:clamp(15px,.95vw + .85vh + 5px,25px);line-height:1.32;font-weight:600;text-wrap:pretty}
#plaque{width:min(96%,900px);background:var(--panel);color:var(--panel-fg);border:5px double var(--panel-line);border-radius:14px;padding:5px 10px}
#plaque.flash{animation:pflash .7s ease}
@keyframes pflash{40%{transform:scale(1.03)}}
.prow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}
.picon{width:clamp(44px,6vh,64px);height:clamp(44px,6vh,64px);flex:none;border-radius:12px}
button.picon{padding:0;border:4px double var(--panel-line);background:#FBF1D9;cursor:pointer;min-width:64px;min-height:64px}
button.picon canvas{width:100%;height:100%;display:block}
button.picon.glow{animation:glow 1.6s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 6px #F2B71F,0 0 0 10px #D6341F}}
button.picon.hit{animation:hit .5s ease}@keyframes hit{50%{transform:scale(1.15)}}
.ptext{display:flex;flex-direction:column;min-width:0;flex:1 1 180px}
.ptext b{font:400 clamp(18px,1.2vw + 1vh + 4px,30px)/1.1 var(--font-display);color:var(--accent)}
.ptext span{font-size:clamp(13px,.7vw + .7vh + 4px,18px);line-height:1.25;font-weight:600}
.pbtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.pbtn{min-height:48px;padding:6px 16px;border-radius:999px;border:4px double #3B1F14;background:#FBF1D9;color:#3B1F14;font:800 clamp(15px,.6vw + .8vh + 6px,20px)/1 var(--font-body);cursor:pointer}
.pbtn.main{background:repeating-linear-gradient(135deg,#D6341F 0 10px,#B3122D 10px 20px);color:#FBF1D9}
.pbtn.small{min-height:44px;font-size:14px;padding:4px 12px;letter-spacing:.06em;text-transform:uppercase}
.pbtn:disabled{opacity:.45;cursor:default}
.slots{display:flex;gap:8px}.slots canvas{width:clamp(48px,7vh,72px);height:clamp(48px,7vh,72px);border-radius:12px;border:3px solid transparent}
.slots canvas.on{border:4px double #3B1F14;background:#F2B71F}
#tray{display:flex;justify-content:center;align-items:stretch;gap:clamp(8px,2vw,28px);flex-wrap:wrap;width:min(100%,1100px)}
.card{flex:0 1 300px;min-width:0;width:30%;background:#FBF1D9;color:#3B1F14;border:6px double #3B1F14;border-radius:16px;padding:6px 6px 8px;cursor:pointer;display:flex;flex-direction:column;gap:6px;
  transition:transform .3s ease,opacity .4s ease,box-shadow .3s ease}
.card canvas{width:100%;aspect-ratio:3/2;max-width:100%;max-height:19vh;object-fit:contain;display:block;border-radius:10px}
.card span{font:800 clamp(14px,.8vw + .9vh + 4px,22px)/1.15 var(--font-body);text-align:center;text-wrap:balance}
.card.reading{transform:translateY(-6px);box-shadow:0 0 0 4px #F2B71F}
.card.picked{transform:translateY(-8px) scale(1.04);box-shadow:0 0 0 5px #F2B71F,0 0 0 9px #D6341F}
.card.wobble{animation:wob .8s ease}@keyframes wob{20%{transform:rotate(-3deg)}40%{transform:rotate(3deg)}60%{transform:rotate(-2deg)}80%{transform:rotate(1deg)}}
.card.pulse{animation:cpulse 1.2s ease-in-out 3}@keyframes cpulse{50%{transform:scale(1.06);box-shadow:0 0 0 6px #F2B71F}}
.card.back{opacity:.35;transform:translateY(10px)}
.place{flex-basis:100%;max-width:340px}
@media (max-width:700px){ #tray{flex-wrap:wrap;gap:6px} .card{flex:1 1 0;width:auto;padding:4px;border-width:4px} .card canvas{max-height:16vh} }
/* overlays */
.ov{position:absolute;inset:0;z-index:8;display:grid;place-items:center;padding:16px;pointer-events:none}
.ov .panel{pointer-events:auto}
.panel{background:var(--panel);color:var(--panel-fg);border:7px double var(--panel-line);border-radius:20px;padding:16px 22px;max-width:620px;width:100%;text-align:center;display:flex;flex-direction:column;gap:10px}
.panel h1{font:400 clamp(26px,3vw + 1.4vh,52px)/1.1 var(--font-display);margin:0;text-wrap:balance;color:var(--accent)}
.panel .eyebrow{font:800 12px/1.2 var(--font-body);letter-spacing:.14em;text-transform:uppercase;margin:0}
.panel p{margin:0;font-size:16px;line-height:1.4;font-weight:600}
.big{font:400 clamp(22px,1.6vw + 1vh,32px)/1 var(--font-display);padding:14px 30px;border-radius:999px;border:6px double #3B1F14;cursor:pointer;min-height:64px;color:#FBF1D9;
  background:repeating-linear-gradient(90deg,#D6341F 0 14px,#F28A1E 14px 18px,#D6341F 18px 32px,#F2B71F 32px 36px)}
.big.alt{background:#FBF1D9;color:#3B1F14;font-size:clamp(17px,1vw + 1vh,22px)}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
#start .panel{max-width:min(720px,92%);background:color-mix(in srgb,var(--panel) 90%,transparent)}
#endIcons{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}#endIcons canvas{width:56px;height:56px}
#endIcons .lbl{flex-basis:100%;font:800 12px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase}
@media (max-width:560px){ #title{max-width:calc(100% - 210px);left:auto;right:auto;transform:none;left:8px;top:58px} #strip{top:58px;left:auto;right:10px;padding:2px 3px} #strip canvas{width:22px;height:22px} .hb{min-width:44px} #camLbl{display:none} }
@media (prefers-reduced-motion: reduce){ .card,.pbtn{transition:none} .card.pulse,.card.wobble,#plaque.flash,button.picon.glow{animation:none} }
</style>

<div id="app">
  <canvas id="cv" aria-label="Story picture: a Madhubani ocean. Tap or drag when a prompt asks for help."></canvas>
  <div id="title" hidden><p id="titleText"></p><div id="prog" role="img" aria-label="Progress"></div></div>
  <div id="strip" hidden aria-label="Treasures collected"></div>
  <div id="hud">
    <button class="hb" id="bCam" aria-pressed="false" title="Optional: move with the camera. Everything also works by tapping.">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg><span id="camLbl">Use camera</span></button>
    <button class="hb" id="bMute" aria-pressed="false" title="Mute" aria-label="Mute sound">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path id="mWave" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11"/><path id="mX" d="M16 9l5 6M21 9l-5 6" style="display:none"/></svg></button>
    <button class="hb" id="bReplay" title="Replay this scene" aria-label="Replay this scene">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 3-6.2"/><path d="M4 4v5h5"/></svg></button>
    <button class="hb" id="bSkip" title="Skip this line" aria-label="Skip this line">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5l9 7-9 7z"/><path d="M18 5v14"/></svg></button>
  </div>
  <div id="dock">
    <div id="tray" hidden></div>
    <div id="plaque" hidden aria-live="polite"></div>
    <div id="cap" hidden aria-live="polite"><div id="capWho"></div><p id="capText"></p></div>
  </div>
  <div class="ov" id="start">
    <div class="panel">
      <p class="eyebrow">Dhanteras 2026 · Samudra Manthan · Ages 6–10</p>
      <h1>The Ocean That Gave Us the Gift of Life</h1>
      <p>The Storyteller reads aloud. Tap, drag or press Enter whenever a prompt asks for help.</p>
      <div class="row"><button class="big" id="bBegin">LET'S BEGIN</button><button class="big alt" id="bResume" hidden>Continue</button></div>
    </div>
  </div>
  <div class="ov" id="end" hidden>
    <div class="panel">
      <p class="eyebrow">Shubh Dhanteras!</p>
      <h1>The Greatest Treasures Are Within Us</h1>
      <div id="endIcons"></div>
      <div class="row"><button class="big" id="bAgain">Replay the story</button></div>
    </div>
  </div>
</div>

<script>
'use strict';
/* ===== Palette: the only colours the painting uses ===== */
const C={line:'#3B1F14',cream:'#FBF1D9',white:'#FFFFFF',indigo:'#2A2E78',deep:'#14206B',peacock:'#0B6E8A',turq:'#2BB5B0',pink:'#E86FA0',
  turmeric:'#F2B71F',gold:'#D9A21B',ochre:'#C98A2B',saffron:'#F28A1E',diya:'#F5821F',verm:'#D6341F',red:'#B3122D',coral:'#F26B5B',
  leaf:'#3E8E41',emerald:'#1F9D6B',charcoal:'#3A3A44',violet:'#6B4FA0'};
function ca(hex,a){const n=parseInt(hex.slice(1),16);return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`}
function mixHex(a,b,t){if(t<=0)return a;if(t>=1)return b;const x=parseInt(a.slice(1),16),y=parseInt(b.slice(1),16);
  const r=Math.round((x>>16)+((y>>16)-(x>>16))*t),g=Math.round(((x>>8)&255)+(((y>>8)&255)-((x>>8)&255))*t),bl=Math.round((x&255)+((y&255)-(x&255))*t);
  return '#'+((1<<24)|(r<<16)|(g<<8)|bl).toString(16).slice(1)}
const TAU=Math.PI*2,clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const $=id=>document.getElementById(id);

/* ===== Storage: current scene, finished activities, treasures, choices. Never required. ===== */
const Store={k:'dhanteras2026.ocean.v1',data:null,
  fresh(){return{chapter:0,done:[],treasures:[],gifts:[],choices:{}}},
  load(){this.data=this.fresh();try{const s=localStorage.getItem(this.k);if(s){const d=JSON.parse(s);if(d&&typeof d==='object'){
    if(Number.isInteger(d.chapter)&&d.chapter>=0&&d.chapter<8)this.data.chapter=d.chapter;
    ['done','treasures','gifts'].forEach(k=>{if(Array.isArray(d[k]))this.data[k]=d[k].filter(v=>typeof v==='string').slice(0,12)});
    if(d.choices&&typeof d.choices==='object')this.data.choices=d.choices}}}catch(e){}},
  save(){try{localStorage.setItem(this.k,JSON.stringify(this.data))}catch(e){}},
  set(k,v){this.data[k]=v;this.save()},
  push(k,v){if(!this.data[k].includes(v)){this.data[k].push(v);this.save()}},
  choice(k,v){if(v!==undefined){this.data.choices[k]=v;this.save()}return this.data.choices[k]},
  reset(){this.data=this.fresh();this.save()}};

/* ===== Layout: the short screen side is always 1080 logical units ===== */
const app=$('app'),cv=$('cv'),cx=cv.getContext('2d');
const L={W:1920,H:1080,U:1,dpr:1,pw:1,ph:1,portrait:false,ver:0};
function relayout(){const r=app.getBoundingClientRect();L.pw=Math.max(1,r.width);L.ph=Math.max(1,r.height);
  L.dpr=Math.min(window.devicePixelRatio||1,2);const maxPx=3.6e6;if(L.pw*L.ph*L.dpr*L.dpr>maxPx)L.dpr=Math.sqrt(maxPx/(L.pw*L.ph));
  L.U=Math.min(L.pw,L.ph)/1080;L.W=L.pw/L.U;L.H=L.ph/L.U;L.portrait=L.H>L.W*1.05;
  cv.width=Math.round(L.pw*L.dpr);cv.height=Math.round(L.ph*L.dpr);L.ver++;Spr.clear();if(window.UI)UI.relayout()}
/* safe story band: top 12% for the title, bottom for subtitles and prompts */
L.top=()=>L.H*.12;
L.bot=()=>{const capEl=$('cap'),pl=$('plaque');let px=L.ph*.15;try{
  const r=app.getBoundingClientRect();[capEl,pl].forEach(el=>{if(el&&!el.hidden){const b=el.getBoundingClientRect();if(b.height>0)px=Math.max(px,r.bottom-b.top+8)}})}catch(e){}
  return L.H-px/L.U};

/* ===== Sprite cache: static painted parts rendered once per layout ===== */
const Spr={m:new Map(),clear(){this.m.clear()},
  get(key,w,h,fn){const k=key+'@'+L.ver;let c=this.m.get(k);if(c){this.m.delete(k);this.m.set(k,c);return c}
    const sc=L.U*L.dpr;c=document.createElement('canvas');c.width=Math.max(1,Math.ceil(w*sc));c.height=Math.max(1,Math.ceil(h*sc));
    const g=c.getContext('2d');g.setTransform(sc,0,0,sc,0,0);g.lineCap='round';g.lineJoin='round';fn(g,w,h);
    if(this.m.size>160)this.m.delete(this.m.keys().next().value);this.m.set(k,c);return c},
  /* draw sprite whose local origin (ox,oy) lands at x,y; s scales */
  draw(ctx,key,x,y,w,h,ox,oy,fn,s){s=s||1;const c=this.get(key,w,h,fn);ctx.drawImage(c,x-ox*s,y-oy*s,w*s,h*s)}};

/* ===== Time, tweens, timers ===== */
const T={now:0,sec:0};
const Ease={lin:t=>t,io:ease,out:t=>1-Math.pow(1-t,3),in:t=>t*t*t,back:t=>{const c1=1.4,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)}};
const Tw={list:[],add(o,props,ms,e){return new Promise(res=>{const fr={};for(const k in props)fr[k]=o[k];
  const old=this.list.filter(t=>t.o===o&&Object.keys(props).some(k=>k in t.to));old.forEach(t=>t.res());this.list=this.list.filter(t=>!old.includes(t));
  this.list.push({o,fr,to:props,t0:T.now,ms:Math.max(1,ms),e:Ease[e||'io']||e,res})})},
  update(){const keep=[];for(const t of this.list){const k=clamp((T.now-t.t0)/t.ms,0,1),v=t.e(k);
    for(const p in t.to)t.o[p]=t.fr[p]+(t.to[p]-t.fr[p])*v;if(k<1)keep.push(t);else t.res()}this.list=keep},
  kill(){this.list.forEach(t=>t.res());this.list=[]}};
const Timers={list:[],add(ms,fn){this.list.push({at:T.now+ms,fn})},update(){const due=this.list.filter(t=>t.at<=T.now);this.list=this.list.filter(t=>t.at>T.now);due.forEach(t=>t.fn())},kill(){this.list=[]}};
function tw(o,props,ms,e){return Tw.add(o,props,ms,e)}
const reduceMotion=(()=>{try{return matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){return false}})();

/* ===== Folk-art paint kit: clean double outlines, dense pattern fills, flat colour ===== */
/* hand-drawn wobble: deterministic jitter so a shape looks the same every frame */
function wob(pts,amp,seed){const r=rng(seed||7);return pts.map(p=>[p[0]+(r()-.5)*2*amp,p[1]+(r()-.5)*2*amp])}
/* smooth closed or open path through points (midpoint quadratic curves) */
function sPath(pts,closed){const p=new Path2D();const n=pts.length;if(n<2)return p;
  if(!closed){p.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<n-1;i++){const mx=(pts[i][0]+pts[i+1][0])/2,my=(pts[i][1]+pts[i+1][1])/2;p.quadraticCurveTo(pts[i][0],pts[i][1],mx,my)}p.lineTo(pts[n-1][0],pts[n-1][1]);return p}
  const m=(a,b)=>[(a[0]+b[0])/2,(a[1]+b[1])/2];let s=m(pts[n-1],pts[0]);p.moveTo(s[0],s[1]);
  for(let i=0;i<n;i++){const a=pts[i],b=pts[(i+1)%n],e=m(a,b);p.quadraticCurveTo(a[0],a[1],e[0],e[1])}p.closePath();return p}
function polyPath(pts){const p=new Path2D();pts.forEach((q,i)=>i?p.lineTo(q[0],q[1]):p.moveTo(q[0],q[1]));p.closePath();return p}
function ellPath(x,y,rx,ry,rot){const p=new Path2D();p.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),rot||0,0,TAU);return p}
function ellPts(x,y,rx,ry,n,a0){const o=[];for(let i=0;i<n;i++){const a=(a0||0)+i/n*TAU;o.push([x+Math.cos(a)*rx,y+Math.sin(a)*ry])}return o}

/* outlines: the double line is a thick brown stroke with a cream core */
function dbl(ctx,path,lw,gap){lw=lw||3;ctx.lineJoin='round';ctx.lineCap='round';ctx.strokeStyle=C.line;ctx.lineWidth=lw*2.7;ctx.stroke(path);ctx.strokeStyle=gap||C.cream;ctx.lineWidth=lw*.95;ctx.stroke(path)}
function sgl(ctx,path,lw,col){ctx.lineJoin='round';ctx.lineCap='round';ctx.strokeStyle=col||C.line;ctx.lineWidth=lw||3;ctx.stroke(path)}
function dot(ctx,x,y,r,col){ctx.beginPath();ctx.arc(x,y,Math.max(.1,r),0,TAU);ctx.fillStyle=col;ctx.fill()}
function line(ctx,pts,col,w){ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.strokeStyle=col;ctx.lineWidth=w;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke()}
function ring(ctx,x,y,r,col,w){ctx.beginPath();ctx.arc(x,y,Math.max(.1,r),0,TAU);ctx.strokeStyle=col;ctx.lineWidth=w;ctx.stroke()}
function boundsOf(pts){let a=1e9,b=1e9,c=-1e9,d=-1e9;for(const p of pts){a=Math.min(a,p[0]);b=Math.min(b,p[1]);c=Math.max(c,p[0]);d=Math.max(d,p[1])}return{x:a,y:b,w:c-a,h:d-b}}

/* ---- pattern fills (drawn inside a clip) ---- */
const Pat={
  dots(ctx,bb,gap,r,col){for(let y=bb.y+gap/2,j=0;y<bb.y+bb.h+gap;y+=gap,j++)for(let x=bb.x+(j%2?gap/2:0);x<bb.x+bb.w+gap;x+=gap)dot(ctx,x,y,r,col)},
  stripes(ctx,bb,gap,w,col,vert){ctx.fillStyle=col;if(vert)for(let x=bb.x;x<bb.x+bb.w;x+=gap)ctx.fillRect(x,bb.y,w,bb.h);else for(let y=bb.y;y<bb.y+bb.h;y+=gap)ctx.fillRect(bb.x,y,bb.w,w)},
  diag(ctx,bb,gap,w,col){ctx.beginPath();for(let x=bb.x-bb.h;x<bb.x+bb.w;x+=gap){ctx.moveTo(x,bb.y+bb.h);ctx.lineTo(x+bb.h,bb.y)}ctx.strokeStyle=col;ctx.lineWidth=w;ctx.stroke()},
  scallops(ctx,bb,sz,col,w){ctx.beginPath();for(let y=bb.y,j=0;y<bb.y+bb.h+sz;y+=sz*.8,j++)for(let x=bb.x-(j%2?sz/2:0);x<bb.x+bb.w+sz;x+=sz){ctx.moveTo(x,y);ctx.arc(x+sz/2,y,sz/2,Math.PI,0,false)}
    ctx.strokeStyle=col;ctx.lineWidth=w||2;ctx.stroke()},
  fishscale(ctx,bb,sz,col,w){ctx.beginPath();for(let y=bb.y,j=0;y<bb.y+bb.h+sz;y+=sz*.55,j++)for(let x=bb.x-(j%2?sz/2:0);x<bb.x+bb.w+sz;x+=sz){ctx.moveTo(x+sz,y);ctx.arc(x+sz/2,y,sz/2,0,Math.PI,false)}
    ctx.strokeStyle=col;ctx.lineWidth=w||2;ctx.stroke()},
  zig(ctx,bb,sz,col,w,gap){ctx.beginPath();for(let y=bb.y+sz;y<bb.y+bb.h+sz;y+=gap||sz*1.6){ctx.moveTo(bb.x,y);for(let x=bb.x,i=0;x<bb.x+bb.w+sz;x+=sz/2,i++)ctx.lineTo(x,y+(i%2?-sz/2:0))}
    ctx.strokeStyle=col;ctx.lineWidth=w||2;ctx.stroke()},
  chevron(ctx,bb,sz,col,w){ctx.beginPath();for(let y=bb.y;y<bb.y+bb.h+sz;y+=sz*.8)for(let x=bb.x;x<bb.x+bb.w+sz;x+=sz){ctx.moveTo(x,y+sz*.4);ctx.lineTo(x+sz/2,y);ctx.lineTo(x+sz,y+sz*.4)}
    ctx.strokeStyle=col;ctx.lineWidth=w||2;ctx.stroke()},
  tri(ctx,bb,sz,col){ctx.fillStyle=col;ctx.beginPath();for(let x=bb.x;x<bb.x+bb.w+sz;x+=sz){ctx.moveTo(x,bb.y+bb.h);ctx.lineTo(x+sz/2,bb.y);ctx.lineTo(x+sz,bb.y+bb.h)}ctx.fill()},
  leaves(ctx,bb,sz,col,stem){for(let y=bb.y+sz,j=0;y<bb.y+bb.h+sz;y+=sz*1.5,j++){line(ctx,[[bb.x,y],[bb.x+bb.w,y]],stem||col,2);
    for(let x=bb.x+(j%2?sz/2:0);x<bb.x+bb.w+sz;x+=sz){leafShape(ctx,x,y,sz*.45,-.8,col);leafShape(ctx,x+sz/2,y,sz*.45,.8+Math.PI,col)}}}};
function leafShape(ctx,x,y,s,a,col){ctx.save();ctx.translate(x,y);ctx.rotate(a);ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(s*.5,-s*.45,s,0);ctx.quadraticCurveTo(s*.5,s*.45,0,0);ctx.fillStyle=col;ctx.fill();ctx.restore()}

/* fill a path flat, pattern it inside a clip, then outline it */
function shape(ctx,path,fill,pat,o){o=o||{};if(fill){ctx.fillStyle=fill;ctx.fill(path)}
  if(pat){ctx.save();ctx.clip(path);pat(ctx);ctx.restore()}
  if(o.line!=='none'){if(o.line==='single')sgl(ctx,path,o.lw||3);else dbl(ctx,path,o.lw||2.6,o.gap)}}

/* sprite with a quantised scale so patterns stay crisp; box in unit coordinates */
function sprite(ctx,key,x,y,s,box,fn,flip){const sb=Math.max(.1,Math.round(s*10)/10);const c=Spr.get(key+'|'+sb,box.w*sb,box.h*sb,g=>{g.scale(sb,sb);g.translate(box.ox,box.oy);fn(g)});
  const k=s/sb;ctx.save();ctx.translate(x,y);if(flip)ctx.scale(-1,1);ctx.drawImage(c,-box.ox*s,-box.oy*s,box.w*s,box.h*s);ctx.restore();void k}

/* ===== Motifs ===== */
function fishArt(g,body,acc){const pts=wob([[-46,0],[-30,-20],[0,-27],[30,-18],[46,0],[30,18],[0,27],[-30,20]],1.2,hash(body+acc));const p=sPath(pts,true);
  const tail=sPath([[40,0],[66,-22],[60,0],[66,22]],true);shape(g,tail,acc,c=>Pat.stripes(c,{x:40,y:-24,w:30,h:48},7,2.5,C.cream,true),{lw:2});
  shape(g,p,body,c=>{Pat.fishscale(c,{x:-10,y:-30,w:52,h:62},12,acc,2);c.fillStyle=acc;c.fillRect(-26,-30,8,60)},{lw:2.2});
  line(g,[[-14,-25],[-14,25]],C.line,2);dot(g,-30,-4,9,C.cream);ring(g,-30,-4,9,C.line,2.2);dot(g,-29,-4,4,C.line);
  const fin=sPath([[0,-26],[14,-40],[22,-22]],true);shape(g,fin,acc,null,{line:'single',lw:2})}
function drawFish(ctx,x,y,s,dir,body,acc,t,ph){const sw=Math.sin(t*5+(ph||0))*.08;ctx.save();ctx.translate(x,y);ctx.rotate(sw*.5);
  sprite(ctx,'fish'+body+acc,0,0,s,{w:150,h:100,ox:60,oy:50},g=>fishArt(g,body,acc),dir>0);ctx.restore()}

/* lotus flower: open 0 (bud) .. 1 (fully open); petals open one at a time */
function lotusArt(g,open,pink,acc){const n=7;const petal=(a,len,wd,col)=>{g.save();g.rotate(a);const p=sPath([[0,4],[-wd,-len*.45],[0,-len],[wd,-len*.45]],true);
    shape(g,p,col,c=>{line(c,[[0,0],[0,-len*.85]],C.cream,2);for(let k=.3;k<.9;k+=.18)dot(c,0,-len*k,2,acc)},{lw:2});g.restore()};
  const pads=sPath([[-60,8],[-30,0],[0,4],[30,0],[60,8],[30,16],[0,14],[-30,16]],true);shape(g,pads,C.leaf,c=>Pat.leaves(c,{x:-62,y:0,w:124,h:18},14,C.emerald),{lw:2});
  for(let i=n-1;i>=0;i--){const k=clamp(open*n*1.15-i*.95,0,1);const side=i%2?1:-1,idx=Math.ceil(i/2);const a=side*idx*(.13+k*.37);if(i>2&&k<=0)continue;petal(a,62-idx*6+(1-k)*idx*4,16+k*4+(1-k)*4,i%2?pink:C.coral)}
  petal(0,66,15,pink)}
function drawLotus(ctx,x,y,s,open,pink,acc){const q=Math.round(clamp(open,0,1)*8)/8;sprite(ctx,'lotus'+q+(pink||C.pink)+(acc||C.turmeric),x,y,s,{w:150,h:110,ox:75,oy:88},g=>lotusArt(g,q,pink||C.pink,acc||C.turmeric))}

function shellArt(g,col,acc){const p=sPath([[0,10],[-34,-6],[-30,-30],[-14,-42],[0,-46],[14,-42],[30,-30],[34,-6]],true);
  shape(g,p,col,c=>{for(let i=-3;i<=3;i++)line(c,[[0,8],[i*10,-46]],acc,2.5);Pat.dots(c,{x:-34,y:-46,w:68,h:50},12,2,C.cream)},{lw:2.2});
  shape(g,sPath([[-10,4],[0,18],[10,4]],true),acc,null,{line:'single',lw:2})}
function drawShell(ctx,x,y,s,col,acc){sprite(ctx,'shell'+col+acc,x,y,s,{w:90,h:80,ox:45,oy:56},g=>shellArt(g,col||C.cream,acc||C.coral))}

/* PROP_CONCH: cream-and-red patterned spiral shell with a clear opening */
function conchArt(g){const body=sPath([[-52,6],[-30,-24],[4,-34],[34,-24],[54,-6],[40,10],[10,24],[-24,24]],true);
  shape(g,body,C.cream,c=>{for(let i=0;i<5;i++)line(c,[[-40+i*18,-30],[-30+i*18,26]],C.red,4);Pat.dots(c,{x:-52,y:-34,w:110,h:60},10,1.8,C.coral)},{lw:2.4});
  const tip=sPath([[34,-24],[62,-14],[70,-4],[54,-6]],true);shape(g,tip,C.cream,c=>line(c,[[44,-20],[58,-8]],C.red,3),{lw:2});
  const sp=[];for(let i=0;i<=30;i++){const a=i/30*TAU*1.6,r=4+i*.55;sp.push([-30+Math.cos(a)*r,-2+Math.sin(a)*r*.8])}line(g,sp,C.line,2.2);
  const lip=sPath([[-20,18],[10,30],[34,14],[10,14]],true);shape(g,lip,C.coral,null,{lw:2})}
function drawConch(ctx,x,y,s){sprite(ctx,'conch',x,y,s,{w:150,h:90,ox:75,oy:45},conchArt)}

/* PROP_JEWEL: faceted gemstone in a gold setting */
function jewelArt(g,col){const set=sPath(ellPts(0,0,46,46,16),true);shape(g,set,C.gold,c=>Pat.dots(c,{x:-46,y:-46,w:92,h:92},10,2.4,C.turmeric),{lw:2.2});
  const gem=polyPath([[0,-36],[30,-12],[22,26],[-22,26],[-30,-12]]);shape(g,gem,col,c=>{c.fillStyle=C.white;c.beginPath();c.moveTo(-12,-14);c.lineTo(0,-30);c.lineTo(6,-14);c.closePath();c.fill();
    line(c,[[-30,-12],[30,-12]],C.line,1.6);line(c,[[0,-36],[-10,-12],[0,26]],C.line,1.6);line(c,[[0,-36],[10,-12],[0,26]],C.line,1.6)},{lw:2})}
function drawJewel(ctx,x,y,s,col){sprite(ctx,'jewel'+(col||C.emerald),x,y,s,{w:110,h:110,ox:55,oy:55},g=>jewelArt(g,col||C.emerald))}

/* golden decorative treasure medallion */
function medalArt(g){for(let i=0;i<10;i++){g.save();g.rotate(i/10*TAU);const p=sPath([[0,-30],[-12,-54],[0,-66],[12,-54]],true);shape(g,p,i%2?C.turmeric:C.saffron,null,{lw:1.8});g.restore()}
  const d=sPath(ellPts(0,0,34,34,14),true);shape(g,d,C.gold,c=>{ring(c,0,0,22,C.verm,4);Pat.dots(c,{x:-34,y:-34,w:68,h:68},9,2,C.cream)},{lw:2.2});dot(g,0,0,9,C.verm)}
function drawMedal(ctx,x,y,s){sprite(ctx,'medal',x,y,s,{w:150,h:150,ox:75,oy:75},medalArt)}

/* 8-point patterned star */
function starArt(g,col){const pts=[];for(let i=0;i<16;i++){const r=i%2?9:22,a=i/16*TAU-Math.PI/2;pts.push([Math.cos(a)*r,Math.sin(a)*r])}shape(g,polyPath(pts),col,null,{lw:1.5});dot(g,0,0,4,C.verm)}
function drawStar(ctx,x,y,s,col){sprite(ctx,'star'+col,x,y,s,{w:56,h:56,ox:28,oy:28},g=>starArt(g,col))}

/* moon with a gentle sleeping face and dotted rings */
function moonArt(g){const p=sPath(ellPts(0,0,90,90,20),true);shape(g,p,C.cream,c=>{ring(c,0,0,78,C.turmeric,6);Pat.dots(c,{x:-90,y:-90,w:180,h:180},16,2.2,C.turmeric)},{lw:3});
  const face=sPath(ellPts(0,6,52,52,14),true);shape(g,face,C.cream,null,{line:'single',lw:2.5});
  [[-20,-2],[20,-2]].forEach(([x,y])=>{g.beginPath();g.arc(x,y,9,.15*Math.PI,.85*Math.PI);g.strokeStyle=C.line;g.lineWidth=3;g.stroke()});
  g.beginPath();g.arc(0,20,12,.2*Math.PI,.8*Math.PI);g.strokeStyle=C.verm;g.lineWidth=3.4;g.stroke();dot(g,-30,16,5,C.pink);dot(g,30,16,5,C.pink);dot(g,0,-24,4,C.verm)}
function drawMoon(ctx,x,y,s){sprite(ctx,'moon',x,y,s,{w:200,h:200,ox:100,oy:100},moonArt)}

/* small geometric cloud */
function cloudArt(g,col,acc){const p=new Path2D();p.moveTo(-70,20);p.arc(-44,8,26,Math.PI*.9,Math.PI*1.75);p.arc(-6,-6,32,Math.PI*1.1,Math.PI*1.9);p.arc(38,6,26,Math.PI*1.25,Math.PI*2.1);p.lineTo(70,20);p.closePath();
  shape(g,p,col,c=>{for(const [x,y,r] of [[-44,10,12],[-6,-2,15],[38,8,12]]){const sp=[];for(let i=0;i<=24;i++){const a=i/24*TAU*1.4;sp.push([x+Math.cos(a)*r*i/24,y+Math.sin(a)*r*i/24])}line(c,sp,acc,2.2)}
    line(c,[[-64,16],[64,16]],acc,2)},{lw:2})}
function drawCloud(ctx,x,y,s,col,acc){sprite(ctx,'cloud'+col+acc,x,y,s,{w:160,h:90,ox:80,oy:52},g=>cloudArt(g,col||C.cream,acc||C.turq))}

/* small turtle (background life) */
function turtleArt(g){const sh=sPath([[-30,4],[-24,-16],[0,-24],[24,-16],[30,4]],true);
  [[-24,8],[24,8]].forEach(([x,y])=>shape(g,ellPath(x,y,10,5,x<0?-.5:.5),C.leaf,null,{line:'single',lw:2}));shape(g,ellPath(38,-2,10,8),C.leaf,null,{line:'single',lw:2});dot(g,41,-4,2.4,C.line);
  shape(g,sh,C.emerald,c=>{Pat.fishscale(c,{x:-30,y:-24,w:60,h:30},12,C.turmeric,2)},{lw:2})}
function drawTurtle(ctx,x,y,s,dir){sprite(ctx,'turtle',x,y,s,{w:100,h:56,ox:50,oy:30},turtleArt,dir<0)}

/* patterned folk-art halo: rings of petals and dots, never a soft glow */
function halo(ctx,x,y,r,cols,t,k){if(k!=null&&k<=0)return;ctx.save();if(k!=null)ctx.globalAlpha*=clamp(k,0,1);ctx.translate(x,y);
  const [a,b,c]=cols;dot(ctx,0,0,r,a);ring(ctx,0,0,r,C.line,3);const n=Math.max(12,Math.round(r/7));ctx.save();ctx.rotate((t||0)*.08);
  for(let i=0;i<n;i++){ctx.save();ctx.rotate(i/n*TAU);ctx.beginPath();ctx.moveTo(-r*.09,-r*.72);ctx.quadraticCurveTo(0,-r*1.02,r*.09,-r*.72);ctx.closePath();ctx.fillStyle=b;ctx.fill();ctx.strokeStyle=C.line;ctx.lineWidth=1.6;ctx.stroke();ctx.restore()}ctx.restore();
  ring(ctx,0,0,r*.66,C.line,2.2);for(let i=0;i<n;i++){const an=i/n*TAU-(t||0)*.05;dot(ctx,Math.cos(an)*r*.58,Math.sin(an)*r*.58,Math.max(1.5,r*.035),c)}ctx.restore()}

/* short patterned flash for feedback: a ring of petals that grows and fades */
function burst(ctx,x,y,k,r,col){if(k<=0||k>=1)return;ctx.save();ctx.globalAlpha*=1-k;ctx.translate(x,y);const rr=r*(.4+k*.8);
  for(let i=0;i<12;i++){ctx.save();ctx.rotate(i/12*TAU+k);ctx.beginPath();ctx.ellipse(0,-rr,6,14,0,0,TAU);ctx.fillStyle=i%2?col:C.cream;ctx.fill();ctx.strokeStyle=C.line;ctx.lineWidth=1.6;ctx.stroke();ctx.restore()}
  ring(ctx,0,0,rr*.7,col,4);ctx.restore()}

/* ===== Diya with a separate gentle flame layer ===== */
function diyaArt(g,col){const bowl=new Path2D();bowl.moveTo(-50,-4);bowl.quadraticCurveTo(-46,26,0,30);bowl.quadraticCurveTo(46,26,58,-10);bowl.lineTo(40,-6);bowl.quadraticCurveTo(0,4,-50,-4);bowl.closePath();
  shape(g,bowl,col,c=>{Pat.tri(c,{x:-52,y:4,w:110,h:10},12,C.turmeric);Pat.dots(c,{x:-50,y:14,w:100,h:14},10,2.2,C.cream);line(c,[[-48,2],[50,2]],C.line,1.6)},{lw:2.2});
  shape(g,ellPath(-2,-4,46,7),C.ochre,c=>Pat.dots(c,{x:-48,y:-10,w:96,h:12},8,1.6,C.turmeric),{line:'single',lw:2});
  shape(g,sPath([[-30,30],[30,30],[22,40],[-22,40]],true),C.verm,null,{line:'single',lw:2})}
function flame(ctx,x,y,s,t,lit,seed){if(lit<=0)return;const f=reduceMotion?0:Math.sin(t*6+(seed||0))*.04+Math.sin(t*9.3+(seed||0)*2)*.025;ctx.save();ctx.translate(x,y);ctx.scale(s*lit,s*lit*(1+f));ctx.rotate(f*.6);
  const o=sPath([[0,-56],[16,-18],[12,0],[0,6],[-12,0],[-16,-18]],true);shape(ctx,o,C.diya,null,{line:'single',lw:2.2});
  shape(ctx,sPath([[0,-38],[9,-12],[0,2],[-9,-12]],true),C.turmeric,null,{line:'none'});shape(ctx,ellPath(0,-8,4,8),C.white,null,{line:'none'});ctx.restore()}
function drawDiya(ctx,x,y,s,o){o=o||{};const lit=o.lit||0;if(lit>0&&o.halo!==false)halo(ctx,x+52*s,y-34*s,58*s*lit,[C.turmeric,C.saffron,C.verm],o.t||0,lit*.9);
  sprite(ctx,'diya'+(o.col||C.verm),x,y,s,{w:130,h:80,ox:60,oy:30},g=>diyaArt(g,o.col||C.verm));
  line(ctx,[[x+44*s,y-6*s],[x+52*s,y-14*s]],C.line,3*s);flame(ctx,x+52*s,y-12*s,s,o.t||0,lit,o.seed)}

/* ===== The three gift motifs (ICON_HEALTH, ICON_KINDNESS, ICON_GRATITUDE); fill 0..1 rises from below ===== */
function giftPath(kind){if(kind==='leaf')return sPath([[0,70],[-40,30],[-52,-14],[-30,-56],[0,-78],[30,-56],[52,-14],[40,30]],true);
  if(kind==='heart'){const p=new Path2D();p.moveTo(0,70);p.bezierCurveTo(-30,44,-74,14,-70,-22);p.bezierCurveTo(-66,-58,-22,-70,0,-38);p.bezierCurveTo(22,-70,66,-58,70,-22);p.bezierCurveTo(74,14,30,44,0,70);p.closePath();return p}
  const p=new Path2D();p.moveTo(-70,0);p.quadraticCurveTo(-64,50,0,56);p.quadraticCurveTo(64,50,76,-6);p.lineTo(54,-2);p.quadraticCurveTo(0,12,-70,0);p.closePath();return p}
function giftPattern(c,kind){if(kind==='leaf'){line(c,[[0,70],[0,-70]],C.cream,4);for(let y=-50;y<50;y+=18){line(c,[[0,y+14],[-34,y-6]],C.cream,3);line(c,[[0,y+14],[34,y-6]],C.cream,3)}Pat.dots(c,{x:-52,y:-80,w:104,h:150},14,2.4,C.turmeric)}
  else if(kind==='heart'){Pat.scallops(c,{x:-74,y:-70,w:148,h:140},18,C.turmeric,2.4);dot(c,0,-6,16,C.turmeric);ring(c,0,-6,26,C.cream,4)}
  else{Pat.tri(c,{x:-72,y:10,w:150,h:14},16,C.turmeric);Pat.dots(c,{x:-70,y:26,w:140,h:28},12,2.6,C.cream)}}
function drawGift(ctx,kind,x,y,s,fill,t,hl){const col=kind==='leaf'?C.leaf:kind==='heart'?C.verm:C.saffron;ctx.save();ctx.translate(x,y);ctx.scale(s,s);
  if(hl>0){const k=.5+.5*Math.sin(t*4);ctx.save();ctx.globalAlpha*=hl;ring(ctx,0,0,96+k*10,C.turmeric,6);ring(ctx,0,0,108+k*10,C.cream,3);ctx.restore()}
  const p=giftPath(kind);ctx.fillStyle=C.cream;ctx.fill(p);ctx.save();ctx.clip(p);ctx.save();ctx.globalAlpha*=.3;ctx.fillStyle=col;ctx.fill(p);giftPattern(ctx,kind);ctx.restore();
  if(fill>0){ctx.beginPath();ctx.rect(-90,80-170*fill,180,170*fill);ctx.clip();ctx.fillStyle=col;ctx.fill(p);giftPattern(ctx,kind)}ctx.restore();
  ctx.setLineDash(fill>=1?[]:[10,8]);dbl(ctx,p,2.6);ctx.setLineDash([]);
  if(kind==='diya'){line(ctx,[[60,-4],[70,-14]],C.line,3);flame(ctx,70,-12,1.2,t,fill>=1?1:fill*.4,3)}ctx.restore()}

/* ===== Scalloped wave band (ENV_COSMIC_OCEAN building block) ===== */
function waveBand(ctx,o){const {y,amp,per,ph,fill,lineCol,acc,W,bottom}=o;const x0=-per+((ph%per)+per)%per-per;const p=new Path2D();p.moveTo(x0,bottom);p.lineTo(x0,y);
  for(let x=x0;x<W+per;x+=per){p.quadraticCurveTo(x+per*.5,y-amp*2,x+per,y)}p.lineTo(W+per*2,bottom);p.closePath();ctx.fillStyle=fill;ctx.fill(p);
  ctx.save();ctx.clip(p);ctx.beginPath();const rows=o.rows||3;for(let r=1;r<=rows;r++){const yy=y+r*Math.max(14,amp*1.6+10),off=r%2?per/2:0;

    if(i===0)drawStar(ctx,x,y,2.4,C.turmeric);else if(i===1)drawLotus(ctx,x,y+40,1.1,1);else{const p=sPath(ellPts(x,y,120,60,14),true);shape(ctx,p,C.turq,c=>{drawCloud(c,x-30,y+10,.6,C.cream,C.turq);drawStar(c,x+60,y-14,.6,C.cream)},{lw:2.4})}ctx.restore()}
  const order=[1,0,2];for(const i of order){const c=G.clouds[i];if(!c||c.k<=0)continue;const [x,y]=g4Pos(o,i);ctx.save();ctx.globalAlpha*=c.k;drawDarkCloud(ctx,x+c.dx+Math.sin(T.sec*.7+i)*6,y,o.P?.8:1);ctx.restore()}
  if(W.refrain>0){ctx.save();ctx.globalAlpha*=W.refrain;const w=Math.min(o.W-100,900),h=120,y=L.top()+20;plaque(ctx,o.cx-w/2,y,w,h);const sz=o.P?40:46;const ln=wrapLines(ctx,TXT.g4refrain,w-60,sz);ln.forEach((s,j)=>ctext(ctx,s,o.cx,y+h/2+(j-(ln.length-1)/2)*sz*1.1,sz,C.red));ctx.restore()}}

/* ---------------- SCENE 5 ---------------- */
async function shot11(){chapter(5);UI.progress('11');const W=World;inWorld();W.mood('treasure',2200);Music.mood('bright');W.autoChurn=.5;W.lean=1;
  W.conch={y:1,vis:1};W.jewel={y:1,vis:1};W.medal={y:1,vis:0};
  let p=say(TXT.s5[0]);AU.sfx('rise');await D.tw(W.conch,{y:0},2200,'out');AU.sfx('rise');await D.tw(W.jewel,{y:0},2200,'out');await p;
  p=say(TXT.s5[1]);AU.sfx('glow');const o=W.lay();W.burstAt(o.cx+o.mw*(o.P?.62:.78),o.bands[2]-70,C.emerald,90);await p;
  p=say(TXT.s5[2]);W.medal.vis=1;AU.sfx('rise');tw(W,{beingsK:1},2400);await D.tw(W.medal,{y:0},2400,'out');W.devas.forEach(f=>f.expr='wonder');await p;
  /* the water parts around a large lotus bud; it opens to reveal Goddess Lakshmi */
  W.autoChurn=0;tw(W,{pull:0},800);W.lean=0;tw(W.vs,{rest:1},1400);tw(W.medal,{vis:0},1200);tw(W,{beingsK:0},1500);
  p=say(TXT.s5[3]);W.lbud={vis:1,open:0,y:1};tw(W,{part:.55},1500);AU.sfx('water');await D.tw(W.lbud,{y:0},2000,'out');
  W.lakshmi.vis=0;tw(W.lakshmi,{vis:1},2400);for(let i=1;i<=8;i++){W.lbud.open=i/8;AU.sfx('bell',600+i*70);await D.wait(240)}
  [...W.devas,...W.asuras].forEach(f=>{f.pose('fold');f.expr='wonder'});await p;
  p=say(TXT.s5[4]);W.lakshmi.pose('bless');tw(W,{floral:1},2400);Music.swell();await p;tw(W,{part:0},1500);
  await say(TXT.s5.slice(5));
  /* Lakshmi's lotus petals drift across the screen and become shapes in the treasure hunt */
  FX.add(o.lak.x,o.lak.y-120,16,o.W*.8);await D.wait(1400)}

async function shot12(){UI.progress('12');Hunt.reset();Store.set('treasures',[]);D.setScene(Hunt,'fade',900);UI.stripOn=true;UI.strip();
  const counter=()=>{const n=Hunt.order.length;huntPlaque(`${n} of 3 treasures found`)};
  const huntPlaque=(cue)=>UI.plaque({slots:['lotus','jewel','conch'].map(k=>({k,on:!!Hunt.found[k],label:Hunt.targets[k].label})),cue,
    buttons:[{label:'Need a hint?',on:()=>{Hunt.hint=Hunt.next()}},{label:'Continue',small:true,on:()=>{['lotus','jewel','conch'].forEach(k=>Hunt.find(k))}}]});
  counter();
  let resolve;const all=new Promise(r=>resolve=r);Hunt.onFind=()=>{counter();UI.strip();if(Hunt.order.length===3)resolve()};
  await say(TXT.g5cue);
  await D.activity({idle:15,start:()=>all,hint:()=>{Hunt.hint=Hunt.next()},assistAfter:8,assist:()=>{const k=Hunt.next();if(k)Hunt.find(k)}});
  Store.push('done','game5');AU.sfx('celebrate');await D.wait(1200);UI.plaque(null);
  /* transition narration over the golden light rising in the ocean */
  const W=World;preset(6);W.lakshmi.vis=0;W.lbud.vis=0;W.dhan.vis=0;W.spd=.35;W.amp=.7;D.setScene(W,'fade',1200);D.title(CHAPTERS[5].t);
  await say(TXT.g5trans[0]);AU.sfx('glow');tw(W,{goldC:.6},1800);await say(TXT.g5trans[1]);tw(W,{part:.4},1600);await say(TXT.g5trans[2])}

/* ---------------- SCENE 6 ---------------- */
async function shot13(){chapter(6);UI.progress('13');const W=World;inWorld();if(W.goldC<=0){W.spd=.35;W.amp=.7}W.mood('gold',1600);
  /* golden circle, waves open symmetrically, Dhanvantari rises slowly with the pot */
  AU.sfx('glow');await D.tw(W,{goldC:1},1400);await D.tw(W,{part:1.15},1800);
  AU.sfx('conch');W.dhan.vis=1;W.dhan.pose('hold',true);W.dhan.expr='calm';W.dhanRise=0;const rise=D.tw(W,{dhanRise:1},6500,'io');
  await say(TXT.s6a[0]);await rise;AU.sfx('bells');Music.swell();
  const p=say(TXT.s6a[1]);for(let i=0;i<3;i++){await D.tw(W,{potPulse:1},700);await D.tw(W,{potPulse:0},900)}await p;
  [...W.devas,...W.asuras].forEach(f=>{f.expr='wonder'});AU.sfx('celebrate');await say(TXT.s6a[2]);tw(W,{goldC:.6},1500);
  /* the golden motifs around the pot separate into a leaf, a heart and a diya */
  const o=W.lay(),pot=W.dhan.toWorld(W.potLocal);W.giftPos={leaf:pot.slice(),heart:pot.slice(),diya:pot.slice()};W.giftScale={leaf:.3,heart:.3,diya:.3};W.giftVis=1;AU.sfx('rise');
  await Promise.all(['leaf','heart','diya'].map(k=>D.tw(W.giftPos[k],{0:o.gifts[k][0],1:o.gifts[k][1]},1800,'out')).concat(['leaf','heart','diya'].map(k=>D.tw(W.giftScale,{[k]:1},1800,'out'))));
  W.giftPos=null;W.giftScale=null}
async function shot14(){UI.progress('14');const W=World;W.giftVis=1;UI.stripOn=true;UI.strip();
  await say(TXT.s6b);await say(TXT.fgcue);
  const order=['leaf','heart','diya'],cams={leaf:()=>Cam.raised(),heart:()=>false,diya:()=>false};
  const name={leaf:'Health',heart:'Kindness',diya:'Gratitude'};
  for(const k of order){let filled=false,resolve;const done=new Promise(r=>resolve=r);
    const fill=async()=>{if(filled)return;filled=true;W.giftHL[k]=0;AU.sfx('chime');const o=W.lay();W.burstAt(o.gifts[k][0],o.gifts[k][1],C.turmeric,120);await D.tw(W.gifts,{[k]:1},1200,'out');Store.push('gifts',k);UI.strip();resolve()};
    W.tapH=p=>{const o=W.lay(),g=o.gifts[k];if(Math.hypot(p.x-g[0],p.y-g[1])<Math.max(110,40/L.U))fill()};
    UI.plaque({icon:g=>drawGift(g,k,0,0,.5,1,T.sec,0),cue:name[k],sub:TXT.fg[k],buttons:[{label:'Tap the '+k,main:true,on:fill}],flash:true});
    W.giftHL[k]=1;const camIv=setInterval(()=>{if(cams[k]())fill()},300);
    await say(TXT.fg[k]);
    try{await D.activity({idle:15,start:()=>done,hint:()=>{W.giftHL[k]=1;AU.sfx('glow')},assistAfter:3,assist:fill})}finally{clearInterval(camIv)}
    if(k==='leaf')W.dhan.pose('bless');await D.wait(500)}
  W.tapH=null;UI.plaque(null);Store.push('done','final');
  /* healthComplete, kindnessComplete and gratitudeComplete: the whole ocean becomes festive and bright */
  W.mood('festive',2200);tw(W,{festive:1,goldC:0,part:.4},2200);Music.swell();AU.sfx('celebrate');W.dhan.pose('bless');[...W.devas,...W.asuras].forEach(f=>{f.pose('cheer');f.expr='smile'});await D.wait(3200);
  /* the completed diya expands into the first lamp */
  const o=W.lay();W.giftScale={diya:1};AU.sfx('lamp');await D.tw(W.giftScale,{diya:1.9},1500,'io');await D.wait(300)}

/* ---------------- CELEBRATION ---------------- */
async function shot15(){chapter(7);UI.progress('15');const S=Celebration;S.reset();S.build();D.setScene(S,'fade',1400);UI.strip();
  let autoAt=null;S.onLit=()=>{D.lastInput=performance.now()};
  AU.sfx('water');await D.tw(S,{floorK:1},2200);tw(S,{houseK:1},1400);await D.tw(S,{firstK:1},1200,'back');
  const first=S.lamps[0];await D.wait(500);S.light(first);
  UI.plaque({icon:g=>drawDiya(g,-10,20,.8,{lit:1,t:T.sec,halo:false}),cue:'Light the lamps',sub:'Tap each diya to share the light.',buttons:[{label:'Light them all',small:true,on:()=>{autoAt=0}}]});
  /* the light spreads one lamp at a time: the child may tap, the rest light themselves after about 15 seconds */
  const startT=performance.now();let stopSpread=false;
  (async()=>{try{await D.wait(15000);if(autoAt==null)autoAt=0}catch(e){}})();
  const spread=(async()=>{const tok=D.token;while(!stopSpread&&tok===D.token){const l=S.lamps.find(x=>!x.lit);if(!l)break;if(autoAt!=null||performance.now()-D.lastInput>15000&&performance.now()-startT>15000){S.light(l);await D.wait(700).catch(()=>{});}else await new Promise(r=>setTimeout(r,200))}})();
  tw(S,{tableauK:1},2000);tw(S,{edgeK:1},3000);
  await say(TXT.close.slice(0,5));
  autoAt=0;await spread;stopSpread=true;UI.plaque(null);
  const p=say(TXT.close[5]);await D.wait(1200);AU.sfx('celebrate');Music.swell();await D.tw(S,{blessK:1},1400);await p;
  Store.push('done','celebration');
  /* hold the final frame 5-7 seconds */
  await D.wait(6000);
  if(!(D.qa&&D.qa.noEnd))End.show()}

const SHOTS=[shot00,shot01,shot02,shot03,shot04,shot05,shot06,shot07,shot08,shot09,shot10,shot11,shot12,shot13,shot14,shot15];

/* ===== Main loop, start and end screens, controls ===== */
D.inset=0;
/* while picture cards are up, the painting shrinks into the space above them so no face is covered */
function insetRect(){if(D.inset<=.001)return{x:0,y:0,s:1};const tray=$('tray');let px=L.ph*.42;try{if(!tray.hidden){const r=tray.getBoundingClientRect(),a=app.getBoundingClientRect();px=a.bottom-r.top+12}}catch(e){}
  const st=clamp((L.ph-px-8)/L.ph,.3,1);const s=lerp(1,st,D.inset);return{x:(L.W-L.W*s)/2,y:lerp(0,6/L.U,D.inset),s}}
Input.toLogical=function(x,y){const r=cv.getBoundingClientRect();const lx=(x-r.left)/L.U,ly=(y-r.top)/L.U;const ins=insetRect();return{x:(lx-ins.x)/ins.s,y:(ly-ins.y)/ins.s}};

let lastT=performance.now();
function frame(now){const dt=Math.min(.05,(now-lastT)/1000);lastT=now;T.sec+=dt;T.now+=dt*1000*D.speed;Tw.update();Timers.update();if(AU.ctx)Music.tick();
  const s=D.scene;cx.setTransform(1,0,0,1,0,0);cx.fillStyle=getComputedStyle(app).backgroundColor||C.cream;cx.fillRect(0,0,cv.width,cv.height);
  World.update(dt);if(s===Celebration&&s.dhan)[s.dhan,s.lak,s.kub].forEach(f=>f.update(dt));
  if(s){const k=L.U*L.dpr,ins=insetRect();cx.setTransform(k*ins.s,0,0,k*ins.s,k*ins.x,k*ins.y);cx.lineCap='round';cx.lineJoin='round';
    if(ins.s<1){cx.save();cx.beginPath();cx.rect(0,0,L.W,L.H);cx.clip()}
    try{s.draw(cx);if(s!==World)FX.draw(cx)}catch(e){console.error(e)}
    if(ins.s<1)cx.restore();
    if(ins.s<1){const p=new Path2D();p.rect(-4,-4,L.W+8,L.H+8);dbl(cx,p,3/ins.s)}}
  const tr=D.trans;if(tr){const k=clamp((T.now-tr.t0)/tr.ms,0,1);cx.setTransform(1,0,0,1,0,0);cx.globalAlpha=1-ease(k);cx.drawImage(tr.snap,0,0);cx.globalAlpha=1;if(k>=1)D.trans=null}
  requestAnimationFrame(frame)}

/* start overlay: LET'S BEGIN unlocks audio and speech in the same tap */
const Start={res:null,wait(){if(D.fast||D.qa)return Promise.resolve();UI.cap('story',TXT.open);$('start').hidden=false;return new Promise(r=>this.res=r)},
  unlock(){AU.init();AU.resume();Speech.init();try{if(Speech.ok){const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u)}}catch(e){}}};
$('bBegin').addEventListener('click',()=>{Start.unlock();$('start').hidden=true;Store.reset();UI.stripOn=false;UI.strip();if(Start.res){const r=Start.res;Start.res=null;r()}else play(0,true)});
$('bResume').addEventListener('click',()=>{Start.unlock();$('start').hidden=true;resume(SAVED_CH)});

async function resume(ch){D.resumed=true;await play(CHAPTERS[ch].shot,true,RECAP[ch])}
/* play from a shot index; chapter starts reset the world so replays and resumes look right */
async function play(from,skipStart,recap){const tok=++D.token;Tw.kill();Timers.kill();Speech.stop();D.q=Promise.resolve();D.act=null;D.skipFn=null;D.inset=0;
  $('end').hidden=true;Cards.hide();UI.plaque(null);UI.cap(null);FX.petals=[];Hunt.onFind=null;
  if(!skipStart)$('start').hidden=true;
  const ch=CHAPTERS.reduce((a,c,i)=>c.shot<=from?i:a,0);
  if(ch>=1&&from===CHAPTERS[ch].shot){preset(ch);D.setScene(World,'fade',700)}
  UI.stripOn=Store.data.treasures.length>0||Store.data.gifts.length>0;UI.strip();
  try{if(recap){D.title(CHAPTERS[ch].t);UI.progress(SHOT_IDS[from]);await D.wait(600);await say(recap)}
    for(let i=from;i<SHOTS.length;i++){D.shot=SHOT_IDS[i];if(D.qa)D.qa.cur=i;await SHOTS[i]();D.guard(tok);
      if(D.qa&&D.qa.stop==='end'&&D.qa.at===i){D.qa.paused=true;D.fast=false;D.speed=1;if(D.qa.cap)UI.cap(D.qa.capWho||'story',D.qa.cap);await new Promise(()=>{})}}}
  catch(e){if(e!==ABORT)console.error(e)}}

const End={show(){const el=$('endIcons');el.innerHTML='';const d=Store.data;const add=(k)=>{const c=document.createElement('canvas');c.width=c.height=112;const g=c.getContext('2d');g.scale(112/120,112/120);g.translate(60,60);drawIcon(g,k,.8);c.title=k;el.append(c)};
    const l1=document.createElement('span');l1.className='lbl';l1.textContent='Treasures you found';el.append(l1);(d.treasures.length?d.treasures:['lotus','jewel','conch']).forEach(add);
    const l2=document.createElement('span');l2.className='lbl';l2.textContent='Gifts you carry home';el.append(l2);['leaf','heart','diya'].forEach(add);
    $('end').hidden=false;UI.cap(null);
    const t=d.treasures.length===3?`You found ${TREASURE_NAME[d.treasures[0]]} first, then ${TREASURE_NAME[d.treasures[1]]}, then ${TREASURE_NAME[d.treasures[2]]}. And you collected three gifts: health, kindness and gratitude.`:null;
    if(t)say(t).catch(()=>{})}};
$('bAgain').addEventListener('click',()=>{Start.unlock();Store.reset();UI.stripOn=false;UI.strip();play(1,false,null)});
$('bMute').addEventListener('click',()=>{const m=!AU.muted;AU.setMute(m);if(m)Speech.stop();$('bMute').setAttribute('aria-pressed',String(m));$('mWave').style.display=m?'none':'';$('mX').style.display=m?'':'none'});
$('bSkip').addEventListener('click',()=>D.skip());
$('bReplay').addEventListener('click',()=>{if(!$('start').hidden&&D.chapter===0)return;Start.unlock();const ch=D.chapter;if(ch===0){play(0,false);return}play(CHAPTERS[ch].shot,false,null)});
$('bCam').addEventListener('click',()=>Cam.toggle());

/* boot */
(function(){const p=$('prog');SHOT_IDS.forEach((id,i)=>{const e=document.createElement('i');if(CHAPTERS.some(c=>c.shot===i)&&i>0)e.classList.add('gap');p.append(e)})})();
const _prog=UI.progress;UI.progress=function(s){_prog.call(UI,s);const i=SHOT_IDS.indexOf(s);document.querySelectorAll('#prog i').forEach((e,j)=>{const g=e.classList.contains('gap');e.className=(j<i?'done':j===i?'now':'')+(g?' gap':'')})};
Store.load();relayout();window.addEventListener('resize',()=>relayout());if(window.ResizeObserver)new ResizeObserver(()=>relayout()).observe(app);
World.make();D.scene=World;const SAVED_CH=Store.data.done.length?Store.data.chapter:0;
if(Store.data.chapter>0&&Store.data.done.length){const b=$('bResume');b.hidden=false;b.textContent='Continue: '+CHAPTERS[Store.data.chapter].t.split(' · ')[0]}
Speech.init();requestAnimationFrame(frame);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>Spr.clear());
/* QA hook (#qa): window.__qa.go(shotIndex,'end'|'act',{cap,portrait}) fast-forwards from that chapter's start */
if(/qa/.test(location.hash)){window.__qa={go(at,stop,o){o=o||{};D.fast=stop!=='run';D.speed=stop==='run'?(o.speed||8):40;D.qa=Object.assign({at,stop:stop||'end',paused:false,cur:null},o);$('start').hidden=true;
    const ch=CHAPTERS.reduce((a,c,i)=>c.shot<=at?i:a,0);if(o.treasures)Store.data.treasures=o.treasures;play(CHAPTERS[ch].shot,true);return true},paused:()=>D.qa&&D.qa.paused}}
else play(0,true);

</script>
