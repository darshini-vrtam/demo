<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Ocean That Gave Us the Gift of Life</title>
<meta name="description" content="Dhanteras: The Ocean That Gave Us the Gift of Life. An interactive Madhubani-inspired story for children aged 6 to 10.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Yatra+One&display=swap">
<style>
/* Layout: one painted SVG stage on top; a quiet dock below it holds narration, chant cards, instructions and controls. */
:root{
  --midnight:#0E1240; --indigo:#262F85; --sea:#2C7CC4; --turq:#17B2AE; --ivory:#FFF4D9; --verm:#E03C1F; --turmeric:#F5B700; --gold:#C8962A; --leaf:#3F9B49; --ink:#111111;
  --bg:#FFF4D9; --fg:#111111; --panel:#FFF4D9; --panel-fg:#111111; --line:#111111; --hint:#E03C1F; --pill:#262F85; --pill-fg:#FFF4D9; --focus:#262F85;
  --chant:#F5B700; --chant-fg:#111111;
  --font-display:"Yatra One","Kohinoor Devanagari","Palatino Linotype",Georgia,serif;
  --font-body:"Baloo 2","Trebuchet MS","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#111111; --fg:#FFF4D9; --panel:#0E1240; --panel-fg:#FFF4D9; --line:#F5B700; --hint:#F5B700; --pill:#FFF4D9; --pill-fg:#0E1240; --focus:#F5B700; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#111111; --fg:#FFF4D9; --panel:#0E1240; --panel-fg:#FFF4D9; --line:#F5B700; --hint:#F5B700; --pill:#FFF4D9; --pill-fg:#0E1240; --focus:#F5B700; color-scheme:dark }
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:max(10px,env(safe-area-inset-top,0px));padding-bottom:max(10px,env(safe-area-inset-bottom,0px))}
#app{position:relative;width:100%;height:100%;overflow:hidden;border-radius:14px;background:var(--midnight);border:3px solid var(--line);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;--dk:120px;--bd:24px;--ha:600px}
#stage{position:absolute;left:0;top:0;width:100%;height:100%;display:block;touch-action:none;overflow:hidden}
[hidden]{display:none!important}
button{font-family:var(--font-body)}
button:focus-visible{outline:4px solid var(--focus);outline-offset:3px}
/* real buttons laid over the painting for keyboard and screen readers; the painting draws the highlight */
#hot{position:absolute;inset:0;pointer-events:none;z-index:3}
.hs{position:absolute;left:0;top:0;pointer-events:none;background:transparent;border:0;padding:0;margin:0;opacity:0}
.hs:focus-visible{opacity:1;outline:none;box-shadow:0 0 0 4px var(--ivory),0 0 0 8px var(--ink);border-radius:50%}
#hud{position:absolute;top:calc(var(--bd) + 8px);right:calc(var(--bd) + 8px);display:flex;gap:8px;z-index:6}
.hb{width:46px;height:46px;border-radius:50%;border:3px solid var(--ink);background:var(--ivory);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
.hb svg{width:24px;height:24px}
.hb[aria-pressed="true"]{background:var(--turmeric)}
.hb:focus-visible{outline:none;box-shadow:0 0 0 4px var(--turmeric),0 0 0 7px var(--ink)}
#badge{position:absolute;top:calc(var(--bd) + 4px);left:calc(var(--bd) + 4px);z-index:6;width:58px;height:58px;border-radius:50%;background:var(--ivory);border:3px solid var(--ink);
  display:grid;place-items:center;padding:0}
#badge svg{width:50px;height:50px;overflow:visible}
#chip{position:absolute;top:calc(var(--bd) + 16px);left:calc(var(--bd) + 72px);z-index:6;font:700 13px/1.1 var(--font-body);letter-spacing:.06em;text-transform:uppercase;
  background:var(--ivory);color:var(--ink);border:2.5px solid var(--ink);border-radius:999px;padding:8px 12px;max-width:calc(100% - var(--bd)*2 - 330px);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:700px){ #chip{display:none} .hb{width:40px;height:40px} .hb svg{width:21px;height:21px} #hud{gap:6px} #badge{width:50px;height:50px} #badge svg{width:42px;height:42px} }
/* dock: narration captions, chant cards and activity controls */
#dock{position:absolute;left:0;right:0;bottom:0;height:var(--dk);z-index:5;background:var(--panel);color:var(--panel-fg);border-top:4px solid var(--line);
  display:flex;flex-direction:column;justify-content:center;gap:6px;padding:6px clamp(12px,3vw,40px);overflow:hidden;
  --fs:clamp(14px,min(calc(var(--dk) * .135),calc(1.5vw + 9px)),27px)}
#cap{max-width:1100px;width:100%;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:2px}
#capWho{display:inline-flex;align-items:center;gap:6px;font:800 calc(var(--fs) * .56)/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;opacity:.9}
#capWho i{width:.95em;height:.95em;border-radius:50%;display:inline-block;border:2px solid var(--ink)}
#capText{margin:0;font-size:var(--fs);line-height:1.36;font-weight:600;text-wrap:pretty;text-align:center}
#cap.off #capText{display:none}
#act{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px 18px;max-width:1200px;width:100%;margin:0 auto}
#actText{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1 1 260px;align-items:center;text-align:center}
#ins{margin:0;font-size:var(--fs);line-height:1.3;font-weight:700;text-wrap:balance;display:flex;align-items:center;gap:.4em;justify-content:center}
#ins svg{width:1.6em;height:1.6em;flex:none}
#ins.hint{color:var(--hint)}
#cnt{margin:0;font:700 calc(var(--fs) * .78)/1.2 var(--font-body);letter-spacing:.03em;background:var(--pill);color:var(--pill-fg);border-radius:999px;padding:3px 14px;font-variant-numeric:tabular-nums}
#ctrl{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
#ctrl:empty{display:none}
.big{font:800 clamp(16px,calc(var(--fs) * .92),22px)/1 var(--font-body);min-height:50px;padding:10px 24px;border-radius:999px;border:3px solid var(--ink);background:var(--turmeric);color:var(--ink);cursor:pointer;
  box-shadow:0 4px 0 var(--ink);transition:transform .15s ease}
.big.alt{background:var(--ivory)}
.big:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.big:disabled{opacity:.45;cursor:default;box-shadow:none}
.lotusbtn{display:inline-flex;align-items:center;gap:8px}
.lotusbtn svg{width:30px;height:24px}
/* chant card: the line the child says aloud, word by word */
#chant{max-width:1100px;width:100%;margin:0 auto;display:flex;align-items:center;justify-content:center;gap:14px;cursor:pointer;background:var(--chant);color:var(--chant-fg);
  border:3px solid var(--ink);border-radius:18px;padding:6px 16px;min-height:calc(var(--dk) - 26px)}
#chant .who{font:800 calc(var(--fs) * .5)/1.1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;writing-mode:horizontal-tb}
#chantText{margin:0;font:400 calc(var(--fs) * 1.32)/1.18 var(--font-display);text-align:center;text-wrap:balance}
#chantText span{border-radius:10px;padding:0 .12em;transition:background .25s ease,color .25s ease}
#chantText span.on{background:var(--ink);color:var(--turmeric)}
#chantText span.done{text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:5px}
#chant .go{flex:none;width:44px;height:44px;border-radius:50%;border:3px solid var(--ink);background:var(--ivory);display:grid;place-items:center}
#chant .go svg{width:20px;height:20px}
/* picture cards for the treasure pot */
.tray{position:absolute;left:0;right:0;bottom:var(--dk);z-index:5;display:grid;justify-content:center;gap:clamp(6px,1.4vw,18px);padding:10px clamp(8px,2.4vw,26px);
  background:var(--panel);border-top:4px solid var(--line);grid-template-columns:repeat(5,minmax(0,200px))}
@media (max-width:700px){.tray{grid-template-columns:repeat(3,minmax(0,1fr));padding:6px 6px;gap:5px} .card{padding:3px 3px 5px;border-radius:14px} .card svg{max-height:7.5vh} .card small{font-size:11px;line-height:1.1}}
.card{min-width:0;background:var(--ivory);color:var(--ink);border:3.5px solid var(--ink);border-radius:18px;padding:6px 6px 8px;cursor:pointer;display:flex;flex-direction:column;gap:2px;
  transition:transform .2s ease,box-shadow .2s ease;position:relative;align-items:center}
.card svg{width:100%;aspect-ratio:5/3.6;max-height:15vh;display:block}
.card b{font:800 clamp(12px,.8vw + .6vh + 4px,18px)/1.1 var(--font-body);text-align:center;letter-spacing:.04em}
.card small{font:600 clamp(11px,.6vw + .5vh + 3px,15px)/1.15 var(--font-body);text-align:center;text-wrap:balance}
.card[aria-pressed="true"]{transform:translateY(-4px);box-shadow:0 0 0 5px var(--turmeric),0 0 0 8px var(--ink)}
.card[aria-pressed="true"]::after{content:"";position:absolute;top:-10px;right:-10px;width:28px;height:28px;border-radius:50%;background:var(--leaf);border:3px solid var(--ink);
  background-image:radial-gradient(circle,var(--ivory) 0 4px,transparent 5px)}
.card.reading{box-shadow:0 0 0 4px var(--ivory),0 0 0 7px var(--verm)}
.card:focus-visible{outline:none;box-shadow:0 0 0 5px var(--ivory),0 0 0 9px var(--focus)}
.pulse{animation:pulse 1.3s ease-in-out 3}
@keyframes pulse{50%{transform:translateY(-6px) scale(1.04)}}
/* overlays: start card, episode title cards, end card */
.ov{position:absolute;left:0;right:0;top:0;bottom:0;z-index:8;display:grid;place-items:center;padding:calc(var(--bd) + 14px)}
.panel{background:var(--ivory);color:var(--ink);border:4px solid var(--ink);border-radius:24px;padding:20px 26px;max-width:620px;width:100%;
  text-align:center;display:flex;flex-direction:column;gap:12px;box-shadow:0 0 0 7px var(--turmeric),0 0 0 11px var(--ink)}
.panel h1{font:400 clamp(26px,3.2vw + 1vh,48px)/1.12 var(--font-display);margin:0;text-wrap:balance}
.panel .eyebrow{font:800 13px/1.2 var(--font-body);letter-spacing:.14em;text-transform:uppercase;margin:0;color:var(--verm)}
.panel p{margin:0;font-size:16px;line-height:1.45}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
#begin{font-size:clamp(20px,2vw + 8px,28px);min-height:64px;padding:14px 34px}
#tcard{pointer-events:none;bottom:var(--dk)}
#tcard .panel{max-width:760px;background:transparent;border:0;box-shadow:none;color:var(--ivory)}
#tcard .eyebrow{color:var(--turmeric);font-size:clamp(14px,1.2vw + 6px,22px)}
#tcard h1{font-size:clamp(28px,3.6vw + 1.4vh,64px);color:var(--ivory);text-shadow:0 3px 0 var(--ink),3px 0 0 var(--ink),-3px 0 0 var(--ink),0 -3px 0 var(--ink)}
#end{bottom:var(--dk);place-items:end center;pointer-events:none}
#end .panel{pointer-events:auto;max-width:520px;padding:12px 18px;gap:8px}
#end h1{font-size:clamp(20px,2.2vw + 1vh,36px)}
@media (max-width:700px){#end .panel{padding:8px 12px;gap:6px;box-shadow:0 0 0 4px var(--turmeric),0 0 0 7px var(--ink)} #end .big{min-height:44px;padding:8px 20px}}
@media (prefers-reduced-motion: reduce){.card,.big,#chantText span{transition:none}.pulse{animation:none;outline:4px dashed var(--turmeric);outline-offset:3px}}
</style>

<body>

  </div>
  <div id="tray" class="tray" hidden></div>
  <div id="dock">

      <span class="who" id="chantWho">Say it together</span><p id="chantText"></p>
      <span class="go" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 5l11 7-11 7z"/></svg></span></div>
    <div id="act" hidden aria-live="polite"><div id="actText"><p id="ins"></p><p id="cnt" hidden></p></div><div id="ctrl"></div></div>
  </div>
  <div class="ov" id="tcard" hidden><div class="panel"><p class="eyebrow" id="tEye"></p><h1 id="tTitle"></h1></div></div>
  <div class="ov" id="start">
    <div class="panel">
      <p class="eyebrow">A Dhanteras story · Ages 6 to 10</p>
      <h1>Dhanteras: The Ocean That Gave Us the Gift of Life</h1>
      <p>The Narrator tells the story aloud. When the picture asks for help, tap or drag. The camera is optional, and no microphone is used.</p>
      <div class="row"><button class="big" id="begin">Begin the adventure</button><button class="big alt" id="bResume" hidden>Continue</button></div>
    </div>
  </div>
  <div class="ov" id="end" hidden>
    <div class="panel">
      <h1>Happy Dhanteras, little Ocean Explorers!</h1>
      <div class="row"><button class="big" id="bAgain">Play again</button></div>
    </div>
  </div>
</div>

<script>
'use strict';
/* ===== Palette tokens: the only colours used anywhere in the illustration ===== */
const P={midnight:'#0E1240',indigo:'#262F85',sea:'#2C7CC4',turq:'#17B2AE',ivory:'#FFF4D9',foam:'#FFFFFF',verm:'#E03C1F',terra:'#C25E3A',coral:'#F2755E',
  pink:'#E45C9A',turmeric:'#F5B700',gold:'#C8962A',ochre:'#D58A2A',leaf:'#3F9B49',violet:'#5A2D82',mauve:'#86679F',ink:'#111111'};
const K=P.ink;
const TAU=Math.PI*2,DEG=Math.PI/180,clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,sm=t=>t*t*(3-2*t);

const $=id=>document.getElementById(id);
let RM=false;try{const mq=matchMedia('(prefers-reduced-motion: reduce)');RM=mq.matches;mq.addEventListener&&mq.addEventListener('change',e=>{RM=e.matches})}catch(e){}
/* ambient motion multiplier: calmer when the child prefers reduced motion */
const MV=()=>RM?.25:1;
const f1=v=>Math.round(v*10)/10,f3=v=>Math.round(v*1000)/1000;

/* ===== Storage: progress, badge petals and the Episode 7 choices only ===== */
const Store={k:'dhanteras.ocean.v1',data:{ep:1,petals:[0,0,0,0,0,0,0],choices:null,done:false},
  load(){try{const s=localStorage.getItem(this.k);if(!s)return;const d=JSON.parse(s);if(!d||typeof d!=='object')return;
    if(Number.isInteger(d.ep))this.data.ep=clamp(d.ep,1,8);if(Array.isArray(d.petals))this.data.petals=[0,1,2,3,4,5,6].map(i=>d.petals[i]?1:0);
    if(Array.isArray(d.choices))this.data.choices=d.choices.filter(c=>typeof c==='string').slice(0,6);if(d.done===true)this.data.done=true}catch(e){}},
  save(){try{localStorage.setItem(this.k,JSON.stringify(this.data))}catch(e){}},
  set(k,v){this.data[k]=v;this.save()}};

/* ===== SVG helpers ===== */
const NS='http://www.w3.org/2000/svg';
const svg=$('stage');
function el(tag,a,parent){const e=document.createElementNS(NS,tag);if(a)for(const k in a){const v=a[k];if(v!=null&&v!==false)e.setAttribute(k,v)}if(parent)parent.appendChild(e);return e}
function grp(parent,a){return el('g',a,parent)}
/* ghost ink: when on, every shape is drawn as a pale gold outline (peeking treasures, silhouettes) */
const INK={ghost:false,line:P.gold};
/* a filled shape with a bold black outline; fill may be a colour or a pattern url */
function shp(parent,d,fill,sw,a){a=Object.assign({d},a||{});if(INK.ghost){a.fill='none';a.stroke=INK.line;a['stroke-width']=Math.max(2.5,(sw==null?4:sw)*.8);a['stroke-linejoin']='round'}
  else{a.fill=fill||'none';if(sw!==0){a.stroke=a.stroke||K;a['stroke-width']=sw==null?4:sw;a['stroke-linejoin']='round';a['stroke-linecap']='round'}}return el('path',a,parent)}
function circ(parent,x,y,r,fill,sw,a){a=Object.assign({cx:f1(x),cy:f1(y),r:f1(Math.max(.1,r))},a||{});if(INK.ghost){a.fill='none';a.stroke=INK.line;a['stroke-width']=2.5}
  else{a.fill=fill||'none';if(sw!==0){a.stroke=a.stroke||K;a['stroke-width']=sw==null?3:sw}}return el('circle',a,parent)}
function ell(parent,x,y,rx,ry,fill,sw,a){a=Object.assign({cx:f1(x),cy:f1(y),rx:f1(rx),ry:f1(ry)},a||{});if(INK.ghost){a.fill='none';a.stroke=INK.line;a['stroke-width']=2.5}
  else{a.fill=fill||'none';if(sw!==0){a.stroke=a.stroke||K;a['stroke-width']=sw==null?3:sw}}return el('ellipse',a,parent)}
/* an unfilled stroke */
function ln(parent,d,col,w,a){a=Object.assign({d,fill:'none',stroke:INK.ghost?INK.line:col,'stroke-width':INK.ghost?Math.min(w,3):w,'stroke-linecap':'round','stroke-linejoin':'round'},a||{});return el('path',a,parent)}
/* thick limb: ink under, colour on top */
function limb(parent,d,col,w,a){ln(parent,d,K,w+7,a);return ln(parent,d,col,w,a)}
/* double-line contour for principal figures: thick outer line, thin inner line with a small gap */
function dbl(parent,d,fill,cx,cy,k,sw){const s=shp(parent,d,fill,sw==null?5:sw);if(!INK.ghost)ln(parent,d,K,1.8,{transform:`translate(${cx} ${cy}) scale(${k||.9}) translate(${-cx} ${-cy})`,opacity:.95});return s}
function pts(a,close){return a.map((p,i)=>(i?'L':'M')+f1(p[0])+' '+f1(p[1])).join('')+(close===false?'':'Z')}
/* smooth closed or open path through points (Catmull-Rom to cubic) */
function smooth(a,close){const n=a.length;if(n<2)return'';let d='M'+f1(a[0][0])+' '+f1(a[0][1]);const g=i=>close?a[(i+n)%n]:a[clamp(i,0,n-1)];
  const m=close?n:n-1;for(let i=0;i<m;i++){const p0=g(i-1),p1=g(i),p2=g(i+1),p3=g(i+2);
    d+=`C${f1(p1[0]+(p2[0]-p0[0])/6)} ${f1(p1[1]+(p2[1]-p0[1])/6)} ${f1(p2[0]-(p3[0]-p1[0])/6)} ${f1(p2[1]-(p3[1]-p1[1])/6)} ${f1(p2[0])} ${f1(p2[1])}`}return d+(close?'Z':'')}
function ellD(x,y,rx,ry){return`M${f1(x-rx)} ${f1(y)}A${f1(rx)} ${f1(ry)} 0 1 0 ${f1(x+rx)} ${f1(y)}A${f1(rx)} ${f1(ry)} 0 1 0 ${f1(x-rx)} ${f1(y)}Z`}
/* set a transform: translate, rotate (degrees), scale (sx may flip) */

/* continuous churning: the groups pull in turn, the rope slides back and forth, the mountain turns */
function churnMotor(s){const C=s.C;const m={speed:0,ph:0,base:C.flow,rbase:C.rot,amp:1,update(dt,t){if(this.speed<=0.001)return;this.ph+=dt*this.speed;const side=Math.floor(this.ph)%2?1:-1;
    const w=Math.sin(this.ph*Math.PI);C.flow=this.base+w*130*this.amp;C.rot=this.rbase+w*70*this.amp+this.ph*14;C.ringSpin+=dt*this.speed*.8;
    for(const f of C.devas)if(f.vis&&f.state==='pull'){f.tgt.lean=side<0?15:6}for(const f of C.asuras)if(f.vis&&f.state==='pull'){f.tgt.lean=side>0?15:6}
    if(this._side!==side){this._side=side;if(!AU.muted&&Math.random()<.6)AU.sfx(this.speed>1.2?'drum':'creak')}}};s.parts.push(m);s.motor=m;return m}

/* the central progress motif: twelve petals, one for each pull or churn */
function progressMotif(s){const g=grp(s.top);const pet=[];circ(g,0,0,64,P.indigo,4);
  for(let i=0;i<12;i++){const a=i*30;const pg=grp(g,{transform:`rotate(${a})`});const p=shp(pg,'M0 -26C-10 -38 -9 -54 0 -62C9 -54 10 -38 0 -26Z',P.ivory,3);pet.push(p)}
  const cen=grp(g);circ(cen,0,0,22,P.turmeric,3);circ(cen,0,0,12,'none',2.4,{stroke:K});circ(cen,0,0,4,P.verm,0);
  const o={n:0,on:0,set(n){this.n=n;pet.forEach((p,i)=>p.setAttribute('fill',i<n?(i%2?P.turmeric:P.verm):P.ivory))}};
  s.parts.push({update:t=>{const p=s.C.A.prog;tf(g,p[0],p[1],(L.portrait?1.25:1)*(.9+.1*o.on),o.n*2);op(g,o.on);cen.setAttribute('transform',`scale(${f3(1+.1*Math.sin(t*2)*(o.n>=12?1:0))})`)}});return o}

  else if(k===1){shp(g,'M-80 -10Q-60 -22 -40 -10T0 -10T40 -10T80 -10V80H-80Z',Pat.u('wave',P.foam,P.turq,.45),3);const f=fish(g,0);tf(f.g,-12,16,.5,-12);const f2=fish(g,2);tf(f2.g,26,-30,.38,10,-1,1)}
  else if(k===2){const kg=grp(g);kurma(kg);tf(kg,0,42,.2);const mg=grp(g);mandara(mg);tf(mg,0,20,.15);shp(g,'M-80 34Q-60 26 -40 34T0 34T40 34T80 34V80H-80Z',Pat.u('wave',P.foam,P.indigo,.4),2)}
  else if(k===3){const sc=grp(g,{transform:'scale(.17)'});const mg=grp(sc);mandara(mg);tf(mg,0,240,1);const b=grp(sc),f=grp(sc),h=grp(sc);const V=vasuki(b,f,h);sc.insertBefore(b,mg);op(h,0);
    const list=[];for(let i=0;i<=90;i++){const u=i/90,v=lerp(.12,.66,u),th=-Math.PI/2+u*2.5*TAU;const R=MANDARA.hw(v)+18;list.push([R*Math.sin(th),240-v*MANDARA.H+Math.cos(th)*16,Math.cos(th)])}V.draw(list,{})}
  else if(k===4){const d=new Deity('shiva',g,{pose:'shiva'});d.throat=1;d.x=0;d.y=150;d.s=.38;d.update(0,0)}
  else if(k===5){const a=airavata(g);tf(a.g,-6,40,.42);a.update(0)}
  else{const d=new Deity('dhanv',g,{pose:'kalash'});d.x=0;d.y=150;d.s=.38;d.update(0,0);const kk=kalash(g);const hl=d.handW(-1),hr=d.handW(1);kk.x=(hl[0]+hr[0])/2;kk.y=(hl[1]+hr[1])/2-8;kk.s=.19;kk.update(0)}
  return g}
async function shotC_1(){await titleCard(8,'A Little Light for Dhanteras');D.chip('Closing · A Little Light for Dhanteras');Music.mood('divine');D.setMood({rate:.94});
  const s=homeScene({id:'closing',sea:true,rays:1});s.nDiya=8;D.setScene(s,1300);const tok=D.token;
  /* the ring of seven medallions around the border */
  const meds=[0,1,2,3,4,5,6].map(i=>{const m=medallion(s.medL,66,{bg:i===4?P.violet:P.indigo});miniPic(m.pic,i);const dim=circ(m.pic,0,0,m.inner,P.midnight,0);return{m,dim,lit:0}});
  s.parts.push({update:t=>{const A=s.A;meds.forEach((o,i)=>{const p=A.med[i];tf(o.m.g,p[0],p[1],A.mr2/66*(1+.1*Math.sin(o.lit*Math.PI)));op(o.dim,.55*(1-o.lit))})}});
  /* the child may light diyas and sparkle flowers and leaves at any time */
  const lightDiya=i=>{const d=s.diyas[i];if(d.lit<.5){AU.sfx('diya');D.go(d,{lit:1},700,'out')}else{AU.sfx('sparkle');s.fx.burst(d.x,d.y-60,6,'spark',TAU)}};
  const next=()=>s.diyas.findIndex(d=>d.lit<.5);const cueDiya=()=>{const i=next();if(i>=0)lightDiya(i)};
  s.down=p=>{D.poke();const A=s.A;const i=A.diya.findIndex(q=>Math.hypot(p.x-q[0],p.y-(q[1]-30))<70);if(i>=0){lightDiya(i);return}
    if(A.gold.concat(A.herb).some(q=>Math.hypot(p.x-q[0],p.y-q[1])<80)||Math.hypot(p.x-A.ves[0],p.y-A.ves[1])<70){AU.sfx('sparkle');s.fx.burst(p.x,p.y,7,Math.random()<.5?'petal':'spark',TAU)}};
  s.hots=()=>s.A?s.diyas.map((d,i)=>({id:'diya'+i,label:d.lit>.5?'Glowing diya: tap to sparkle':'Diya: tap to light it',x:s.A.diya[i][0],y:s.A.diya[i][1]-30,r:56,on:()=>lightDiya(i)})):[];Hot.dirty=true;
  const lightMed=i=>{AU.sfx('chime');D.go(meds[i],{lit:1},900,'out')};
  await D.wait(700);
  await D.say('And now, dear Ocean Explorers, our great adventure has come to an end.');
  const recap=['Today, we travelled to the magnificent Ocean of Milk.','We helped awaken its waves.','We helped Kurma support the mighty mountain.','We pulled the great serpent rope and churned the ocean together.',
    'We witnessed Lord Shiva protect the universe from the terrible poison.','We discovered the extraordinary treasures hidden beneath the waves.','And finally, we welcomed Lord Dhanvantari, the divine physician, carrying the precious pot of amrit.'];
  for(let i=0;i<7;i++){lightMed(i);await D.say(recap[i])}
  await D.say('But the most important thing we discovered was not simply a treasure hidden beneath the ocean.');
  await D.say('It was a lesson we can carry in our hearts.');
  await D.say('True prosperity is not only about what we own.');
  await D.say('It is also about how we live, how we care for ourselves, and how we treat others.');
  await D.say('So, this Dhanteras, when you see a little diya glowing in your home, remember the great Ocean of Milk.',{cues:[['remember',cueDiya]]});
  await D.say('Remember the devas and asuras who worked together.',{cues:[['Remember',cueDiya]]});
  await D.say('Remember Lord Shiva, who protected creation.',{cues:[['Remember',cueDiya]]});
  await D.say('And remember Lord Dhanvantari, who appeared carrying the precious pot of amrit.',{cues:[['remember',cueDiya]]});
  /* blessings: the remaining diyas and the five symbols light; the child's chosen symbols glow brighter (the only callback) */
  Music.swell();const ch=Store.data.choices||[];const all=ch.includes('all (auto)');const isPick=k=>all||ch.includes(k);
  const sym=keys=>keys.forEach(k=>{const sy=s.syms.find(x=>x.key===k);D.go(sy,{k:isPick(k)?.25:0,glow:isPick(k)?1:.45},900);if(isPick(k))s.fx.burst(s.A.sym[SYMS.findIndex(x=>x.key===k)][0],s.A.sym[SYMS.findIndex(x=>x.key===k)][1],8,'spark',TAU);AU.sfx('chime')});
  await D.say('May your homes be filled with light.',{cues:[['May',()=>{cueDiya();sym(['gold'])}]]});
  await D.say('May your families be blessed with health and happiness.',{cues:[['May',()=>{cueDiya();sym(['health','family'])}]]});
  await D.say('May your hearts be filled with kindness.',{cues:[['May',()=>{cueDiya();sym(['kind'])}]]});
  await D.say("And may you always remember that one of life's greatest treasures is the gift of being able to care for one another.",{cues:[['may',()=>{cueDiya();sym(['wisdom'])}]]});
  s.diyas.forEach((d,i)=>{if(d.lit<.5)Timers.add(i*120,()=>lightDiya(i))});
  D.guard(tok);
  await D.say('Happy Dhanteras, little Ocean Explorers!',{cues:[['Happy',()=>{Badge.bloom();AU.sfx('success');D.go(s.kal,{glow:1.6},1200)}]]});
  Store.set('done',true);Store.set('ep',1);
  /* end card: the painting moves up so the kalash and Lord Dhanvantari stay uncovered */
  const end=$('end');end.hidden=false;await new Promise(r=>requestAnimationFrame(r));const pr=end.querySelector('.panel').getBoundingClientRect();D.trayPx=pr.height+18;D.go(D,{inset:1},900);
  D.chip('');await D.late();await new Promise(()=>{})}

/* ===== Main loop, shot list, start screen ===== */
const SHOTS=[['1.1','shot1_1'],['1.2','shot1_2'],['1.3','shot1_3'],['2.1','shot2_1'],['2.2','shot2_2'],['2.3','shot2_3'],['2.4','shot2_4'],
  ['3.1','shot3_1'],['3.2','shot3_2'],['4.1','shot4_1'],['4.2','shot4_2'],['4.3','shot4_3'],['5.1','shot5_1'],['5.2','shot5_2'],
  ['6.1','shot6_1'],['6.2','shot6_2'],['7.1','shot7_1'],['7.2','shot7_2'],['C.1','shotC_1']].filter(s=>typeof window[s[1]]==='function');
const epStart=ep=>Math.max(0,SHOTS.findIndex(s=>s[0].startsWith(ep>7?'C':String(ep)+'.')));
let lastT=performance.now(),hotT=0;
function frame(now){const dt=Math.min(.05,(now-lastT)/1000);lastT=now;T.sec+=dt*Math.min(D.speed,4);T.now+=dt*1000*D.speed;Tw.update();Timers.update();if(AU.ctx)Music.tick();
  const t=T.sec;try{if(D.old){D.old.update(dt,t);if(D.old._fade)op(D.old.root,D.old._fade.a)}if(D.scene)D.scene.update(dt,t)}catch(e){console.error(e)}
  const ins=D.insetRect();const tr=ins.s<1?`translate(${f1(ins.x)} ${f1(ins.y)}) scale(${f3(ins.s)})`:'';if(layers.scenes._tr!==tr){layers.scenes._tr=tr;tr?layers.scenes.setAttribute('transform',tr):layers.scenes.removeAttribute('transform')}
  if(now-hotT>250||Hot.dirty){hotT=now;Hot.dirty=false;Hot.sync()}
  requestAnimationFrame(frame)}
async function play(from){const tok=++D.token;Tw.kill();Timers.kill();Speech.stop();D.q=Promise.resolve();$('end').hidden=true;$('tray').hidden=true;$('tcard').hidden=true;D.inset=0;D.hideCap();D.clearAct();$('chant').hidden=true;
  try{for(let i=from;i<SHOTS.length;i++){if(D.qa)D.qa.cur=SHOTS[i][0];await window[SHOTS[i][1]]();D.guard(tok);
      if(D.qa&&D.qa.stop==='end'&&D.qa.at===SHOTS[i][0]){D.qa.paused=true;await new Promise(()=>{})}}}
  catch(e){if(e!==ABORT)console.error(e)}}
function begin(fromEp){$('start').hidden=true;AU.init();AU.resume();Speech.init();$('badge').hidden=fromEp<=1;
  if(fromEp>1){D.resumed=true;D.resumedAt=fromEp;D.replay=false}else{D.replay=!!Store.data.done||Store.data.ep>1;D.resumed=false;Store.data.petals=[0,0,0,0,0,0,0];Store.data.choices=null;Store.data.ep=1;Store.save();Badge.bloomK=0;Badge.render()}
  play(epStart(fromEp||1))}

$('bAgain').addEventListener('click',()=>{$('end').hidden=true;begin(1)});

Speech.init();requestAnimationFrame(frame);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>Hot.dirty=true);
/* QA hook (#qa): window.__qa.go('2.4','act'|'late'|'end') fast-forwards to a point in a shot */
if(/qa/.test(location.hash)){window.__qa={go(at,stop,o){o=o||{};D.fast=!o.live;D.speed=D.fast?40:1;D.qa={at,stop:stop||'end',paused:false,cur:null,acts:!!o.acts};$('start').hidden=true;AU.init();$('badge').hidden=false;
  if(o.choices)Store.data.choices=o.choices;const i=Math.max(0,SHOTS.findIndex(s=>s[0]===at));play(o.from?i:0);return true},
  paused:()=>D.qa&&D.qa.paused,slow(){D.speed=1;D.fast=false},fast(){D.speed=40;D.fast=true},resume(){D.qa.resume&&D.qa.resume()},shots:()=>SHOTS.map(s=>s[0])}}
