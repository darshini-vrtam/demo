<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Ocean That Gave Us the Gift of Life</title>
<meta name="description" content="Dhanteras: The Ocean That Gave Us the Gift of Life. An interactive Madhubani-inspired Dhanteras story in two episodes for children aged 6 to 10.">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Noto+Serif+Devanagari:wght@500;700&family=Yatra+One&display=swap">
<style>
/* Layout: one painted SVG stage on top; a quiet dock below it holds narration, chant cards, instructions and controls. */
:root{
  --midnight:#0E1240; --indigo:#262F85; --sea:#2C7CC4; --turq:#17B2AE; --ivory:#FFF4D9; --verm:#E03C1F; --turmeric:#F5B700; --gold:#C8962A; --leaf:#3F9B49; --ink:#111111;
  --bg:#FFF4D9; --fg:#111111; --panel:#FFF4D9; --panel-fg:#111111; --line:#111111; --hint:#E03C1F; --pill:#262F85; --pill-fg:#FFF4D9; --focus:#262F85;
  --chant:#F5B700; --chant-fg:#111111;
  --font-display:"Yatra One","Kohinoor Devanagari","Palatino Linotype",Georgia,serif;
  --font-body:"Baloo 2","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  --font-deva:"Noto Serif Devanagari","Kohinoor Devanagari","Nirmala UI","Mangal","Devanagari Sangam MN",serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#111111; --fg:#FFF4D9; --panel:#0E1240; --panel-fg:#FFF4D9; --line:#F5B700; --hint:#F5B700; --pill:#FFF4D9; --pill-fg:#0E1240; --focus:#F5B700; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#111111; --fg:#FFF4D9; --panel:#0E1240; --panel-fg:#FFF4D9; --line:#F5B700; --hint:#F5B700; --pill:#FFF4D9; --pill-fg:#0E1240; --focus:#F5B700; color-scheme:dark }
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:max(10px,env(safe-area-inset-top,0px));padding-bottom:max(10px,env(safe-area-inset-bottom,0px))}
#app{position:relative;width:100%;height:100%;overflow:hidden;border-radius:14px;background:var(--midnight);border:3px solid var(--line);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;--dk:120px;--bd:24px;--ha:600px}
#stage{position:absolute;left:0;top:0;width:100%;height:100%;display:block;touch-action:none;overflow:hidden}
[hidden]{display:none!important}
button{font-family:var(--font-body)}
button:focus-visible{outline:4px solid var(--focus);outline-offset:3px}
/* real buttons laid over the painting for keyboard and screen readers; the painting draws the highlight */
#hot{position:absolute;inset:0;pointer-events:none;z-index:3}
.hs{position:absolute;left:0;top:0;pointer-events:none;background:transparent;border:0;padding:0;margin:0;opacity:0}
.hs:focus-visible{opacity:1;outline:none;box-shadow:0 0 0 4px var(--ivory),0 0 0 8px var(--ink);border-radius:50%}
#hud{position:absolute;top:calc(var(--bd) + 8px);right:calc(var(--bd) + 8px);display:flex;gap:8px;z-index:6}
.hb{width:46px;height:46px;border-radius:50%;border:3px solid var(--ink);background:var(--ivory);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
.hb svg{width:24px;height:24px}
.hb[aria-pressed="true"]{background:var(--turmeric)}
.hb:focus-visible{outline:none;box-shadow:0 0 0 4px var(--turmeric),0 0 0 7px var(--ink)}
#badge{position:absolute;top:calc(var(--bd) + 4px);left:calc(var(--bd) + 4px);z-index:6;width:58px;height:58px;border-radius:50%;background:var(--ivory);border:3px solid var(--ink);
  display:grid;place-items:center;padding:0}
#badge svg{width:50px;height:50px;overflow:visible}
#chip{position:absolute;top:calc(var(--bd) + 14px);left:calc(var(--bd) + 10px);z-index:6;font:700 13px/1.1 var(--font-body);letter-spacing:.06em;text-transform:uppercase;
  background:var(--ivory);color:var(--ink);border:2.5px solid var(--ink);border-radius:999px;padding:8px 12px;max-width:calc(100% - var(--bd)*2 - 330px);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:700px){ #chip{display:none} .hb{width:40px;height:40px} .hb svg{width:21px;height:21px} #hud{gap:6px} #badge{width:50px;height:50px} #badge svg{width:42px;height:42px} }
/* dock: narration captions, chant cards and activity controls */
#dock{position:absolute;left:0;right:0;bottom:0;height:var(--dk);z-index:5;background:var(--panel);color:var(--panel-fg);border-top:4px solid var(--line);
  display:flex;flex-direction:column;justify-content:center;gap:6px;padding:6px clamp(12px,3vw,40px);overflow:hidden;
  --fs:clamp(14px,min(calc(var(--dk) * .135),calc(1.5vw + 9px)),27px)}
#cap{max-width:1100px;width:100%;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:2px}
#capWho{display:inline-flex;align-items:center;gap:6px;font:800 calc(var(--fs) * .56)/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;opacity:.9}
#capWho i{width:.95em;height:.95em;border-radius:50%;display:inline-block;border:2px solid var(--ink)}
#capText{margin:0;font-size:var(--fs);line-height:1.36;font-weight:600;text-wrap:pretty;text-align:center}
#cap.off #capText{display:none}
#act{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px 18px;max-width:1200px;width:100%;margin:0 auto}
#actText{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1 1 260px;align-items:center;text-align:center}
#ins{margin:0;font-size:var(--fs);line-height:1.3;font-weight:700;text-wrap:balance;display:flex;align-items:center;gap:.4em;justify-content:center}
#ins svg{width:1.6em;height:1.6em;flex:none}
#ins.hint{color:var(--hint)}
#cnt{margin:0;font:700 calc(var(--fs) * .78)/1.2 var(--font-body);letter-spacing:.03em;background:var(--pill);color:var(--pill-fg);border-radius:999px;padding:3px 14px;font-variant-numeric:tabular-nums}
#ctrl{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
#ctrl:empty{display:none}
.big{font:800 clamp(16px,calc(var(--fs) * .92),22px)/1 var(--font-body);min-height:50px;padding:10px 24px;border-radius:999px;border:3px solid var(--ink);background:var(--turmeric);color:var(--ink);cursor:pointer;
  box-shadow:0 4px 0 var(--ink);transition:transform .15s ease}
.big.alt{background:var(--ivory)}
.big:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.big:disabled{opacity:.45;cursor:default;box-shadow:none}
.lotusbtn{display:inline-flex;align-items:center;gap:8px}
.lotusbtn svg{width:30px;height:24px}
/* chant card: the line the child says aloud, word by word */
#chant{max-width:1100px;width:100%;margin:0 auto;display:flex;align-items:center;justify-content:center;gap:14px;cursor:pointer;background:var(--chant);color:var(--chant-fg);
  border:3px solid var(--ink);border-radius:18px;padding:6px 16px;min-height:calc(var(--dk) - 26px)}
#chant .who{font:800 calc(var(--fs) * .5)/1.1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;writing-mode:horizontal-tb}
#chantText{margin:0;font:400 calc(var(--fs) * 1.32)/1.18 var(--font-display);text-align:center;text-wrap:balance}
#chantText span{border-radius:10px;padding:0 .12em;transition:background .25s ease,color .25s ease}
#chantText span.on{background:var(--ink);color:var(--turmeric)}
#chantText span.done{text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:5px}
#chant .go{flex:none;width:44px;height:44px;border-radius:50%;border:3px solid var(--ink);background:var(--ivory);display:grid;place-items:center}
#chant .go svg{width:20px;height:20px}
/* picture cards for the treasure pot */
.tray{position:absolute;left:0;right:0;bottom:var(--dk);z-index:5;display:grid;justify-content:center;gap:clamp(6px,1.4vw,18px);padding:10px clamp(8px,2.4vw,26px);
  background:var(--panel);border-top:4px solid var(--line);grid-template-columns:repeat(5,minmax(0,200px))}
@media (max-width:700px){.tray.n2{grid-template-columns:repeat(2,minmax(0,1fr))} .tray.n2 .card svg{max-height:14vh} .tray:not(.n2){grid-template-columns:repeat(3,minmax(0,1fr));padding:6px 6px;gap:5px} .card{padding:3px 3px 5px;border-radius:14px} .card svg{max-height:7.5vh} .card small{font-size:11px;line-height:1.1}}
.card{min-width:0;background:var(--ivory);color:var(--ink);border:3.5px solid var(--ink);border-radius:18px;padding:6px 6px 8px;cursor:pointer;display:flex;flex-direction:column;gap:2px;
  transition:transform .2s ease,box-shadow .2s ease;position:relative;align-items:center}
.card svg{width:100%;aspect-ratio:5/3.6;max-height:15vh;display:block}
.card b{font:800 clamp(12px,.8vw + .6vh + 4px,18px)/1.1 var(--font-body);text-align:center;letter-spacing:.04em}
.card small{font:600 clamp(11px,.6vw + .5vh + 3px,15px)/1.15 var(--font-body);text-align:center;text-wrap:balance}
.tray.n2{grid-template-columns:repeat(2,minmax(0,330px))}
/* decision cards float over the dimmed painting instead of taking their own band */
.tray.over{top:0;bottom:var(--dk);background:transparent;border-top:0;align-content:center;padding:calc(var(--bd) + 56px) clamp(10px,3vw,40px) calc(var(--bd) + 10px)}
.tray.over .card{box-shadow:0 0 0 5px var(--turmeric),0 0 0 8px var(--ink)}
.tray.over .card[aria-pressed="true"]{box-shadow:0 0 0 6px var(--ivory),0 0 0 10px var(--verm)}
.tray.n2 .card svg{aspect-ratio:5/3.2;max-height:22vh}
.tray.n2 .card b{font-size:clamp(14px,1vw + .8vh + 6px,22px);letter-spacing:.01em}
.card[aria-pressed="true"]{transform:translateY(-4px);box-shadow:0 0 0 5px var(--turmeric),0 0 0 8px var(--ink)}
.card[aria-pressed="true"]::after{content:"";position:absolute;top:-10px;right:-10px;width:28px;height:28px;border-radius:50%;background:var(--leaf);border:3px solid var(--ink);
  background-image:radial-gradient(circle,var(--ivory) 0 4px,transparent 5px)}
.card.reading{box-shadow:0 0 0 4px var(--ivory),0 0 0 7px var(--verm)}
.card:focus-visible{outline:none;box-shadow:0 0 0 5px var(--ivory),0 0 0 9px var(--focus)}
.pulse{animation:pulse 1.3s ease-in-out 3}
@keyframes pulse{50%{transform:translateY(-6px) scale(1.04)}}
/* shloka panel: live Devanagari text laid over the quiet left-middle of the painting */
#shloka{position:absolute;z-index:4;background:var(--ivory);color:var(--ink);border:4px solid var(--ink);border-radius:22px;box-shadow:0 0 0 6px var(--turmeric),0 0 0 9px var(--ink);
  display:flex;flex-direction:column;gap:clamp(6px,1.2vh,14px);padding:clamp(10px,1.6vh,20px) clamp(12px,1.8vw,26px);overflow:hidden}
#shloka h2{margin:0;font:800 clamp(12px,.8vw + .6vh + 4px,18px)/1.1 var(--font-body);letter-spacing:.14em;text-transform:uppercase;color:var(--verm);text-align:center}
#shlokaText{margin:0;font:700 clamp(17px,1.25vw + 1.1vh + 6px,34px)/1.55 var(--font-deva);text-align:center;text-wrap:balance}
#shlokaText .ln{display:block}
#shlokaText span{border-radius:8px;padding:0 .08em;transition:background .25s ease,color .25s ease}
#shlokaText span.on{background:var(--ink);color:var(--turmeric)}
#meaning{border-top:3px dotted var(--gold);padding-top:clamp(6px,1vh,12px);display:flex;flex-direction:column;gap:4px}
#meaning h3{margin:0;font:800 clamp(11px,.6vw + .6vh + 4px,16px)/1.1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--leaf);text-align:center}
#meaning p{margin:0;font:600 clamp(14px,.8vw + .8vh + 5px,22px)/1.35 var(--font-body);text-align:center;text-wrap:pretty}
.namaste{display:inline-flex;align-items:center;gap:10px}
.namaste svg{width:34px;height:34px}
/* dev timing overlay (press T) */
#dev{position:absolute;top:calc(var(--bd) + 64px);left:calc(var(--bd) + 8px);z-index:9;background:#111111;color:#FFF4D9;font:600 12px/1.35 ui-monospace,Menlo,Consolas,monospace;
  border:2px solid #F5B700;border-radius:10px;padding:8px 10px;max-height:70%;overflow:auto;font-variant-numeric:tabular-nums;white-space:pre}
/* overlays: start card, episode title cards, end card */
.ov{position:absolute;left:0;right:0;top:0;bottom:0;z-index:8;display:grid;place-items:center;padding:calc(var(--bd) + 14px)}
.panel{background:var(--ivory);color:var(--ink);border:4px solid var(--ink);border-radius:24px;padding:20px 26px;max-width:620px;width:100%;
  text-align:center;display:flex;flex-direction:column;gap:12px;box-shadow:0 0 0 7px var(--turmeric),0 0 0 11px var(--ink)}
.panel h1{font:400 clamp(26px,3.2vw + 1vh,48px)/1.12 var(--font-display);margin:0;text-wrap:balance}
.panel .eyebrow{font:800 13px/1.2 var(--font-body);letter-spacing:.14em;text-transform:uppercase;margin:0;color:var(--verm)}
.panel p{margin:0;font-size:16px;line-height:1.45}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
#begin{font-size:clamp(20px,2vw + 8px,28px);min-height:64px;padding:14px 34px}
#tcard{pointer-events:none;bottom:var(--dk)}
#tcard .panel{max-width:760px;background:transparent;border:0;box-shadow:none;color:var(--ivory)}
#tcard .eyebrow{color:var(--turmeric);font-size:clamp(14px,1.2vw + 6px,22px)}
#tcard h1{font-size:clamp(28px,3.6vw + 1.4vh,64px);color:var(--ivory);text-shadow:0 3px 0 var(--ink),3px 0 0 var(--ink),-3px 0 0 var(--ink),0 -3px 0 var(--ink)}
#end{bottom:var(--dk);place-items:end center;pointer-events:none}
#end .panel{pointer-events:auto;max-width:320px;padding:10px 16px;gap:8px}
#end h1{font-size:clamp(20px,2.2vw + 1vh,36px)}
@media (max-width:700px){#end .panel{padding:8px 12px;gap:6px;box-shadow:0 0 0 4px var(--turmeric),0 0 0 7px var(--ink)} #end .big{min-height:44px;padding:8px 20px}}
@media (prefers-reduced-motion: reduce){.card,.big,#chantText span{transition:none}.pulse{animation:none;outline:4px dashed var(--turmeric);outline-offset:3px}}
</style>
</head>
<body>
<div id="app">
  <svg id="stage" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Story picture. Tap or drag when the picture asks for help."></svg>
  <div id="hot"></div>
  <div id="chip" hidden></div>
  <div id="hud">
    <button class="hb" id="bCC" aria-pressed="true" title="Read-along captions" aria-label="Read-along captions">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10.5 10.2a2.3 2.3 0 1 0 0 3.6M17 10.2a2.3 2.3 0 1 0 0 3.6"/></svg></button>
    <button class="hb" id="bCam" aria-pressed="false" title="Camera magic (optional)" aria-label="Camera magic, optional">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></button>
    <button class="hb" id="bMute" aria-pressed="false" title="Mute" aria-label="Mute sound">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path id="mWave" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11"/><path id="mX" d="M16 9l5 6M21 9l-5 6" style="display:none"/></svg></button>
    <button class="hb" id="bSkip" title="Skip" aria-label="Skip this line">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5l9 7-9 7z"/><path d="M18 5v14"/></svg></button>
  </div>
  <div id="tray" class="tray" hidden></div>
  <div id="dock">
    <div id="cap" hidden aria-live="polite"><span id="capWho"><i></i><b></b></span><p id="capText"></p></div>
    <div id="chant" hidden role="button" tabindex="0" aria-label="Read-along chant. Tap to continue.">
      <span class="who" id="chantWho">Say it together</span><p id="chantText"></p>
      <span class="go" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 5l11 7-11 7z"/></svg></span></div>
    <div id="act" hidden aria-live="polite"><div id="actText"><p id="ins"></p><p id="cnt" hidden></p></div><div id="ctrl"></div></div>
  </div>
  <div id="shloka" hidden aria-live="polite"><h2>Dhanvantari Shloka</h2><p id="shlokaText" lang="sa"></p>
    <div id="meaning" hidden><h3>Simple meaning for children</h3><p id="meaningText"></p></div></div>
  <div id="dev" hidden></div>
  <div class="ov" id="tcard" hidden><div class="panel"><p class="eyebrow" id="tEye"></p><h1 id="tTitle"></h1></div></div>
  <div class="ov" id="start">
    <div class="panel">
      <p class="eyebrow">A Dhanteras story in two episodes · Ages 6 to 10</p>
      <h1>DHANTERAS: THE OCEAN THAT GAVE US THE GIFT OF LIFE</h1>
      <p>The Narrator tells the story aloud. When the picture asks for help, tap or drag. The camera is optional, and no microphone is used.</p>
      <div class="row"><button class="big" id="begin">Begin the adventure</button><button class="big alt" id="bResume" hidden>Continue</button></div>
    </div>
  </div>
  <div class="ov" id="end" hidden>
    <div class="panel">
      <div class="row"><button class="big" id="bAgain">Play again</button></div>
    </div>
  </div>
</div>
