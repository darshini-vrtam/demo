// ───────────────────────── Shared composition: the tiered wall ─────────────────────────
function LY() {
  const W = V.W, H = V.H, p = V.p;
  return { W, H, p, cx: W / 2, sky: p ? Math.round(H * 0.15) : 232, floor: p ? Math.round(H * 0.74) : 846, rows: p ? [Math.round(H * 0.74) + 250, H - 80] : [H - 64] };
}
// upper register: sun, moon, stars, birds
function skyReg(g, L, t, p, kind = 'day', o = {}) {
  if (p <= 0) return;
  const y = L.sky / 2 + 12;
  if (kind === 'day' || kind === 'sunset' || kind === 'dawn') {
    const sx = L.W * (L.p ? 0.8 : 0.87), sy = y + (kind === 'sunset' ? 34 : kind === 'dawn' ? 20 : 0);
    sun(g, sx, sy, L.p ? 92 : 74, t, partP(p, 0, 3));
    if (kind !== 'dawn') moon(g, L.W * (L.p ? 0.17 : 0.11), y, L.p ? 44 : 38, 0.62, partP(p, 1, 3));
  } else if (kind === 'night') {
    moon(g, L.W * (L.p ? 0.8 : 0.86), y, L.p ? 62 : 54, 1, partP(p, 0, 3), PAL.wall);
  }
  const n = L.p ? 5 : 9, x0 = L.W * (L.p ? 0.3 : 0.21), x1 = L.W * (L.p ? 0.66 : 0.77);
  for (let i = 0; i < n; i++) {
    const x = lerp(x0, x1, i / (n - 1)), pp = partP(p, i, n, 3), yy = y + Math.sin(t * 1.2 + i) * 6;
    if (kind === 'night') star(g, x, yy + (i % 2) * 24 - 12, 18 + (i % 3) * 5, pp, i % 2 ? PAL.yellow : PAL.wall, t * 0.2 + i);
    else if (i % 3 === 1) bird(g, x, yy + 34, 0.5, [PAL.indigo, PAL.red, PAL.green][i % 3], pp, i % 2 === 0);
    else if (i % 3 === 0) star(g, x, yy, 16, pp, PAL.yellow, i);
    else marigold(g, x, yy, 18, pp, i % 2 ? PAL.orange : PAL.yellow);
  }
  regBand(g, 40, L.W - 40, L.sky, p, 1);
}
// a ground-line row of small repeated figures
function figureRow(g, L, t, p, kinds, y, x0 = 70, x1 = L.W - 70, sc = 1) {
  const n = kinds.length, sp = (x1 - x0) / n;
  for (let i = 0; i < n; i++) {
    const k = kinds[i], x = x0 + sp * (i + 0.5), pp = partP(p, i, n, 3), bob = Math.sin(t * 2 + i * 1.7) * 2;
    const [type, col] = k.split(':');
    if (type === 'h') rowHorse(g, x, y + bob * 0.5, 0.27 * sc, col || 'terra', pp, i % 4 === 3);
    else if (type === 'e') elephant(g, x, y, 0.44 * sc, col || 'ochre', pp, i % 4 === 3);
    else if (type === 'p') person(g, x, y + bob * 0.4, 0.6 * sc, col ? PAL[col] : PAL.red, pp, i, false);
    else if (type === 'pl') person(g, x, y + bob * 0.4, 0.6 * sc, col ? PAL[col] : PAL.red, pp, i, true);
    else if (type === 't') tree(g, x, y, 0.38 * sc, pp, i % 3);
    else if (type === 'm') { marigold(g, x - 18 * sc, y - 22 * sc, 18 * sc, pp); marigold(g, x + 18 * sc, y - 22 * sc, 18 * sc, pp, PAL.yellow); marigold(g, x, y - 52 * sc, 18 * sc, pp, PAL.orange); }
    else if (type === 'b') bird(g, x, y - 10, 0.6 * sc, col ? PAL[col] : PAL.indigo, pp, i % 2 === 0);
    else if (type === 'd') diya(g, x - 10, y - 10, 0.55 * sc, t, i, { p: pp, lit: !!col });
  }
  regBand(g, 40, L.W - 40, y + 14, p, 0);
}
function bottomReg(g, L, t, p, kinds, kinds2) {
  figureRow(g, L, t, p, kinds, L.rows[0]);
  if (L.p && L.rows[1]) figureRow(g, L, t, partP(p, 1, 2), kinds2 || kinds.slice().reverse(), L.rows[1]);
}
function floorLine(g, L, p) { regBand(g, 40, L.W - 40, L.floor + 12, p, 2); }
function longShadow(g, x, y, w, len, a, dir = 1) {
  if (a <= 0) return;
  g.save(); g.globalAlpha = a; g.fillStyle = PAL.char;
  g.beginPath(); g.moveTo(x - w / 2, y); g.quadraticCurveTo(x + dir * len * 0.5, y + 8, x + dir * len, y + 22); g.lineTo(x + dir * len, y + 34); g.quadraticCurveTo(x + dir * len * 0.4, y + 26, x + w / 2, y + 2); g.closePath(); g.fill();
  g.restore();
}
// glow wash that brightens the painting as lamps are added
function ambientGlow(g, L, x, y, r, a) {

  g.save(); g.globalCompositeOperation = 'lighter';
  const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, rgba(PAL.glow, 0.32 * a)); gr.addColorStop(1, rgba(PAL.glow, 0));

// wind: flowing dotted wave and swirl lines
function windLines(g, L, t, strength, dir = 1, y0 = 0, y1 = L.H, n = 7, angle = 0) {
  if (strength <= 0) return;

  for (let i = 0; i < n; i++) {
    const yy = lerp(y0, y1, (i + 0.5) / n), ph = (t * 0.55 * strength + i * 0.37) % 1, cx = dir > 0 ? lerp(-300, L.W + 300, ph) : lerp(L.W + 300, -300, ph);

    g.fillStyle = col; g.strokeStyle = col; g.lineWidth = 6;
    for (let k = 0; k < 14; k++) { const x = cx - dir * k * len / 14, y = yy + Math.sin(k * 0.8 + t * 3 + i) * 18 + (x - L.W / 2) * Math.tan(angle); g.beginPath(); g.arc(x, y, 5.5 - k * 0.25, 0, TAU); g.fill(); }
    // curl at the head
    const hx = cx, hy = yy + Math.sin(t * 3 + i) * 18 + (hx - L.W / 2) * Math.tan(angle);
    g.beginPath(); for (let a = 0; a < 5.2; a += 0.25) { const r = 34 - a * 5.6; g.lineTo(hx + dir * Math.cos(a) * r, hy - Math.sin(a) * r); } g.stroke();
  }

}
function swirl(g, x, y, r, t, a = 1) {
  if (a <= 0) return;
  g.save(); g.globalAlpha = a; g.lineCap = 'round';
  for (let k = 0; k < 3; k++) {

  }
  dotRing(g, x, y, r * 1.12, 14, 5, [PAL.wall, PAL.yellow], 1);
  g.restore();
}

    await D.line(C('c5') === 'a' ? 's11cbC' : 's11cbD', { shot: { name: 'morning', cam: () => { const L = LY(); return { x: V.p ? 860 : L.cx + 480, y: L.floor - 260, z: V.p ? 1.6 : 1.9 }; } } });
    await D.line('s11h', { shot: { name: 'morning', cam: null } });
    await D.line('s11i', { shot: { name: 'morning', cam: () => ({ x: V.W / 2, y: V.H * 0.3, z: 1.3 }) } });
    await D.line('s11j', { shot: { name: 'morning', cam: () => ({ x: V.W / 2, y: V.H * 0.5, z: 1.05 }) } });
    // the persistent Panch Deep shelf: the first lamp lights
    G.shelf[0] = true; saveStore();
    D.shot({ name: 'shelf', cam: null }); await D.wait(1.2);
    music.swell(8);
    await D.line('s11k');
    await D.wait(1.6);
  },
  draw(g, st, S) {
    const L = LY(), t = CLK.t;
    if (S.shot === 'shelf') {
      const p = ap('shot:shelf', 1.6);
      skyReg(g, L, t, p, 'day');
      const w = L.p ? 900 : 1100, y = L.p ? L.H * 0.62 : 760;
      const lit = G.shelf.slice(); lit[0] = has('shelfLit');
      shelf(g, L.cx, y, w, t, lit, p, 0, since('shelfLit'));
      if (has('shelfLit')) { ambientGlow(g, L, L.cx - w / 2 + w / 10, y - 120, 360, clamp(since('shelfLit') / 1.2)); for (let i = 0; i < 8; i++) { const a = i / 8 * TAU + t, r = 120 + 30 * Math.sin(t * 2 + i); star(g, L.cx - w / 2 + w / 10 + Math.cos(a) * r, y - 120 + Math.sin(a) * r * 0.7, 14, clamp(since('shelfLit') / 0.8), PAL.glow, a); } }
      chiku(g, L.p ? 830 : L.cx + w / 2 + 140, L.p ? L.H * 0.9 : L.floor + 150, L.p ? 0.9 : 0.8, t, { arm: 'up', expr: 'cheer', look: -1 });
      return;
    }
    // big dotted sun in the top register
    regBand(g, 40, L.W - 40, L.sky, 1, 1);
    sun(g, L.cx, L.sky / 2 + 14, L.p ? 120 : 92, t, ap('sun', 2) || ap('shot:morning', 2.2));
    for (let i = 0; i < (L.p ? 4 : 8); i++) { const x = L.cx + (i < (L.p ? 2 : 4) ? -1 : 1) * (220 + (i % (L.p ? 2 : 4)) * (L.p ? 150 : 180)); bird(g, x, L.sky / 2 + 40, 0.5, [PAL.indigo, PAL.red, PAL.green][i % 3], ap('shot:morning', 2, 0.5), x > L.cx); }
    palace(g, L.cx, L.floor, L.p ? 960 : 1200, L.p ? Math.round(L.H * 0.38) : 470, t, 1, 0.2, { rows: 1 });
    door(g, L.cx, L.floor, L.p ? 1.1 : 1.15, t, 1, 0.55, PAL.glow);
    const crow = has('crow') ? clamp(1 - Math.abs(since('crow') - 0.6) / 0.8) : 0;
    rooster(g, L.cx - (L.p ? 360 : 520), L.floor - (L.p ? Math.round(L.H * 0.38) : 470) - 30, L.p ? 1.0 : 0.9, t, Math.max(ap('rooster', 1.2), has('crow') && since('crow') > 3 ? 1 : 0), crow);
    floorLine(g, L, 1);
    bottomReg(g, L, t, 1, L.p ? ['pl:red', 'h:bijli', 'pl:green', 'e:pink', 'pl:indigo'] : ['pl:red', 'h:terra', 'pl:green', 'e:pink', 'pl:indigo', 'h:yellow', 'pl:orange', 'e:ochre', 'pl:turq', 'h:green']);
    const bow = ease(ap('bow', 1.2)) * (since('bow') < 4 ? 1 : clamp(1 - (since('bow') - 4) / 1.2));
    yama(g, L.cx + (L.p ? 0 : 150), L.floor, L.p ? 0.92 : 0.95, t, { stern: 0, bow: -bow, flip: !L.p });
    kesar(g, L.p ? 230 : L.cx - 420, L.floor, L.p ? 0.95 : 1.0, t, { arm: 'namaste', expr: 'smile' });
    chiku(g, L.p ? 860 : L.cx + 480, L.floor, L.p ? 0.85 : 0.95, t, { arm: C('c5') === 'a' ? 'cup' : 'up', expr: 'cheer', look: -1, flip: true });
    bijli(g, L.p ? 900 : L.cx + 730, L.floor, L.p ? 0.46 : 0.78, t, { flip: true });
  },
};

// ── End card ────────────────────────────────────────────────────────────────
const SEND = {
  id: 'end', mood: 'shared', firstShot: 'card', noPush: true,
  async run(D, S) { D.cue('card'); music.swell(10); sfx('chime'); await D.wait(0.8); await D.line('end1'); await D.wait(4); },
  draw(g, st, S) {
    const L = LY(), p = ap('card', 3), cx = L.cx, cy = L.p ? L.H * 0.3 : 330, R = L.p ? 300 : 210;
    horseRing(g, cx, cy, R, CLK.t, p, 'sun');
    titleText(g, 'Event 1 of Panch Deep complete.', cx, L.p ? L.H * 0.54 : 640, L.p ? 70 : 72, L.W - 160, ap('card', 1, 0.8), PAL.char);
    shelf(g, cx, L.p ? L.H * 0.84 : 940, L.p ? 840 : 900, CLK.t, G.shelf, ap('card', 2, 1.2));
  },
};

SEQ.push(cardScene('t3', 3, 'The Night of Stories', ['ep3'], 'prev3', 'sun'), S8, S9, S10, S11, SEND);

// ───────────────────────── Boot ─────────────────────────
const startEl = document.getElementById('start'), hud = document.getElementById('hud');
const PREVIEW = { sc: SEQ[0] };
function showStartButtons() {
  startEl.innerHTML = '';
  const add = (label, cls, fn) => { const b = document.createElement('button'); b.className = 'big' + (cls ? ' ' + cls : ''); b.textContent = label; b.addEventListener('click', fn); startEl.appendChild(b); return b; };
  const prev = STORED.choices, done = STORED.shelf[0];
  add(done ? 'Play the story again' : 'Begin the story', '', () => begin(0, false));
  const ep3 = SEQ.findIndex(s => s.id === 't3'), ep2 = SEQ.findIndex(s => s.id === 't2');
  if (!done && prev.c4 && ep3 > 0) add('Continue: Episode 3', 'alt', () => begin(ep3, true));
  else if (!done && prev.c3 && ep2 > 0) add('Continue: Episode 2', 'alt', () => begin(ep2, true));
}
function showReplay() {
  startEl.hidden = false; startEl.innerHTML = '';
  const b = document.createElement('button'); b.className = 'big'; b.textContent = 'Play again'; b.addEventListener('click', () => { G.replay = true; begin(0, false); }); startEl.appendChild(b);
}
function begin(idx, resume) {
  audioInit(); if (VOICE.has && !VOICE.list.length) pickVoices();
  try { if (VOICE.has) { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); } } catch (e) { }
  try { if (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === 'function') DeviceOrientationEvent.requestPermission().catch(() => { }); } catch (e) { }
  G.resumed = !!resume; G.started = true; G.finished = false;
  if (resume) G.choices = Object.assign({}, STORED.choices);
  else { G.choices = {}; saveStore(); }
  startEl.hidden = true; hud.hidden = false;
  runFrom(idx);
}
// controls
const bMute = document.getElementById('bMute');
function syncMute() { bMute.setAttribute('aria-pressed', AU.muted ? 'true' : 'false'); bMute.setAttribute('aria-label', AU.muted ? 'Turn sound on' : 'Mute sound'); document.getElementById('mWave').style.display = AU.muted ? 'none' : ''; document.getElementById('mX').style.display = AU.muted ? '' : 'none'; }
bMute.addEventListener('click', () => { setMuted(!AU.muted); syncMute(); });
document.getElementById('bSkip').addEventListener('click', () => skipScene());
document.getElementById('bCam').addEventListener('click', () => { if (CAMIN.status === 'on') camStop(); else camStart(); });
window.addEventListener('keydown', e => {
  if (e.key === 'm' || e.key === 'M') { setMuted(!AU.muted); syncMute(); }
  else if (e.key === 'ArrowRight' && G.started) skipScene();
  else if ((e.key === '1' || e.key === '2') && CH.on && CH.res) CH.res(+e.key - 1);
});
window.addEventListener('resize', () => { resize(); S2L = null; });
resize();
// start screen: the title card paints itself behind the Begin button
D.S = newState(SEQ[0]); D.shot('card'); D.cue('card');
showStartButtons();
const startFont = () => { requestAnimationFrame(frame); };
if (document.fonts && document.fonts.load) Promise.race([document.fonts.load(`800 62px "Baloo 2"`), new Promise(r => setTimeout(r, 1500))]).then(startFont, startFont); else startFont();
// deep link / automated check entry: #s5 starts at scene 5
(() => {
  const want = QA.start || (location.hash.match(/^#(s\d+|t\d|end)$/) || [])[1];
  if (!want) return;
  const i = SEQ.findIndex(s => s.id === want); if (i < 0) return;
  if (QA.start) { if (QA.choices) G.choices = Object.assign({}, QA.choices); begin(i, !!QA.choices); }
  else { startEl.querySelector('button').textContent = 'Begin here'; startEl.querySelector('button').onclick = null; startEl.querySelector('button').addEventListener('click', () => begin(i, false), { once: true }); }
})();
window.__dbg = () => ({ scene: SEQ[G.sceneIdx] && SEQ[G.sceneIdx].id, shot: D.S && D.S.shot, st: D.st, voice: VOICE.info, starts: VOICE.starts, boundaries: VOICE.boundaries, fails: VOICE.fails, cam: CAMIN.status, camWhy: CAMIN.why, choices: G.choices });

</script>
